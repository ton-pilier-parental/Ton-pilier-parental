Q('Laquelle n’est PAS une des cinq questions classiques (qui, quoi, où, quand, pourquoi) ?',['Quand cela s’est-il passé ?','Quelle est l’opinion du journaliste ?','Où cela s’est-il passé ?'],1,['C’est l’une des cinq.','Oui : ce n’est pas une question d’information.','C’est l’une des cinq.']),
Q('Pour vérifier une information, il est utile de…',['croiser plusieurs sources','la partager vite','lire seulement le titre'],0,['Oui.','Ce n’est pas une vérification.','Le titre peut exagérer.']),
VF('Un titre accrocheur est toujours exact.',false,['Non : il peut exagérer.','Oui, c’est Faux : relis l’article.']),
F('Un texte qui donne un point de vue subjectif exprime une ___.',['opinion'],'Un jugement personnel est une opinion.','Commence par o.'),
M('Associe chaque élément à son rôle.',[['titre','Annonce le sujet'],['chapeau','Résume l’essentiel'],['corps','Détaille les informations'],['source','Origine de l’information']],'Pense à la structure d’un article.'),
T('Touche l’opinion.',['La','piste','mesure','trois','kilomètres','et','c’est','magnifique.'],[6,7],'« C’est magnifique » est un jugement.')]},
{id:'L-09',lv:2,dom:'Lecture',t:'Lire l’image : publicité, caricature, une de journal',kw:'image lire publicité caricature une journal plan cadrage couleurs slogan légende',
f:[['🔎 Je découvre','<p>« Affiche : au premier plan, une bouteille d’eau ; au fond, une montagne enneigée ; slogan : “Pure comme la source”. »</p><p class="mut">La montagne et le slogan suggèrent la pureté de l’eau.</p>',''],['💡 À savoir','<p><b>Lire une image</b>, c’est la décrire, analyser les choix de l’auteur et interpréter son message.</p>',''],['📏 La règle','<ul><li><b>Composition</b> : premier plan / arrière-plan, cadrage, couleurs (chaudes ou froides), lumière.</li><li><b>Texte</b> : slogan, titre, légende.</li><li><b>Publicité</b> : vend un produit, vise une cible, joue sur les émotions.</li><li><b>Caricature</b> : exagère pour critiquer (satire), avec des symboles.</li><li><b>Une de journal</b> : la taille et la place montrent l’importance de l’information.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Élément</th><th>Effet</th></tr><tr><td>montagne enneigée</td><td>suggère la pureté</td></tr><tr><td>bleu</td><td>fraîcheur, calme</td></tr><tr><td>slogan</td><td>fixe le message dans l’esprit</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Une image n’est jamais neutre : le cadrage, les couleurs et la légende orientent le regard.</li></ul>','wa'],['🧠 Astuce','<p>Demande-toi : qui l’a faite ? pour qui ? pour dire quoi ?</p>',''],['✅ Je retiens','<p>Décrire, analyser, interpréter : une image transmet toujours un message.</p>','re']],
qs:[Q('« Affiche : au premier plan, une bouteille d’eau ; au fond, une montagne enneigée ; slogan : “Pure comme la source”. » Que voit-on au premier plan ?',['une bouteille d’eau','une montagne','le slogan'],0,['Oui : c’est l’objet mis en avant.','Elle est au fond.','Le slogan est un texte, pas un plan.']),
Q('« Affiche : au premier plan, une bouteille d’eau ; au fond, une montagne enneigée ; slogan : “Pure comme la source”. » Quel est le rôle de la montagne enneigée ?',['suggérer la pureté','montrer le prix','cacher le produit'],0,['Oui : elle évoque une eau de source.','Le prix n’est pas évoqué.','Le produit est au premier plan.']),
Q('« Affiche : au premier plan, une bouteille d’eau ; au fond, une montagne enneigée ; slogan : “Pure comme la source”. » Que vend cette affiche ?',['de l’eau en bouteille','du chocolat','un voyage en montagne'],0,['Oui : le produit est au premier plan.','Rien n’y fait penser.','La montagne sert de décor, pas de produit.']),
Q('Une caricature utilise surtout…',['l’exagération','l’objectivité','le hasard'],0,['Oui : elle exagère pour critiquer.','Elle prend parti.','Rien n’est laissé au hasard.']),
Q('Les couleurs froides (bleu) évoquent souvent…',['le calme ou la fraîcheur','la colère','la joie vive'],0,['Oui.','La colère évoque plutôt le rouge.','La joie évoque plutôt les couleurs chaudes.']),
VF('Une image est toujours neutre.',false,['Non : elle oriente le regard.','Oui, c’est Faux : cadrage, couleurs et légende orientent.']),
F('La phrase d’accroche courte d’une publicité est le ___.',['slogan'],'Le slogan reste en tête.','Commence par s.'),
M('Associe chaque terme à sa définition.',[['premier plan','Ce qui est au plus près'],['arrière-plan','Ce qui est au fond'],['slogan','Phrase d’accroche'],['légende','Texte qui accompagne l’image']],'Pense à une affiche.'),
T('Touche le mot qui introduit la comparaison.',['Pure','comme','la','source'],[1],'« Comme » est l’outil de comparaison : l’eau est comparée à une source.')]},
{id:'L-10',lv:1,dom:'Lecture',t:'Le journal de lecteur et la lecture d’une œuvre',kw:'journal de lecteur œuvre intégrale fiche de lecture avis citer résumer roman',
f:[['🔎 Je découvre','<p>« Chapitre 3. Il se passe : le héros hésite avant d’ouvrir la lettre. J’ai aimé ce passage parce qu’on sent sa peur. Je me demande ce qu’elle contient. »</p><p class="mut">Une entrée de journal : un résumé, une réaction, une question.</p>',''],['💡 À savoir','<p>Lire une <b>œuvre intégrale</b>, c’est la lire en entier. Le <b>journal de lecteur</b> garde une trace de ta lecture et de tes réactions.</p>',''],['📏 La règle','<ul><li>Note la <b>date</b>, le titre et les chapitres lus.</li><li><b>Résume</b> en une ou deux phrases, avec tes mots.</li><li>Donne ton <b>avis</b> et <b>justifie-le</b> (parce que…).</li><li>Recopie une <b>citation</b> courte entre guillemets, avec la page.</li><li>Note une <b>question</b> ou une <b>prédiction</b>.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Élément</th><th>Exemple</th></tr><tr><td>résumé</td><td>Le héros hésite avant d’ouvrir la lettre.</td></tr><tr><td>réaction</td><td>J’ai aimé ce passage parce qu’on sent sa peur.</td></tr><tr><td>question</td><td>Que contient la lettre ?</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Résumer n’est pas recopier. Un avis sans raison (« c’est bien ») ne dit rien.</li></ul>','wa'],['🧠 Astuce','<p>Modèle : J’ai lu… Il se passe… J’ai aimé / je n’ai pas aimé… parce que… Je me demande…</p>',''],['✅ Je retiens','<p>Journal de lecteur = résumé, avis justifié, citation, question.</p>','re']],
qs:[Q('Que contient un journal de lecteur ?',['tes notes et tes réactions de lecture','seulement le résumé officiel du livre','les réponses du professeur'],0,['Oui : c’est ta trace personnelle.','Ce n’est pas un résumé recopié.','Il est personnel.']),
Q('Quelle phrase donne un avis argumenté ?',['C’est bien.','J’ai aimé ce passage parce que le héros hésite avant d’agir.','Je n’aime pas.'],1,['Il manque la raison.','Oui : l’avis est justifié par « parce que ».','Il manque la raison.']),
Q('Comment cite-t-on un passage ?',['entre guillemets, avec la page','sans guillemets','en le modifiant'],0,['Oui : on signale que ce sont les mots de l’auteur.','On risquerait de copier sans le dire.','Une citation ne se modifie pas.']),
Q('Une œuvre intégrale, c’est…',['un livre lu en entier','un extrait','un résumé'],0,['Oui : du début à la fin.','Ce n’est qu’une partie.','Ce n’est pas le livre.']),
Q('Un bon résumé est…',['court et avec tes mots','copié du livre','plus long que le chapitre'],0,['Oui : il garde l’essentiel.','Ce serait de la copie.','Il doit être plus court.']),
VF('Dans un journal de lecteur, il n’y a pas de mauvaise opinion, à condition de la justifier.',true,['Oui, c’est Vrai.','Non : chacun peut avoir son avis.']),
F('Complète pour justifier un avis : « J’ai aimé ce passage ___ le héros a peur. »',['parce que'],'« Parce que » introduit la raison.','Deux mots.'),
M('Associe chaque élément à son rôle.',[['résumé','Dire l’essentiel avec tes mots'],['réaction','Dire ce que tu as ressenti'],['citation','Recopier un passage entre guillemets'],['question','Noter ce que tu te demandes']],'Pense aux parties du journal.'),
W('Écris une entrée de journal de lecteur (4 à 5 lignes) sur un livre ou un film que tu connais.','Aujourd’hui, j’ai lu… Il se passe…',['J’ai résumé en une ou deux phrases avec mes mots.','J’ai donné mon avis.','J’ai justifié mon avis avec « parce que ».','J’ai noté une question ou une citation.'],'Garde ce carnet : relire ses notes aide à mieux comprendre un livre.')]},
{id:'E-01',lv:2,dom:'Écriture',t:'Écrire un récit avec descriptions et dialogues',kw:'écrire récit narration dialogue description passé simple imparfait tiret schéma narratif connecteurs',
f:[['🔎 Je découvre','<p>« — Tu as entendu ? murmura Lina. — Quoi donc ? — Un bruit, là-bas. »</p><p class="mut">Chaque tiret annonce un changement de personnage qui parle.</p>',''],['💡 À savoir','<p>Un <b>récit</b> raconte une histoire. Pour qu’il soit vivant, on mêle <b>actions</b>, <b>descriptions</b> et <b>dialogues</b>.</p>',''],['📏 La règle','<ul><li><b>Plan</b> : situation initiale → élément perturbateur → péripéties → résolution → situation finale.</li><li><b>Temps</b> : passé simple (actions), imparfait (décor), plus-que-parfait (avant).</li><li><b>Dialogue</b> : un tiret et un retour à la ligne à chaque changement de locuteur ; « — Viens, dit Léa. »</li><li><b>Connecteurs</b> : d’abord, puis, soudain, alors, enfin.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Élément</th><th>Exemple</th></tr><tr><td>action</td><td>Lina ouvrit la porte.</td></tr><tr><td>décor</td><td>Il pleuvait.</td></tr><tr><td>dialogue</td><td>— Viens, dit Léa.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « — Viens. Dit Léa. » → ✅ « — Viens, dit Léa. »</li><li>Ne mélange pas passé simple et présent sans raison.</li></ul>','wa'],['🧠 Astuce','<p>Fais un plan en cinq lignes avant d’écrire. Relis pour les accords et les répétitions.</p>',''],['✅ Je retiens','<p>Récit = plan + temps du récit + descriptions + dialogues correctement ponctués.</p>','re']],
qs:[Q('Quel temps pour les actions principales d’un récit ?',['le passé simple','l’imparfait','le futur'],0,['Oui : il raconte les événements.','Il décrit le décor.','Il ne convient pas au récit au passé.']),
Q('Quel temps pour décrire le décor ?',['le passé simple','l’imparfait','le futur'],1,['Il raconte les actions.','Oui : il installe le décor.','Il ne convient pas.']),
Q('Dans un dialogue, un changement de locuteur se marque par…',['un tiret et un retour à la ligne','une virgule','rien'],0,['Oui.','Ce n’est pas le signe.','Le lecteur serait perdu.']),
Q('Quelle phrase est bien ponctuée ?',['— Viens. dit Léa.','— Viens, dit Léa.','— Viens dit Léa.'],1,['Il faut une virgule, pas un point.','Oui : virgule, puis verbe de parole en minuscule.','Il manque la virgule.']),
Q('Quel connecteur marque un événement inattendu ?',['soudain','d’abord','enfin'],0,['Oui : il annonce un changement.','Il marque le début.','Il marque la fin.']),
VF('On peut mélanger passé simple et présent sans raison dans un récit.',false,['Non : cela perd le lecteur.','Oui, c’est Faux : garde les temps du récit.']),
F('Complète au passé simple : « Soudain, le chat ___ (sauter) sur la table. »',['sauta'],'Passé simple, 3e personne du singulier : -a.','Terminaison -a.'),
M('Associe chaque connecteur à son rôle.',[['Soudain','Événement inattendu'],['Ensuite','Suite d’actions'],['Enfin','Fin de l’histoire'],['Pendant ce temps','Action simultanée']],'Pense à la place dans le récit.'),
W('Écris le début d’un récit (6 à 8 lignes) avec au moins un dialogue.','Ce soir-là, Lina entendit…',['J’ai employé le passé simple pour les actions.','J’ai employé l’imparfait pour décrire.','J’ai écrit au moins deux répliques avec tirets.','J’ai utilisé des connecteurs (soudain, puis…).','J’ai relu les accords.'],'Relis à voix haute : les répétitions se repèrent à l’oreille.')]},
{id:'E-02',lv:2,dom:'Écriture',t:'Écrire un portrait',kw:'écrire portrait physique moral comparaison adjectifs imparfait habitude personnage',
f:[['🔎 Je découvre','<p>« Mme Roux, petite et vive, avait des yeux noirs qui ne laissaient rien passer. Sévère mais juste, elle tapotait la table quand on bavardait. »</p><p class="mut">Le physique, le caractère et une habitude.</p>',''],['💡 À savoir','<p>Un <b>portrait</b> décrit le <b>physique</b> et le <b>caractère</b> d’un personnage pour le faire exister.</p>',''],['📏 La règle','<ul><li><b>Organise</b> : silhouette, visage, vêtements, puis caractère.</li><li><b>Imparfait</b> pour décrire.</li><li><b>Précis</b> : évite « beau, gentil, très » ; choisis des mots exacts.</li><li><b>Comparaison</b> : « rapide comme un chat ».</li><li><b>Montre</b> le caractère par une habitude ou un geste.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Faible</th><th>Précis</th></tr><tr><td>Elle est belle.</td><td>Elle avait un sourire lumineux et des cheveux de jais.</td></tr><tr><td>Il est gentil.</td><td>Il gardait toujours une place à côté de lui pour le nouveau.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Elle est belle. Elle est gentille. » : mots vides et répétition.</li></ul>','wa'],['🧠 Astuce','<p>Méthode : 3 détails physiques + 2 traits de caractère + 1 comparaison + 1 habitude.</p>',''],['✅ Je retiens','<p>Portrait = physique + caractère, avec des mots précis et une habitude révélatrice.</p>','re']],
qs:[Q('Un portrait décrit…',['le physique et le caractère','seulement le lieu','l’intrigue'],0,['Oui.','Ce serait la description d’un lieu.','Ce n’est pas son rôle.']),
Q('Quel temps pour un portrait dans un récit au passé ?',['l’imparfait','le passé simple','le futur'],0,['Oui : on décrit.','Il raconte des actions.','Il ne convient pas.']),
Q('Quelle phrase est la plus précise ?',['Elle était belle.','Elle avait des yeux vifs qui ne laissaient rien passer.','Elle avait des yeux.'],1,['Mots vides.','Oui : détail précis et image.','Trop général.']),
Q('Pour montrer le caractère, on peut…',['décrire une habitude ou un geste','répéter « il est gentil »','donner son nom'],0,['Oui : on montre au lieu de dire.','Ce serait répétitif.','Ce n’est pas un portrait.']),
Q('Quelle figure peut enrichir un portrait ?',['la comparaison','le point-virgule','l’élision'],0,['Oui : « rapide comme un chat ».','Ce n’est pas une figure de style.','Ce n’est pas une figure de style.']),
VF('Un portrait ne décrit que le physique.',false,['Non : il dit aussi le caractère.','Oui, c’est Faux : physique et moral.']),
F('Remplace « très grand » par un adjectif plus précis : ___ (commence par « im »).',['immense'],'« Immense » dit plus et mieux que « très grand ».','Adjectif de 7 lettres.'),
M('Associe chaque élément à sa catégorie.',[['petite et vive','Physique et allure'],['sévère mais juste','Caractère'],['rapide comme un chat','Comparaison'],['tapotait la table','Habitude']],'Distingue décrire, comparer, montrer.'),
W('Écris le portrait d’une personne (un proche ou un personnage inventé) en 5 à 6 lignes.','Je revois encore…',['J’ai décrit le physique (au moins trois détails).','J’ai décrit le caractère.','J’ai utilisé une comparaison.','J’ai montré le caractère par une habitude.','J’ai évité « très », « beau », « gentil ».'],'Un bon portrait fait reconnaître la personne au premier coup d’œil.')]},
{id:'E-03',lv:3,dom:'Écriture',t:'Écrire un texte argumenté',kw:'écrire texte argumenté thèse arguments exemples introduction conclusion connecteurs plan paragraphe',
f:[['🔎 Je découvre','<p>Sujet : « Faut-il supprimer les devoirs à la maison ? »</p><p class="mut">Il faut choisir une position puis la défendre avec des raisons.</p>',''],['💡 À savoir','<p>Écrire un <b>texte argumenté</b>, c’est défendre une thèse avec des arguments et des exemples, dans un plan clair.</p>',''],['📏 La règle','<ul><li><b>Introduction</b> : présente le sujet et la thèse.</li><li><b>Développement</b> : un paragraphe = un argument + un exemple.</li><li><b>Conclusion</b> : reprend la thèse et termine.</li><li><b>Connecteurs</b> : d’abord, ensuite, en effet, par exemple, cependant, en conclusion.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Partie</th><th>Contenu</th></tr><tr><td>introduction</td><td>Les devoirs devraient être allégés.</td></tr><tr><td>argument</td><td>Ils fatiguent les élèves.</td></tr><tr><td>exemple</td><td>Après cinq heures de cours, deux heures de devoirs s’ajoutent.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Les devoirs, c’est nul. » : une opinion sans raison n’est pas un argument.</li></ul>','wa'],['🧠 Astuce','<p>Un paragraphe = un argument + un exemple.</p>',''],['✅ Je retiens','<p>Thèse → arguments + exemples → conclusion, avec des connecteurs.</p>','re']],
qs:[Q('Où présente-t-on la thèse ?',['dans l’introduction','seulement dans la conclusion','dans l’exemple'],0,['Oui : dès le début.','Elle est annoncée plus tôt.','Un exemple illustre, il ne pose pas la thèse.']),
Q('Un paragraphe argumentatif contient…',['un argument et un exemple','seulement des exemples','toute la conclusion'],0,['Oui.','Il manque l’argument.','Elle vient à la fin.']),
Q('Quel connecteur ouvre la conclusion ?',['d’abord','par exemple','en conclusion'],2,['Il ouvre le développement.','Il introduit un exemple.','Oui.']),
Q('Quelle phrase argumente vraiment ?',['Les devoirs, c’est nul.','Les devoirs fatiguent les élèves, car ils ajoutent des heures de travail après la classe.','Je déteste ça.'],1,['Aucune raison.','Oui : il y a une raison avec « car ».','Aucune raison.']),
Q('Un connecteur d’opposition est…',['cependant','en effet','par exemple'],0,['Oui.','Il introduit une cause.','Il introduit un exemple.']),
VF('Une opinion sans raison est un argument.',false,['Non.','Oui, c’est Faux : il faut une raison.']),
O('Remets les parties du texte argumenté dans l’ordre.',['Introduction','Argument 1 et exemple','Argument 2 et exemple','Conclusion'],'On pose la thèse, on la soutient, puis on conclut.'),
M('Associe chaque partie à son rôle.',[['introduction','Présente le sujet et la thèse'],['argument','Raison qui soutient la thèse'],['exemple','Illustre l’argument'],['conclusion','Reprend la thèse et termine']],'Suis le plan du texte.'),
W('Réponds en 8 à 10 lignes : « Faut-il supprimer les devoirs à la maison ? »','Selon moi, les devoirs…',['J’ai posé ma thèse dès l’introduction.','J’ai donné au moins deux arguments.','J’ai illustré chaque argument par un exemple.','J’ai utilisé des connecteurs (d’abord, en effet, cependant…).','J’ai terminé par une conclusion.'],'Un texte argumenté convainc par ses raisons, pas par sa force.')]},
{id:'E-04',lv:2,dom:'Écriture',t:'Écrire une lettre ou un article',kw:'écrire lettre formelle article formule politesse appel chapeau titre destinataire registre',
f:[['🔎 Je découvre','<p>« Madame la Directrice, je vous écris pour vous proposer… Je vous prie d’agréer, Madame, l’expression de mes salutations distinguées. »</p><p class="mut">Le destinataire détermine le ton.</p>',''],['💡 À savoir','<p>La <b>lettre</b> s’adresse à quelqu’un pour demander, remercier ou proposer. L’<b>article</b> informe un lecteur.</p>',''],['📏 La règle','<ul><li><b>Lettre</b> : lieu et date, formule d’appel, corps en paragraphes, formule de politesse, signature.</li><li>À un adulte ou une autorité : <b>vous</b>, registre soutenu ou courant.</li><li><b>Article</b> : titre, chapeau, corps (qui, quoi, où, quand, pourquoi), ton neutre, faits vérifiables.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Élément</th><th>Lettre formelle</th></tr><tr><td>appel</td><td>Madame la Directrice,</td></tr><tr><td>politesse</td><td>Je vous prie d’agréer, Madame, l’expression de mes salutations distinguées.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ tutoyer un directeur. ❌ mettre son opinion dans un article d’information.</li></ul>','wa'],['🧠 Astuce','<p>Avant d’écrire, demande-toi : qui lira ? pour quoi faire ?</p>',''],['✅ Je retiens','<p>Lettre = forme codée selon le destinataire. Article = informer avec des faits.</p>','re']],
qs:[Q('Quelle formule d’appel convient pour écrire à une directrice ?',['Madame la Directrice,','Salut Madame,','Coucou,'],0,['Oui.','Trop familier.','Trop familier.']),
Q('Quelle formule de politesse convient à une lettre formelle ?',['Je vous prie d’agréer, Madame, l’expression de mes salutations distinguées.','Bisous.','À plus !'],0,['Oui.','Trop familier.','Trop familier.']),
Q('Dans une lettre formelle, on dit…',['vous','tu','on'],0,['Oui : marque de respect.','Réservé aux proches.','Trop familier.']),
Q('Le chapeau d’un article sert à…',['résumer l’essentiel','donner l’avis du journaliste','conclure'],0,['Oui.','Ce n’est pas son rôle.','Il ouvre l’article.']),
Q('Un article d’information doit être…',['neutre et factuel','subjectif','poétique'],0,['Oui.','Il donnerait un avis.','Ce n’est pas son but.']),
VF('Une lettre formelle commence par « Salut ».',false,['Non.','Oui, c’est Faux : on utilise « Madame, Monsieur ».']),
F('Dans une lettre, on écrit en haut le lieu et la ___.',['date'],'Le lieu et la date ouvrent la lettre.','Commence par d.'),
M('Associe chaque élément à sa place.',[['lieu et date','En haut de la lettre'],['formule d’appel','Madame, Monsieur'],['formule de politesse','Avant la signature'],['signature','À la fin']],'Suis l’ordre de la lettre.'),
W('Écris une lettre (8 à 10 lignes) à la directrice pour proposer une activité au collège.','Madame la Directrice,',['J’ai écrit le lieu et la date.','J’ai utilisé une formule d’appel.','J’ai vouvoyé la directrice.','J’ai terminé par une formule de politesse.','J’ai signé.'],'Relis : une lettre soignée se remarque.')]},
{id:'E-05',lv:2,dom:'Écriture',t:'Réécrire et améliorer son texte',kw:'réécrire améliorer texte relire supprimer ajouter remplacer déplacer répétitions mots précis',

f:[['🔎 Je découvre','<p>« Il ouvrit la porte. » Lue sur un ton plat, puis avec suspense : la voix change tout.</p><p class="mut">Lire à voix haute, c’est faire comprendre un texte avec sa voix.</p>',''],['💡 À savoir','<p><b>Lire à voix haute</b>, c’est aider l’auditeur à <b>comprendre</b> et à <b>ressentir</b> le texte grâce à la voix.</p>',''],['📏 La règle','<ul><li><b>Préparer</b> : lire d’abord en silence, repérer les mots difficiles.</li><li><b>Voix</b> : volume adapté, articulation nette, débit ni trop rapide ni trop lent.</li><li><b>Pauses</b> : courte à la virgule, plus longue au point.</li><li><b>Intonation</b> : montante pour une question, expressive pour une exclamation.</li><li><b>Regard</b> : lever les yeux de temps en temps.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Signe</th><th>Effet à l’oral</th></tr><tr><td>virgule</td><td>petite pause</td></tr><tr><td>point</td><td>pause plus longue</td></tr><tr><td>?</td><td>voix montante</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Évite la voix monotone et les « euh ». Ne lis pas trop vite.</li></ul>','wa'],['🧠 Astuce','<p>Souligne les pauses et les mots à mettre en valeur ; entraîne-toi deux fois.</p>',''],['✅ Je retiens','<p>Bien lire = préparer, articuler, respecter la ponctuation, varier l’intonation.</p>','re']],

Q('Comment lire une question ?',['avec une intonation montante','en voix monotone','en chuchotant'],0,['Oui.','Cela n’exprime pas la question.','Ce n’est pas la règle.']),
Q('Avant de lire à voix haute, il faut…',['lire d’abord en silence','lire tout de suite','apprendre par cœur'],0,['Oui : on prépare le texte.','On risque de buter.','Ce n’est pas demandé.']),

f:[['🔎 Je découvre','<p>« Aujourd’hui, je vais vous présenter les volcans. Je parlerai d’abord de leur formation, puis de leurs dangers. »</p><p class="mut">Dès l’introduction, le public connaît le sujet et le plan.</p>',''],['💡 À savoir','<p>Un <b>exposé</b> est une présentation orale d’un sujet que l’on a préparé.</p>',''],['📏 La règle','<ul><li><b>Préparer</b> : chercher dans plusieurs sources, faire un plan (introduction, 2 ou 3 parties, conclusion).</li><li><b>Notes</b> : des mots-clés, pas un texte entier.</li><li><b>Support</b> : peu de texte, des images.</li><li><b>Présenter</b> : voix claire, regard vers le public, gestes, respect du temps.</li><li>Connecteurs : d’abord, ensuite, enfin.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Partie</th><th>Rôle</th></tr><tr><td>introduction</td><td>annonce le sujet et le plan</td></tr><tr><td>développement</td><td>présente les idées</td></tr><tr><td>conclusion</td><td>fait le bilan</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Ne lis pas tes notes mot à mot. Ne recopie pas tout le texte sur la diapositive.</li></ul>','wa'],['🧠 Astuce','<p>Répète deux fois à voix haute avec un chronomètre.</p>',''],['✅ Je retiens','<p>Exposé = plan clair, notes en mots-clés, support léger, voix et regard.</p>','re']],

Q('Comment demande-t-on la parole ?',['en levant la main','en criant','en coupant'],0,['Oui.','Ce n’est pas poli.','Ce n’est pas poli.']),

function ctrl(){return`<h1>Préparer un contrôle</h1><p>Sur quoi porte ton contrôle ?</p>`+N.map(n=>`<label class="card row" style="cursor:pointer"><span><b>${n.t}</b><br><span class="mut">${n.dom} · ${st(n.id)[0]}</span></span><input type="checkbox" class="cb" value="${n.id}" style="width:24px;height:24px"></label>`).join('')+`<button class="btn" onclick="ctrlGo()">Voir le plan de séance</button>`}
function ctrlGo(){CT=[...document.querySelectorAll('.cb:checked')].map(x=>x.value);if(!CT.length)return toast('Choisis au moins une notion');go('rappel')}
function rappel(){return`<h1>Étape 1 · Rappel rapide</h1><p class="mut">Lis l’essentiel (2 min). Ensuite : quiz, exercices, exercices plus difficiles, bilan.</p>`+CT.map(id=>{const n=get(id);return`<h2>${n.t}</h2>`+[n.f[2],n.f[n.f.length-1]].map(([h,b,c])=>`<div class="blk ${c}"><h3>${h}</h3>${b}</div>`).join('')}).join('')+`<button class="btn" onclick="ctrlStart()">C’est parti : quiz</button>`}
function ctrlStart(){const sh=a=>a.slice().sort(()=>Math.random()-.5);let qs=[];[['Étape 2 · Quiz',q=>!q.k,3],['Étape 3 · Exercices',q=>q.k=='match'||q.k=='pick',2],['Étape 4 · Plus difficile',q=>q.k=='fill'||q.k=='order',2]].forEach(([ph,f,m])=>CT.forEach(id=>{qs=qs.concat(sh(get(id).qs.filter(f)).slice(0,m).map(q=>Object.assign({},q,{nid:id,ph})))}));P={id:CT[0],i:0,ok:0,xp:0,done:false,ctrl:1,qs};go('prac')}
function chkPick(){const q=P.qs[P.i],s=[...document.querySelectorAll('.chip.on')].map(x=>+x.dataset.j).sort((a,b)=>a-b);if(!s.length)return;const g=s.join()==q.t.join();document.querySelectorAll('.chip').forEach((c,j)=>{c.disabled=true;if(q.t.includes(j))c.classList.add('on')});$('#ok').remove();done(g,g?`<b>✅ Bien vu !</b> ${q.w}`:`<b>Pas tout à fait.</b> Il fallait toucher : <b>${q.t.map(j=>q.tk[j]).join(' ')}</b>. ${q.w}`)}
function mkCode(){return'QP1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function copyCode(){S.bk=tk();save();const c=$('#code');c.value=mkCode();c.select();try{navigator.clipboard.writeText(c.value).then(()=>toast('Code copié ✅'),()=>toast('Copie le code à la main'))}catch(e){toast('Copie le code à la main')}}
function restoreCode(){const v=$('#rcode').value.trim();try{if(!v.startsWith('QP1.'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));if(typeof o.xp!='number'||typeof o.days!='object'||typeof o.m!='object')throw 0;if(!confirm('Remplacer la progression de cet appareil ?'))return;o.name=(o.name||'').replace(/[<>&"']/g,'').slice(0,16);if(!AV.includes(o.av))delete o.av;S=o;save();toast('Progression restaurée ✅');render()}catch(e){toast('Code invalide. Vérifie que tu as tout copié.')}}
const nq=()=>P.qs.filter(q=>q.k!='write').length;
BD.push(['wr','✍️','Premier texte','Terminer un atelier d’écriture',()=>(S.wr||0)>=1]);
function doneW(){const q=P.qs[P.i],t=$('#wt');if(t&&!t.value.trim())return toast('Écris au moins une phrase');const c=document.querySelectorAll('input[type=checkbox]:checked').length,d=tk();P.xp+=15;S.xp+=15;S.wr=(S.wr||0)+1;S.days[d]=(S.days[d]||0)+1;if(t)t.disabled=true;$('#ok').remove();$('#fb').innerHTML=`<div class="fb ok"><b>✅ Bravo, tu as écrit !</b> Tu as coché ${c}/${q.gr.length} critères. ${q.w}</div><button class="btn" onclick="P.i++;render()">${P.i+1<P.qs.length?'Suivant':'Voir mon bilan'}</button>`;chk()}
function render(){const v={home,learn,fiche,train,prog,prac,prof,chall,ctrl,rappel}[V]();$('#app').innerHTML=v;
const nv=V==='fiche'?'learn':/^(prac|ctrl|rappel)$/.test(V)?'train':V;
$('#nav').innerHTML=[['home','🏠','Accueil'],['learn','📖','Réviser'],['train','✏️','S’entraîner'],['chall','🏆','Défis'],['prof','👤','Profil']].map(([k,i,t])=>`<button class="${nv===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${t}</button>`).join('')}
render();
</script></body></html>
