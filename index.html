<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ton Pilier Français</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5FF;--card:#fff;--tx:#1B1A33;--mut:#6B6A85;--pri:#6C4DF6;--pri2:#E9E4FF;--fl:#FF7A1A;--ok:#1E9E5A;--okb:#E0F6EA;--wa:#C2570C;--wab:#FFEBDA;--bd:#E3E0F5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14132A;--card:#1F1D3D;--tx:#F1EFFF;--mut:#A9A6CC;--pri:#9B84FF;--pri2:#2E2A5E;--ok:#4FD38C;--okb:#15382A;--wa:#FFA766;--wab:#3D2A1A;--bd:#36336B}}
:root[data-theme="dark"]{--bg:#14132A;--card:#1F1D3D;--tx:#F1EFFF;--mut:#A9A6CC;--pri:#9B84FF;--pri2:#2E2A5E;--ok:#4FD38C;--okb:#15382A;--wa:#FFA766;--wab:#3D2A1A;--bd:#36336B}
*{box-sizing:border-box}html,body{height:auto;margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.15;margin:0 0 .5em}
main{max-width:720px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:0 0 14px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:14px 20px;font:700 17px inherit;font-family:inherit;cursor:pointer;min-height:48px;width:100%}
.btn.s{background:var(--pri2);color:var(--pri)}
.btn:focus-visible,nav button:focus-visible,.opt:focus-visible{outline:3px solid var(--fl);outline-offset:2px}
.hero{display:flex;align-items:center;gap:14px}
.flame{font-size:64px;line-height:1;animation:fl 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fl{50%{transform:scale(1.08) rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){.flame{animation:none}}
.big{font:800 34px 'Bricolage Grotesque',sans-serif}.mut{color:var(--mut);font-size:15px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar{height:10px;background:var(--pri2);border-radius:9px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .5s}
.tag{display:inline-block;font-size:14px;font-weight:700;border-radius:9px;padding:2px 10px;background:var(--pri2);color:var(--pri)}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.wa{background:var(--wab);color:var(--wa)}
.blk{border-left:5px solid var(--pri);padding:10px 14px;margin:0 0 12px;background:var(--card);border-radius:0 14px 14px 0;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.blk.wa{border-left-color:var(--fl)}.blk.ok{border-left-color:var(--ok)}.blk.re{background:var(--pri2);border-left-color:var(--pri)}
.blk h3{font-size:18px;margin-bottom:4px}.blk p,.blk ul{margin:.3em 0}.blk ul{padding-left:20px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:16px}td,th{border:1px solid var(--bd);padding:6px 9px;text-align:left}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:13px 15px;margin:0 0 10px;font:inherit;cursor:pointer;min-height:48px}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ko{border-color:var(--fl);background:var(--wab)}
.fb{border-radius:14px;padding:12px 14px;margin:6px 0 12px}.fb.ok{background:var(--okb)}.fb.ko{background:var(--wab)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:170px;background:none;border:0;color:var(--mut);font:700 13px inherit;font-family:inherit;padding:8px 2px;border-radius:12px;cursor:pointer;min-height:48px}
nav button span{display:block;font-size:22px}nav button.on{color:var(--pri);background:var(--pri2)}
.note{font-size:14px;color:var(--mut);text-align:center;margin-top:20px}
.inp{width:100%;font:inherit;padding:13px 15px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);margin:6px 0 12px;min-height:48px}
.mrow{display:grid;gap:6px;margin:0 0 12px}.sel{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);min-height:48px;width:100%}.sel.ok{border-color:var(--ok)}.sel.ko{border-color:var(--fl)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.chips.line{min-height:54px;border:2px dashed var(--bd);border-radius:14px;padding:8px}
.chip{background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer;min-height:44px}.chip.av{font-size:26px;padding:6px 12px}.chip.on{border-color:var(--pri);background:var(--pri2)}
.chart{display:flex;gap:4px;align-items:flex-end;height:130px;margin:10px 0}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}.stk{width:100%;background:var(--wab);border-radius:5px 5px 0 0;display:flex;align-items:flex-end;min-height:2px}.stk i{display:block;width:100%;background:var(--pri);border-radius:5px 5px 0 0}.col small{font-size:10px;color:var(--mut)}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}.bd{border:1px solid var(--bd);border-radius:14px;padding:10px;opacity:.55;display:flex;flex-direction:column;gap:2px}.bd.on{opacity:1;background:var(--pri2)}.bd span{font-size:26px}.bd small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--pri);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
nav button{font-size:11px}
summary{cursor:pointer;font:800 18px 'Bricolage Grotesque',system-ui,sans-serif;min-height:32px;list-style:none;display:flex;justify-content:space-between;align-items:center}summary::-webkit-details-marker{display:none}summary::after{content:'＋';color:var(--pri)}details[open]>summary::after{content:'－'}details[open]>summary{margin-bottom:10px}summary:focus-visible{outline:3px solid var(--fl);outline-offset:4px;border-radius:8px}
.pic{margin:12px 0}.pic svg{width:100%;max-width:420px;height:auto;border-radius:14px;border:1px solid var(--bd);display:block}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}.tab{flex:0 0 auto;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:700 15px inherit;font-family:inherit;cursor:pointer;min-height:44px;white-space:nowrap}.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}.tab:focus-visible{outline:3px solid var(--fl);outline-offset:2px}
.nrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.nrow:last-child{border-bottom:0}.nrow b{font-size:16px}.modes{display:grid;gap:10px;margin:0 0 16px}
.brand{font:800 14px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--pri);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
</style></head><body>
<main id="app"></main><div id="toast" role="status"></div>
<nav id="nav"></nav>
<script>
const GOAL=5,$=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('qp4'))}catch(e){}
S=S||{xp:0,days:{},m:{}};
const save=()=>{try{localStorage.setItem('qp4',JSON.stringify(S))}catch(e){}};
const key=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const tk=()=>key(new Date());
function streak(){return sInfo().n}
const LV=['Curieux','Lecteur','Apprenti-écrivain','Explorateur','Conteur','Stratège','Plume affûtée','Éloquent','Maître des mots','Légende'];
const lvl=()=>Math.min(9,Math.floor(S.xp/100));
function sc(id){const a=(S.m[id]||[]).slice(-10);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100):0}
function st(id){const n=(S.m[id]||[]).length,p=sc(id);if(!n)return['Découverte','']; if(n<5)return['En cours',''];if(p<60)return['À renforcer','wa'];if(p>=90&&n>=10)return['Maîtrisée','ok'];if(p>=75)return['Acquise','ok'];return['En cours','']}
const Q=(q,o,a,w)=>({q,o,a,w});
const VF=(q,a,w)=>({q,o:['Vrai','Faux'],a:a?0:1,w,lab:'Vrai ou faux ?'});
const F=(q,ans,w,h)=>({k:'fill',q,ans,w,h});
const M=(q,p,h)=>({k:'match',q,p,h});
const O=(q,it,w)=>({k:'order',q,it,w});
const T=(q,tk,t,w)=>({k:'pick',q,tk,t,w});
const W=(q,am,gr,w,nt)=>({k:'write',q,am,gr,w,nt});
const IMG={
aff:`<svg viewBox="0 0 300 200" role="img" aria-label="Affiche publicitaire : une bouteille d’eau au premier plan, une montagne enneigée au fond, slogan « Pure comme la source »"><rect width="300" height="200" fill="#dff1ff"/><polygon points="0,150 80,60 130,110 190,40 300,150" fill="#8fa8c8"/><polygon points="80,60 66,80 94,80" fill="#fff"/><polygon points="190,40 170,70 210,70" fill="#fff"/><rect y="150" width="300" height="50" fill="#bfe3ff"/><rect x="128" y="86" width="44" height="80" rx="8" fill="#2f86d9"/><rect x="141" y="72" width="18" height="16" rx="3" fill="#1d5fa8"/><rect x="134" y="106" width="32" height="30" rx="3" fill="#fff" opacity=".85"/><text x="150" y="190" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#0b2f5c">Pure comme la source</text></svg>`,
cari:`<svg viewBox="0 0 300 200" role="img" aria-label="Dessin humoristique : un élève minuscule écrasé sous un cartable géant sur lequel est écrit DEVOIRS"><rect width="300" height="200" fill="#fff6e0"/><ellipse cx="150" cy="192" rx="100" ry="6" fill="#e8d8b0"/><rect x="60" y="18" width="180" height="120" rx="22" fill="#e34b4b"/><rect x="100" y="40" width="100" height="26" rx="6" fill="#b92f2f"/><text x="150" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="28" fill="#fff">DEVOIRS</text><line x1="150" y1="168" x2="108" y2="126" stroke="#333" stroke-width="4"/><line x1="150" y1="168" x2="192" y2="126" stroke="#333" stroke-width="4"/><circle cx="150" cy="153" r="13" fill="#ffd8b0" stroke="#333" stroke-width="2"/><line x1="150" y1="166" x2="150" y2="182" stroke="#333" stroke-width="4"/><line x1="150" y1="182" x2="138" y2="196" stroke="#333" stroke-width="4"/><line x1="150" y1="182" x2="162" y2="196" stroke="#333" stroke-width="4"/><path d="M168 146 q5 8 0 12 q-5 -4 0 -12z" fill="#4aa3ff"/></svg>`,
une:`<svg viewBox="0 0 300 220" role="img" aria-label="Une de journal : le titre Le Petit Quotidien, un grand titre « Une piste cyclable ouvre en centre-ville », une photo de piste avec un vélo et sa légende"><rect width="300" height="220" fill="#fbfaf5" stroke="#999"/><text x="150" y="26" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#111">Le Petit Quotidien</text><line x1="10" y1="34" x2="290" y2="34" stroke="#111" stroke-width="2"/><text x="14" y="62" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#111">Une piste cyclable</text><text x="14" y="86" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#111">ouvre en centre-ville</text><rect x="14" y="98" width="150" height="92" fill="#cfe8c8"/><rect x="14" y="150" width="150" height="40" fill="#777"/><line x1="14" y1="170" x2="164" y2="170" stroke="#fff" stroke-dasharray="8 6" stroke-width="2"/><circle cx="68" cy="156" r="10" fill="none" stroke="#111" stroke-width="2"/><circle cx="110" cy="156" r="10" fill="none" stroke="#111" stroke-width="2"/><polyline points="68,156 88,134 110,156" fill="none" stroke="#111" stroke-width="2"/><rect x="178" y="104" width="108" height="6" fill="#bbb"/><rect x="178" y="118" width="100" height="6" fill="#bbb"/><rect x="178" y="132" width="108" height="6" fill="#bbb"/><rect x="178" y="146" width="90" height="6" fill="#bbb"/><text x="14" y="206" font-family="Arial,sans-serif" font-size="9" fill="#444">Photo : la nouvelle piste, ouverte ce matin.</text></svg>`};
const Qi=(img,...a)=>Object.assign(Q(...a),{img});
const N=[{id:'G-12',lv:2,dom:'Grammaire',t:'Voix active et voix passive',kw:'passif actif voix complément agent cod sujet auxiliaire être participe accord',
f:[['🔎 Je découvre','<p>« Le chat attrape la souris. » / « La souris est attrapée par le chat. »</p><p>Qui fait l’action dans chaque phrase ? Qu’est-ce qui change de place ?</p><p class="mut">Dans les deux cas, c’est le chat qui attrape. Mais dans la 2e phrase, la souris devient le sujet.</p>',''],
['💡 À savoir','<p>À la voix <b>active</b>, le sujet <b>fait</b> l’action. À la voix <b>passive</b>, le sujet la <b>subit</b>.</p>',''],
['📏 La règle','<ul><li>Le <b>COD</b> de l’actif devient le <b>sujet</b> du passif.</li><li>L’ancien sujet devient le <b>complément d’agent</b> (par…).</li><li>Le verbe devient <b>être</b> (même temps) + <b>participe passé</b>.</li><li>Le participe <b>s’accorde avec le nouveau sujet</b>.</li></ul><p>Seuls les verbes qui ont un COD peuvent passer au passif.</p>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Actif</th><th>Passif</th></tr><tr><td>Le maire <b>inaugure</b> la bibliothèque.</td><td>La bibliothèque <b>est inaugurée</b> par le maire.</td></tr><tr><td>Les voisins <b>ont entendu</b> un cri.</td><td>Un cri <b>a été entendu</b> par les voisins.</td></tr><tr><td>Le jury <b>récompensera</b> les nouvelles.</td><td>Les nouvelles <b>seront récompensées</b> par le jury.</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>« Elle est tombée » n’est <b>pas</b> du passif : « tomber » n’a pas de COD.</li><li>❌ « Les lettres ont été écrit » → ✅ « écrit<b>es</b> ».</li></ul>','wa'],
['🧠 Astuce','<p>Test « par qui ? » : si tu peux ajouter « par quelqu’un », c’est sans doute du passif. Pour l’auxiliaire, conjugue <b>être</b> au temps de la phrase active.</p>',''],
['✅ Je retiens','<p><b>Passif = être + participe passé.</b> Le COD devient sujet, l’ancien sujet devient complément d’agent. Le participe s’accorde avec le sujet.</p>','re']],
qs:[Q('Quelle phrase est au passif ?',['Les élèves lisent le texte.','Le texte est lu par les élèves.','Les élèves ont lu le texte.'],1,['Non : « les élèves » fait l’action, c’est l’actif.','Oui : le sujet « le texte » subit l’action, avec « est lu » (être + participe) et « par les élèves ».','Non : « les élèves » fait l’action, c’est de l’actif au passé composé.']),
Q('Dans « La porte a été fermée par le gardien », quel est le complément d’agent ?',['La porte','a été fermée','par le gardien'],2,['« La porte » est le sujet : elle subit l’action.','C’est le verbe, pas un complément.','Oui : il indique qui fait l’action, introduit par « par ».']),
Q('Mets au passif : « Le jury récompensera les nouvelles. »',['Les nouvelles sont récompensées par le jury.','Les nouvelles seront récompensées par le jury.','Les nouvelles seront récompensé par le jury.'],1,['Attention au temps : l’actif est au futur, donc « seront ».','Oui : futur (seront) + accord du participe au féminin pluriel.','Le participe doit s’accorder avec le sujet « les nouvelles » : récompensées.']),
Q('Laquelle n’est PAS au passif ?',['Elle est aimée de tous.','Elle est tombée.','Le colis est livré par le facteur.'],1,['Si : « aimer » a un COD et l’agent est introduit par « de ».','Oui, c’est un passé composé : « tomber » n’a pas de COD, donc pas de passif.','Si : « est livré » + agent « par le facteur ».']),
Q('Corrige : « Les lettres ont été écrit par Sophie. »',['écrits','écrites','écrite'],1,['« Lettres » est féminin : le participe doit l’être aussi.','Oui : il s’accorde avec le sujet « les lettres » (féminin pluriel).','Il faut aussi le pluriel : le sujet est « les lettres ».']),
Q('« On a laissé un message. » Quelle version passive est correcte ?',['Un message a été laissé.','Un message est laissé par on.','On a été laissé un message.'],0,['Oui : sans agent précis, « on » disparaît. Passé composé → « a été laissé ».','« On » ne peut pas être complément d’agent, on le supprime.','Le sujet passif est « un message », pas « on ».']),
VF('« Elle est tombée » est une phrase au passif.',false,['Non : « tomber » n’a pas de COD, donc pas de passif.','Oui, c’est Faux : c’est un passé composé avec être. Le test « par qui ? » ne marche pas.']),
F('Complète au passif, au présent : « Le repas ___ par le chef. » (verbe préparer)',['est préparé'],'Présent : « est » + participe passé « préparé », au masculin singulier comme « le repas ».','Conjugue être au présent, puis ajoute le participe passé.'),
M('Associe chaque phrase active à sa phrase passive.',[['Le chef prépare le repas.','Le repas est préparé par le chef.'],['Un artiste a peint ce mur.','Ce mur a été peint par un artiste.'],['Le vent renversera les tentes.','Les tentes seront renversées par le vent.']],'Compare le temps de l’auxiliaire : présent, passé composé, futur.'),
O('Remets les mots dans l’ordre pour former une phrase passive.',['La','vitre','a','été','cassée','par','un','ballon'],'Sujet (La vitre) + être au passé composé (a été) + participe (cassée) + complément d’agent (par un ballon).'),
T('Touche le complément d’agent.',['La','fenêtre','a','été','cassée','par','un','ballon.'],[5,6,7],'Le complément d’agent dit qui ou quoi fait l’action ; il est introduit par « par ». « La fenêtre » est le sujet.')]},
{id:'L-05',lv:2,dom:'Lecture',t:'Le théâtre',kw:'théâtre didascalie aparté monologue réplique quiproquo comédie tragédie acte scène comique',
f:[['🔎 Je découvre','<p><b>CLARA,</b> <i>à part.</i> — Le poisson ! Je l’ai oublié sur le comptoir…<br><b>LÉON,</b> <i>la louche en l’air.</i> — Alors, cette table sept ?<br><b>CLARA,</b> <i>avec un grand sourire.</i> — Ravis, patron !</p><p>Qui sait que le poisson est oublié ? Léon le sait-il ?</p><p class="mut">Le public le sait, pas Léon : c’est ce qui fait sourire.</p>',''],
['💡 À savoir','<p>Un texte de théâtre est écrit <b>pour être joué</b>. Il mêle ce que les personnages <b>disent</b> et ce que l’auteur <b>indique</b>.</p>',''],
['📏 La règle','<ul><li><b>Répliques</b> : paroles des personnages, précédées de leur nom.</li><li><b>Didascalies</b> : indications de l’auteur (gestes, ton, décor), en italique. On ne les dit pas à voix haute.</li><li><b>Acte</b> et <b>scène</b> : divisions de la pièce. La scène change quand un personnage entre ou sort.</li><li><b>Monologue</b> : un personnage seul parle. <b>Aparté</b> : le public entend, les autres personnages sont censés ne pas entendre.</li></ul>',''],
['🧩 Les sources du comique','<ul><li>De <b>gestes</b> : chutes, grimaces.</li><li>De <b>mots</b> : jeux de mots, répétitions.</li><li>De <b>situation</b> : quiproquo (prendre une chose pour une autre).</li><li>De <b>caractère</b> : un défaut exagéré (avarice, vanité).</li></ul>','ok'],
['⚠️ Attention !','<ul><li>On ne lit pas les didascalies à voix haute.</li><li>Aparté ≠ monologue : dans l’aparté, d’autres personnages sont sur scène.</li></ul>','wa'],
['🧠 Astuce','<p>Trois questions : <b>Qui parle ? À qui ? Qui entend ?</b> Aparté = « à part » ; monologue = « mono », seul.</p>',''],
['✅ Je retiens','<p>Un texte de théâtre s’écrit pour être joué : <b>répliques</b> (dites) + <b>didascalies</b> (non dites). L’aparté est entendu du public seulement.</p>','re']],
qs:[Q('Que sont les didascalies ?',['Les paroles dites à voix haute','Les indications de l’auteur pour le jeu, non prononcées','Les titres des actes'],1,['Non : ce sont les répliques qu’on dit à voix haute.','Oui : elles donnent décor, gestes, ton, entrées et sorties, mais restent muettes.','Non : les titres et numéros structurent la pièce, ce ne sont pas des didascalies.']),
Q('Un personnage dit « Il ne se doute de rien ! » alors qu’un autre est sur scène et ne l’entend pas. C’est…',['Un monologue','Un aparté','Une tirade'],1,['Un monologue se dit seul en scène. Ici un autre personnage est présent.','Oui : le public entend, l’autre personnage est censé ne pas entendre.','Une tirade est une très longue réplique : celle-ci est courte.']),
Q('Un quiproquo, c’est…',['Un personnage qui meurt','Un personnage qui prend une chose ou une personne pour une autre','Un personnage qui parle très longtemps'],1,['La mort du personnage relève plutôt de la tragédie.','Oui : « quid pro quo » veut dire « une chose pour une autre ».','Ce serait une tirade, pas un quiproquo.']),
Q('Un personnage seul sur scène parle à voix haute. C’est…',['Un aparté','Une didascalie','Un monologue'],2,['Dans un aparté, d’autres personnages sont sur scène.','Une didascalie est une indication non prononcée.','Oui : mono = seul.']),
Q('Un serveur glisse sur une peau de banane. Quel comique ?',['De gestes','De mots','De caractère'],0,['Oui : le rire vient d’un mouvement du corps.','Aucun mot n’est en cause ici.','Aucun défaut de caractère n’est exagéré ici.']),
Q('« Le roi, seul sur les remparts : Mon pays est perdu et c’est ma faute. » Plutôt…',['Une comédie','Une tragédie','Un quiproquo'],1,['Le ton est grave, pas comique.','Oui : personnage haut placé, ton grave, sentiment de faute. Ce n’est qu’un indice, il faudrait connaître la pièce entière.','Un quiproquo est un ressort comique, pas un genre de pièce.']),
VF('Les comédiens lisent les didascalies à voix haute.',false,['Non : elles guident le jeu mais ne se disent pas.','Oui, c’est Faux : les didascalies restent muettes.']),
F('Une indication de l’auteur pour le jeu, qu’on ne prononce pas, est une ___.',['didascalie'],'Les didascalies donnent gestes, ton, décor, entrées et sorties.','Elle est en italique ou entre parenthèses.'),
M('Associe chaque mot à sa définition.',[['Didascalie','Indication de jeu, non prononcée'],['Réplique','Ce que dit un personnage à son tour'],['Monologue','Un personnage parle seul en scène'],['Aparté','Entendu du public, pas des autres personnages']],'Monologue : mono = seul. Aparté : « à part ».'),
O('Remets les mots dans l’ordre.',['Une','pièce','est','découpée','en','actes','puis','en','scènes'],'Une pièce se divise en actes, eux-mêmes divisés en scènes.'),
T('Touche la didascalie (l’indication de jeu).',['LÉON','(croisant','les','bras)','—','Tu','as','oublié','quelque','chose','?'],[1,2,3],'Une didascalie est une indication de jeu, entre parenthèses ou en italique : on ne la prononce pas. Le reste est la réplique de Léon.')]},
{id:'O-02',lv:3,dom:'Orthographe',t:'L’accord du participe passé',kw:'participe passé accord avoir être cod sujet orthographe e s',
f:[['🔎 Je découvre','<p>« J’ai cueilli des fleurs. » / « Les fleurs que j’ai cueillies sont belles. »</p><p>Pourquoi « cueilli » est-il invariable dans la 1re phrase et écrit « cueillies » dans la 2e ?</p><p class="mut">Dans la 2e phrase, « que » remplace « les fleurs » et se trouve <b>avant</b> le verbe : le participe s’accorde avec lui.</p>',''],
['💡 À savoir','<p>Le participe passé d’un temps composé s’accorde <b>comme un adjectif</b>, mais cela dépend de l’<b>auxiliaire</b> : être ou avoir.</p>',''],
['📏 La règle','<ul><li>Avec <b>être</b> : il s’accorde avec le <b>sujet</b>.</li><li>Avec <b>avoir</b> : il ne s’accorde <b>jamais avec le sujet</b>. Il s’accorde avec le <b>COD</b> seulement si celui-ci est <b>placé avant le verbe</b>.</li><li>Avec <b>avoir</b> et sans COD avant le verbe : il reste <b>invariable</b>.</li></ul><p>Méthode : 1. Repère l’auxiliaire. 2. Avec avoir, pose « qui ? quoi ? » après le verbe. 3. Regarde où est la réponse.</p>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Pourquoi</th></tr><tr><td>Elles sont <b>parties</b>.</td><td>être : accord avec « elles »</td></tr><tr><td>Elle a <b>mangé</b> la pomme.</td><td>avoir : COD après, pas d’accord</td></tr><tr><td>La pomme qu’elle a <b>mangée</b>.</td><td>avoir : COD « que » avant, accord</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>❌ « Elle a mangé<b>e</b> la pomme » : le COD est après le verbe.</li><li>❌ « Les lettres qu’il a écrit » → ✅ « écrit<b>es</b> ».</li><li>❌ « Elle est arrivé » → ✅ « arriv<b>ée</b> » (avec être, on accorde avec le sujet).</li></ul>','wa'],
['🧠 Astuce','<p>Pour entendre l’accord, remplace le verbe par « prendre » : « la pomme qu’elle a <b>prise</b> » (on entend le féminin), donc on écrit « mangée ».</p>',''],
['✅ Je retiens','<p><b>Être</b> : accord avec le sujet. <b>Avoir</b> : accord avec le COD seulement s’il est placé avant le verbe.</p>','re']],
qs:[Q('Complète : « Les élèves sont ___ en retard. »',['arrivé','arrivés','arrivées'],1,['Il manque la marque du pluriel : le sujet est « les élèves ».','Oui : avec être, le participe s’accorde avec le sujet « les élèves » (masculin pluriel).','Rien n’indique que ce sont des filles : on accorde au masculin pluriel.']),
Q('Quelle phrase est correcte ?',['Elle a mangée la pomme.','Elle a mangé la pomme.','Elle a mangés la pomme.'],1,['Avec avoir, on n’accorde pas avec le sujet « elle ». Le COD « la pomme » est après le verbe.','Oui : le COD « la pomme » est placé après le verbe, donc pas d’accord.','Rien ne justifie un « s » : le COD est singulier et placé après le verbe.']),
Q('Complète : « La lettre que Paul a ___ est belle. » (écrire)',['écrit','écrite','écrites'],1,['Attention : le COD « que » (= la lettre) est placé avant le verbe, il faut accorder.','Oui : « que » remplace « la lettre » (féminin singulier), placé avant « a écrit » : on accorde.','« La lettre » est au singulier : pas de « s ».']),
VF('Avec l’auxiliaire avoir, le participe passé s’accorde toujours avec le sujet.',false,['Non : avec avoir, on n’accorde jamais avec le sujet.','Oui, c’est Faux : avec avoir, on accorde seulement avec le COD placé avant le verbe.']),
F('Complète : « Les chansons qu’elle a ___ sont belles. » (chanter)',['chantées'],'« Que » remplace « les chansons » (féminin pluriel), COD placé avant « a chanté » : on accorde, donc « chantées ».','Trouve ce que « que » remplace, puis accorde comme un adjectif.'),
F('Complète : « Mes amies sont ___ hier. » (venir)',['venues'],'Avec être, on accorde avec le sujet « mes amies » (féminin pluriel) : « venues ».','Avec être, accorde avec le sujet.'),
M('Associe chaque phrase à la règle qui l’explique.',[['Elles sont parties.','Accord avec le sujet (être)'],['Elle a mangé la pomme.','Pas d’accord : COD placé après'],['La pomme qu’elle a mangée.','Accord avec le COD placé avant']],'Cherche l’auxiliaire, puis, avec avoir, la place du COD.'),
O('Remets les mots dans l’ordre.',['Les','fleurs','que','j’ai','cueillies','sont','belles.'],'Le COD « que » (= les fleurs) est avant le verbe : cueillies, au féminin pluriel.'),
T('Touche le COD de « as lus », placé avant le verbe.',['Les','livres','que','tu','as','lus','sont','ici.'],[2],'« Que » est le COD de « as lus » et remplace « les livres » (masculin pluriel) : on écrit « lus ».'),
Q('Dans « Elle est tombée », pourquoi « tombée » prend-il un e ?',['Parce que le COD est placé avant le verbe','Parce qu’avec être, on accorde avec le sujet « elle »','Parce que c’est un féminin irrégulier'],1,['Il n’y a pas de COD ici : « tomber » n’en a pas.','Oui : avec être, le participe s’accorde avec le sujet (féminin singulier).','Aucune irrégularité : c’est la règle de l’accord avec le sujet.']),
VF('Dans « Elles ont chanté », le participe passé ne s’accorde pas.',true,['Oui, c’est Vrai : avec avoir, il n’y a pas de COD avant le verbe, donc pas d’accord.','Non : avec avoir, on n’accorde pas avec le sujet, et il n’y a pas de COD avant le verbe.'])]},
{id:'C-02',lv:2,dom:'Conjugaison',t:'Imparfait et passé simple',kw:'imparfait passé simple récit conjugaison temps passé action décor',
f:[['🔎 Je découvre','<p>« Il pleuvait quand la porte s’ouvrit. »</p><p>Quelle action est le décor ? Laquelle fait avancer l’histoire ?</p><p class="mut">« Pleuvait » décrit le décor ; « s’ouvrit » est l’événement.</p>',''],
['💡 À savoir','<p>Dans un récit au passé, l’<b>imparfait</b> décrit le décor et les actions qui durent. Le <b>passé simple</b> raconte les actions principales, courtes et terminées.</p>',''],
['📏 La règle','<ul><li><b>Imparfait</b> : radical de « nous » au présent + -ais, -ais, -ait, -ions, -iez, -aient.</li><li><b>Passé simple</b>, 3e personne : -a / -èrent (il chanta, ils chantèrent) ; -it / -irent (il finit, ils finirent) ; irréguliers : il fut, il eut, il fit, il dit, il vint, il vit.</li></ul>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Imparfait</th><th>Passé simple</th></tr><tr><td>Il chantait.</td><td>Il chanta.</td></tr><tr><td>Elle ouvrait.</td><td>Elle ouvrit.</td></tr><tr><td>Ils allaient.</td><td>Ils allèrent.</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>❌ « il ouvra » → ✅ « il ouvr<b>it</b> ».</li><li>Les verbes en -ger gardent le e devant a et o : « je mangeais », mais « nous mangions ».</li></ul>','wa'],
['🧠 Astuce','<p>Imagine un film : l’imparfait, c’est la caméra qui filme le décor ; le passé simple, c’est le flash de l’action.</p>',''],
['✅ Je retiens','<p><b>Imparfait</b> = décor, durée. <b>Passé simple</b> = action principale, terminée.</p>','re']],
qs:[Q('Dans « Il pleuvait quand la porte s’ouvrit. », quel verbe est au passé simple ?',['pleuvait','s’ouvrit','quand'],1,['« Pleuvait » est à l’imparfait : il décrit le décor.','Oui : « s’ouvrit » est l’action qui fait avancer le récit.','« Quand » n’est pas un verbe.']),
Q('Quel temps utilise-t-on pour décrire le décor dans un récit au passé ?',['Le passé simple','L’imparfait','Le futur'],1,['Le passé simple raconte les actions principales.','Oui : l’imparfait décrit le décor et les actions qui durent.','Le futur ne convient pas pour un récit au passé.']),
Q('Complète : « Hier, il ___ la porte. » (ouvrir, action terminée du récit)',['ouvra','ouvrit','ouvrait'],1,['Ce n’est pas la bonne terminaison : « ouvrir » fait « ouvrit » au passé simple.','Oui : passé simple, 3e personne du singulier.','« Ouvrait » est l’imparfait : il décrit une action en cours, pas un événement terminé.']),
VF('Au passé simple, la 3e personne du singulier se termine par -ait.',false,['Non : -ait est la terminaison de l’imparfait.','Oui, c’est Faux : le passé simple donne « chanta », « finit », « fut »…']),
F('Complète à l’imparfait : « Nous ___ (manger) pendant qu’il pleuvait. »',['mangions'],'Radical de « nous mangeons » → mang- + -ions. Pas de e devant i.','Enlève -ons à « nous mangeons » et ajoute la terminaison.'),
M('Associe chaque forme à son temps.',[['Il chantait','Imparfait, 3e pers. du singulier'],['Il chanta','Passé simple, 3e pers. du singulier'],['Ils chantèrent','Passé simple, 3e pers. du pluriel']],'Regarde la terminaison : -ait imparfait, -a passé simple, -èrent pluriel.'),
O('Remets les mots dans l’ordre.',['Il','pleuvait','quand','la','porte','s’ouvrit.'],'Le décor à l’imparfait, puis l’événement au passé simple.'),
T('Touche le verbe au passé simple.',['Le','vent','soufflait','quand','Léa','sortit.'],[5],'« Sortit » est l’action ; « soufflait » (imparfait) décrit le décor.')]},
{id:'G-14',lv:2,dom:'Grammaire',t:'Discours direct et indirect',kw:'discours rapporté direct indirect guillemets paroles verbe introducteur concordance',
f:[['🔎 Je découvre','<p>Paul dit : « J’arrive demain. » / Paul a dit qu’il arrivait le lendemain.</p><p>Qu’est-ce qui a changé entre les deux phrases ?</p><p class="mut">Les guillemets disparaissent, « je » devient « il », le temps et « demain » changent.</p>',''],
['💡 À savoir','<p>On peut rapporter des paroles de deux façons : telles quelles (<b>discours direct</b>) ou intégrées à la phrase (<b>discours indirect</b>).</p>',''],
['📏 La règle','<ul><li><b>Direct</b> : guillemets ou tiret, verbe introducteur (dit, demanda).</li><li><b>Indirect</b> : pas de guillemets, on introduit avec <b>que</b>, <b>si</b>, <b>ce que</b>…</li><li>On adapte les <b>pronoms</b> (je → il), les <b>temps</b> (présent → imparfait si le verbe introducteur est au passé) et les <b>repères</b> (demain → le lendemain, hier → la veille, ici → là).</li></ul>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Direct</th><th>Indirect</th></tr><tr><td>Paul dit : « J’arrive demain. »</td><td>Paul a dit qu’il arrivait le lendemain.</td></tr><tr><td>Léa demanda : « Pourquoi pleures-tu ? »</td><td>Léa demanda pourquoi il pleurait.</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>En indirect, pas de point d’interrogation ni d’inversion : ❌ « Il demanda pourquoi pleures-tu ? » → ✅ « pourquoi il pleurait ».</li></ul>','wa'],
['🧠 Astuce','<p>Change toujours trois choses : <b>qui</b> parle (pronoms), <b>quand</b> (temps), <b>où/quand</b> (repères).</p>',''],
['✅ Je retiens','<p>Indirect = plus de guillemets + que / si / ce que + pronoms, temps et repères adaptés.</p>','re']],
qs:[Q('Quelle phrase est au discours indirect ?',['« Je pars », dit-il.','Il dit qu’il part.','— Je pars, dit-il.'],1,['Les guillemets indiquent du discours direct.','Oui : pas de guillemets, et « que » introduit les paroles.','Le tiret indique du discours direct.']),
Q('« Il dit : “J’ai faim.” » → « Il dit qu’il ___ faim. »',['ai','a','avait'],1,['« Je » devient « il » : on ne garde pas « ai ».','Oui : le verbe introducteur est au présent, donc le temps ne change pas.','« Avait » est utile quand le verbe introducteur est au passé.']),
Q('« Elle a dit : “Je viendrai demain.” » → « Elle a dit qu’elle viendrait ___. »',['demain','le lendemain','hier'],1,['Quand le récit est au passé, « demain » se transforme.','Oui : demain → le lendemain.','« Hier » change le sens de la phrase.']),
VF('Au discours indirect, on garde les guillemets.',false,['Non : les guillemets disparaissent.','Oui, c’est Faux : les paroles sont intégrées à la phrase.']),
F('Complète : « Paul dit : “Je suis fatigué.” » → « Paul dit qu’___ est fatigué. »',['il'],'« Je » devient « il » car on parle de Paul à la 3e personne.','Qui parle ? Change le pronom.'),
M('Associe chaque repère à son équivalent au discours indirect passé.',[['demain','le lendemain'],['hier','la veille'],['ici','là']],'Ces repères changent quand le récit est au passé.'),
O('Remets les mots dans l’ordre.',['Elle','demanda','pourquoi','il','pleurait.'],'Indirect : pas d’inversion, pas de point d’interrogation.'),
T('Touche le verbe introducteur.',['« Je','viens','demain','»,','dit','Paul.'],[4],'« Dit » introduit les paroles rapportées.')]},
{id:'V-06',lv:2,dom:'Vocabulaire',t:'Les figures de style',kw:'figures style comparaison métaphore personnification hyperbole antithèse image',
f:[['🔎 Je découvre','<p>« Il est fort comme un lion. » / « Cet homme est un lion. »</p><p>Quelle différence entre les deux ?</p><p class="mut">Dans la 1re, il y a « comme ». Pas dans la 2e.</p>',''],
['💡 À savoir','<p>Une <b>figure de style</b> rend une phrase plus expressive, avec une image ou une exagération.</p>',''],
['📏 La règle','<ul><li><b>Comparaison</b> : avec un outil (comme, tel, semblable à).</li><li><b>Métaphore</b> : comparaison sans outil.</li><li><b>Personnification</b> : donner des traits humains à une chose ou un animal.</li><li><b>Hyperbole</b> : exagération.</li><li><b>Antithèse</b> : opposition de deux idées.</li></ul>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Figure</th><th>Exemple</th></tr><tr><td>Comparaison</td><td>rapide comme l’éclair</td></tr><tr><td>Métaphore</td><td>cet homme est un lion</td></tr><tr><td>Personnification</td><td>le vent murmure</td></tr><tr><td>Hyperbole</td><td>mort de rire</td></tr><tr><td>Antithèse</td><td>le meilleur et le pire</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>Comparaison ≠ métaphore : c’est la présence de l’<b>outil</b> qui fait la différence.</li></ul>','wa'],
['🧠 Astuce','<p>Cherche d’abord « comme ». Oui : comparaison. Non, mais il y a une image : métaphore.</p>',''],
['✅ Je retiens','<p>Comparaison = avec outil. Métaphore = sans outil. Personnification = traits humains. Hyperbole = exagération.</p>','re']],
qs:[Q('« Il est fort comme un lion. » est…',['Une comparaison','Une métaphore','Une personnification'],0,['Oui : « comme » est l’outil de comparaison.','Une métaphore n’a pas d’outil.','Personne ici n’a de traits humains attribués à un objet.']),
Q('« Cet homme est un lion. » est…',['Une comparaison','Une métaphore','Une hyperbole'],1,['Il n’y a pas d’outil « comme ».','Oui : image directe, sans outil.','Ce n’est pas une exagération chiffrée.']),
Q('« Le vent murmurait dans les arbres. » est…',['Une hyperbole','Une antithèse','Une personnification'],2,['Il n’y a pas d’exagération.','Il n’y a pas d’opposition d’idées.','Oui : le vent « murmure », comme une personne.']),
VF('Une métaphore contient toujours le mot « comme ».',false,['Non : c’est la comparaison qui a un outil.','Oui, c’est Faux : la métaphore n’a pas d’outil.']),
Q('« Je meurs de faim ! » est…',['Une antithèse','Une hyperbole','Une comparaison'],1,['Il n’y a pas de deux idées opposées.','Oui : c’est une exagération.','Il n’y a pas d’outil de comparaison.']),
F('Dans « rapide comme l’éclair », « comme » est l’___ de comparaison.',['outil'],'L’outil de comparaison relie les deux éléments comparés.','Le mot a 5 lettres.'),
M('Associe chaque exemple à sa figure.',[['Fort comme un lion','Comparaison'],['Cet homme est un lion','Métaphore'],['Le vent murmure','Personnification'],['Mort de rire','Hyperbole']],'Cherche d’abord l’outil « comme », puis l’exagération.'),
T('Touche le mot qui donne un trait humain à la ville.',['La','ville','dort','sous','la','neige.'],[2],'« Dort » est un verbe humain : c’est une personnification.')]},
{id:'G-01',lv:1,dom:'Grammaire',t:'La nature des mots',kw:'nature mots nom déterminant adjectif pronom verbe adverbe préposition conjonction classes grammaticales',
f:[['🔎 Je découvre','<p>« Le petit chat mange vite. »</p><p>Peux-tu ranger ces mots en catégories ?</p><p class="mut">Le (déterminant), petit (adjectif), chat (nom), mange (verbe), vite (adverbe).</p>',''],
['💡 À savoir','<p>La <b>nature</b> d’un mot est sa catégorie grammaticale. Elle répond à : « Quel genre de mot est-ce ? ».</p>',''],
['📏 La règle','<ul><li><b>Nom</b> : désigne une personne, un animal, une chose.</li><li><b>Déterminant</b> : accompagne le nom (le, un, mon).</li><li><b>Adjectif</b> : précise le nom, s’accorde.</li><li><b>Pronom</b> : remplace un nom (il, qui).</li><li><b>Verbe</b> : se conjugue.</li><li><b>Adverbe</b> : invariable (vite, très).</li><li><b>Préposition</b> (à, de, dans) et <b>conjonction</b> (et, mais, que) : mots invariables qui relient.</li></ul>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Mot</th><th>Nature</th></tr><tr><td>le chat</td><td>déterminant + nom</td></tr><tr><td>un vélo <b>rouge</b></td><td>adjectif</td></tr><tr><td>le <b>rouge</b> me plaît</td><td>nom</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>Un même mot peut changer de nature selon la phrase : « rouge » est adjectif ou nom.</li></ul>','wa'],
['🧠 Astuce','<p>Teste : s’il s’accorde, c’est un adjectif ; s’il ne change jamais, c’est un adverbe, une préposition ou une conjonction.</p>',''],
['✅ Je retiens','<p>La nature d’un mot dépend de la phrase : accord, place et rôle t’aident à la trouver.</p>','re']],
qs:[Q('Quelle est la nature de « petit » dans « Le petit chat mange » ?',['Nom','Adjectif','Adverbe'],1,['« Petit » ne désigne pas un être : il précise « chat ».','Oui : il précise le nom et s’accorde (une petite chatte).','Un adverbe ne s’accorde pas.']),
Q('Quelle est la nature de « vite » dans « Il court vite. » ?',['Adjectif','Adverbe','Préposition'],1,['Il ne précise pas un nom et ne s’accorde pas.','Oui : il précise le verbe et reste invariable.','Une préposition introduit un complément : ce n’est pas le cas.']),
Q('Quelle est la nature de « dans » ?',['Préposition','Conjonction','Adverbe'],0,['Oui : « dans » introduit un complément (dans le jardin).','Une conjonction relie des propositions ou des mots.','« Dans » est suivi d’un groupe nominal : c’est une préposition.']),
VF('Un adverbe s’accorde avec le nom.',false,['Non : c’est l’adjectif qui s’accorde.','Oui, c’est Faux : l’adverbe est invariable.']),
Q('Quelle est la nature de « le » dans « le chat » ?',['Pronom','Déterminant','Adjectif'],1,['Un pronom remplace un nom, ici « le » accompagne « chat ».','Oui : il accompagne le nom.','Un adjectif précise le nom, ce n’est pas le cas.']),
M('Associe chaque mot à sa nature.',[['chat','Nom'],['petit','Adjectif'],['il','Pronom'],['mange','Verbe']],'Cherche le déterminant, l’accord et la conjugaison.'),
F('Dans « un vélo rouge », « rouge » est un ___ .',['adjectif'],'« Rouge » précise le nom « vélo » et pourrait s’accorder.','Il précise un nom.'),
T('Touche l’adverbe.',['Le','petit','chat','mange','vite.'],[4],'« Vite » précise le verbe et est invariable.')]},
{id:'G-02',lv:1,dom:'Grammaire',t:'Sujet, verbe et compléments',kw:'sujet verbe complément cod coi cos complément circonstanciel fonction objet',
f:[['🔎 Je découvre','<p>« Léa offre un livre à Tom. »</p><p>Qui offre ? Quoi ? À qui ?</p><p class="mut">Léa (sujet), un livre (COD), à Tom (COS).</p>',''],
['💡 À savoir','<p>La <b>fonction</b> d’un groupe de mots est son rôle dans la phrase.</p>',''],
['📏 La règle','<ul><li><b>Sujet</b> : qui fait l’action ; il commande l’accord du verbe.</li><li><b>COD</b> : complète le verbe sans préposition (qui ? quoi ?).</li><li><b>COI</b> : complète le verbe avec à ou de (à qui ? de quoi ?).</li><li><b>COS</b> : second complément d’objet, introduit par à (après un COD).</li><li><b>Complément circonstanciel</b> : lieu, temps, manière… on peut le déplacer ou le supprimer.</li></ul>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Analyse</th></tr><tr><td>Léa offre <b>un livre</b> à Tom.</td><td>COD</td></tr><tr><td>Sam parle <b>à Zoé</b>.</td><td>COI</td></tr><tr><td>Hier, Sam dort.</td><td>« Hier » : complément circonstanciel de temps</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>Le sujet peut se trouver après le verbe : « Dans la cour jouent des enfants. »</li></ul>','wa'],
['🧠 Astuce','<p>Pose : « Qui est-ce qui… ? » pour le sujet, puis « qui ? quoi ? » après le verbe pour le COD.</p>',''],
['✅ Je retiens','<p>Sujet = qui fait. COD = sans préposition. COI = avec à ou de. Circonstanciel = déplaçable.</p>','re']],
qs:[Q('Dans « Léa offre un livre à Tom. », quel est le COD ?',['Léa','un livre','à Tom'],1,['« Léa » est le sujet.','Oui : offre quoi ? un livre (sans préposition).','« À Tom » est introduit par « à » : c’est le COS.']),
Q('Dans « Léa offre un livre à Tom. », « à Tom » est…',['COD','COS','sujet'],1,['Il est introduit par « à », ce n’est pas un COD.','Oui : second complément d’objet, après le COD.','Il ne fait pas l’action.']),
Q('Dans « Hier, Sam parle à Zoé. », « à Zoé » est…',['COD','COI','complément circonstanciel de temps'],1,['Il est introduit par « à » : ce n’est pas un COD.','Oui : on parle à qui ? à Zoé ; complément introduit par « à ».','« Hier » est le complément de temps, pas « à Zoé ».']),
VF('Le sujet est toujours placé avant le verbe.',false,['Non : il peut être inversé.','Oui, c’est Faux : « Dans la cour jouent des enfants. »']),
F('Dans « Le chien dort dans le jardin. », « dans le jardin » est un complément circonstanciel de ___ .',['lieu'],'Il indique où le chien dort.','Il répond à « où ? ».'),
M('Associe chaque élément à sa fonction.',[['Léa','Sujet'],['un livre','COD'],['à Tom','COS'],['Hier','Complément circonstanciel de temps']],'Cherche le sujet, puis les compléments.'),
T('Touche le COD.',['Léa','offre','un','livre','à','Tom.'],[2,3],'« Un livre » répond à « offre quoi ? » sans préposition.'),
O('Remets les mots dans l’ordre.',['Hier,','Léa','a','offert','un','livre.'],'Complément de temps, sujet, verbe, COD.')]},
{id:'G-06',lv:2,dom:'Grammaire',t:'Phrase simple et phrase complexe',kw:'phrase simple complexe proposition juxtaposition coordination subordination verbe conjugué',
f:[['🔎 Je découvre','<p>« Il pleut. » / « Je reste chez moi parce qu’il pleut. »</p><p>Combien y a-t-il de verbes conjugués ?</p><p class="mut">Un dans la 1re, deux dans la 2e.</p>',''],
['💡 À savoir','<p>Une phrase contient autant de <b>propositions</b> que de verbes conjugués.</p>',''],
['📏 La règle','<ul><li><b>Phrase simple</b> : un seul verbe conjugué.</li><li><b>Phrase complexe</b> : plusieurs verbes conjugués.</li><li><b>Juxtaposition</b> : propositions séparées par une ponctuation.</li><li><b>Coordination</b> : reliées par mais, ou, et, donc, or, ni, car.</li><li><b>Subordination</b> : reliées par une conjonction de subordination (que, quand, parce que), ou un pronom relatif.</li></ul>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Relation</th></tr><tr><td>Il sort, il marche.</td><td>juxtaposition</td></tr><tr><td>Il sort et il marche.</td><td>coordination</td></tr><tr><td>Il sort quand il veut.</td><td>subordination</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>Seuls les verbes <b>conjugués</b> comptent : « Je veux partir » n’a qu’un verbe conjugué.</li></ul>','wa'],
['🧠 Astuce','<p>Compte les verbes conjugués : c’est le nombre de propositions.</p>',''],
['✅ Je retiens','<p>1 verbe conjugué = phrase simple. Plusieurs = phrase complexe.</p>','re']],
qs:[Q('« Il pleut. » est…',['une phrase simple','une phrase complexe','une phrase juxtaposée'],0,['Oui : un seul verbe conjugué.','Il n’y a qu’un verbe conjugué.','Il n’y a pas de deux propositions.']),
Q('Combien de propositions dans « Je reste chez moi parce qu’il pleut. » ?',['Une','Deux','Trois'],1,['Il y a deux verbes conjugués : reste et pleut.','Oui : deux verbes conjugués, donc deux propositions.','Il n’y a que deux verbes conjugués.']),
Q('Combien de propositions dans « Je veux partir. » ?',['Une','Deux','Trois'],0,['Oui : « veux » est conjugué, « partir » est à l’infinitif.','« Partir » est un infinitif, il ne compte pas.','Il n’y a qu’un verbe conjugué.']),
Q('« Il sort, il marche, il respire. » : les propositions sont…',['coordonnées','juxtaposées','subordonnées'],1,['Il n’y a pas de mot de coordination.','Oui : elles sont séparées par des virgules.','Il n’y a pas de conjonction de subordination.']),
Q('« Il est tard mais je reste. » : « mais » exprime…',['une juxtaposition','une coordination','une subordination'],1,['Il y a un mot de liaison.','Oui : « mais » est une conjonction de coordination.','« Mais » ne marque pas de dépendance.']),
VF('Une phrase complexe contient un seul verbe conjugué.',false,['Non : c’est la phrase simple.','Oui, c’est Faux : une phrase complexe en a plusieurs.']),
M('Associe chaque phrase à sa relation.',[['Il sort, il marche.','Juxtaposition'],['Il sort et il marche.','Coordination'],['Il sort quand il veut.','Subordination']],'Cherche la ponctuation, « et », ou « quand ».'),
T('Touche les mots qui introduisent la subordonnée.',['Je','reste','parce','que','tu','pars.'],[2,3],'« Parce que » est une locution conjonctive de subordination.')]},
{id:'C-01',lv:1,dom:'Conjugaison',t:'Le présent de l’indicatif',kw:'présent indicatif conjugaison verbes groupes irréguliers être avoir aller faire dire terminaisons',
f:[['🔎 Je découvre','<p>« Je finis, tu finis, nous finissons. »</p><p>Que remarques-tu sur le radical ?</p><p class="mut">Il devient « finiss- » au pluriel.</p>',''],
['💡 À savoir','<p>Le <b>présent</b> exprime ce qui se passe maintenant, une habitude ou une vérité générale.</p>',''],
['📏 La règle','<ul><li><b>1er groupe</b> (-er) : -e, -es, -e, -ons, -ez, -ent.</li><li><b>2e groupe</b> (-ir, -issons) : -is, -is, -it, -issons, -issez, -issent.</li><li><b>3e groupe</b> : verbes irréguliers (être, avoir, aller, faire, dire, prendre…).</li></ul>',''],
['🧩 Exemples','<div class="tw"><table><tr><th>Verbe</th><th>Formes</th></tr><tr><td>être</td><td>je suis, nous sommes, ils sont</td></tr><tr><td>aller</td><td>je vais, nous allons, ils vont</td></tr><tr><td>faire</td><td>vous faites</td></tr><tr><td>dire</td><td>vous dites</td></tr></table></div>','ok'],
['⚠️ Attention !','<ul><li>❌ « vous disez » → ✅ « vous dites ». ❌ « tu chante » → ✅ « tu chantes ».</li></ul>','wa'],
['🧠 Astuce','<p>À « vous », la terminaison est -ez, sauf pour vous êtes, vous faites, vous dites.</p>',''],
['✅ Je retiens','<p>Repère le groupe, puis applique la terminaison. Les verbes irréguliers s’apprennent par cœur.</p>','re']],
qs:[Q('Complète : « Nous ___ à l’école. » (aller)',['allons','allez','vont'],0,['Oui : nous allons.','« Allez » va avec « vous ».','« Vont » va avec « ils ».']),
Q('Complète : « Ils ___ contents. » (être)',['sont','êtes','est'],0,['Oui : ils sont.','« Êtes » va avec « vous ».','« Est » va avec « il ».']),
Q('Complète : « Vous ___ la vérité. » (dire)',['dites','disez','disent'],0,['Oui : vous dites.','Cette forme n’existe pas : vous dites.','« Disent » va avec « ils ».']),
Q('« Elle finit » est à quel groupe ?',['1er groupe','2e groupe','3e groupe'],1,['Les verbes du 1er groupe finissent en -er.','Oui : finir, -issons au pluriel.','Finir suit le modèle régulier en -issons.']),
VF('« Tu chante une chanson » est correct.',false,['Non : il manque le -s.','Oui, c’est Faux : « tu chantes ».']),
F('Complète : « Je ___ (prendre) le bus. »',['prends'],'Prendre : je prends, tu prends, il prend.','Le radical est pren-, avec un s.'),
M('Associe chaque forme à son infinitif.',[['Je suis','Être'],['Nous avons','Avoir'],['Ils vont','Aller'],['Vous faites','Faire']],'Ces verbes sont irréguliers.'),
O('Remets les mots dans l’ordre.',['Nous','finissons','nos','devoirs.'],'Sujet, verbe conjugué, complément.')]},
{id:'G-03',lv:2,dom:'Grammaire',t:'Attribut du sujet et complément d’agent',kw:'attribut sujet verbe d’état complément d’agent passif être sembler devenir paraître',
f:[['🔎 Je découvre','<p>« Le ciel paraît sombre. » / « La porte est fermée par le gardien. »</p><p class="mut">« Sombre » dit comment est le ciel ; « par le gardien » dit qui ferme.</p>',''],['💡 À savoir','<p>L’<b>attribut du sujet</b> dit comment est le sujet. Le <b>complément d’agent</b> dit qui fait l’action dans une phrase passive.</p>',''],['📏 La règle','<ul><li><b>Attribut</b> : après un verbe d’état (être, paraître, sembler, devenir, rester). Il s’accorde avec le sujet.</li><li><b>Complément d’agent</b> : seulement au passif, introduit par <b>par</b> ou <b>de</b>. À l’actif, il devient sujet.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Fonction</th></tr><tr><td>Elle semble <b>fatiguée</b>.</td><td>attribut du sujet</td></tr><tr><td>Léa est <b>médecin</b>.</td><td>attribut du sujet</td></tr><tr><td>Le pont est construit <b>par des ouvriers</b>.</td><td>complément d’agent</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Attribut ≠ COD : avec un verbe d’état, on ne « subit » rien. « Il devient grand » : attribut.</li></ul>','wa'],['🧠 Astuce','<p>Remplace le verbe par « est » : si la phrase garde son sens, c’est un attribut.</p>',''],['✅ Je retiens','<p>Attribut = après un verbe d’état, accordé avec le sujet. Complément d’agent = seulement au passif.</p>','re']],
qs:[Q('Dans « Le ciel paraît sombre. », « sombre » est…',['COD','attribut du sujet','complément circonstanciel'],1,['« Paraître » est un verbe d’état : il n’a pas de COD.','Oui : « sombre » caractérise le ciel après un verbe d’état.','« Sombre » ne répond pas à où, quand ou comment l’action se passe.']),
Q('Quel verbe est un verbe d’état ?',['manger','sembler','courir'],1,['« Manger » exprime une action.','Oui : « sembler » relie le sujet à son attribut.','« Courir » exprime une action.']),
Q('Dans « La porte est fermée par le gardien. », quel est le complément d’agent ?',['La porte','est fermée','par le gardien'],2,['C’est le sujet.','C’est le verbe au passif.','Oui : il dit qui fait l’action, introduit par « par ».']),
VF('L’attribut du sujet s’accorde avec le sujet.',true,['Oui, c’est Vrai : « Elle semble fatiguée ».','Non : il s’accorde bien avec le sujet.']),
VF('Le complément d’agent existe à la voix active.',false,['Non : il n’existe qu’au passif.','Oui, c’est Faux : il apparaît seulement au passif.']),
F('Dans « Elle est devenue médecin. », « médecin » est l’___ du sujet.',['attribut'],'« Devenir » est un verbe d’état : « médecin » caractérise « elle ».','Il suit un verbe d’état.'),
M('Associe chaque élément à sa fonction.',[['fatiguée (Elle semble fatiguée.)','Attribut du sujet'],['une pomme (Il mange une pomme.)','COD'],['par un ballon (La vitre est cassée par un ballon.)','Complément d’agent']],'Cherche d’abord le type de verbe.'),
T('Touche l’attribut du sujet.',['Léa','est','devenue','médecin.'],[3],'« Médecin » caractérise Léa après le verbe d’état « est devenue ».')]},
{id:'G-04',lv:2,dom:'Grammaire',t:'Les expansions du nom',kw:'expansions nom épithète complément du nom relative apposition adjectif enrichir',
f:[['🔎 Je découvre','<p>« Le chat noir de ma voisine qui dort sur le muret… »</p><p class="mut">Chaque groupe de mots ajoute une précision sur « chat ».</p>',''],['💡 À savoir','<p>Une <b>expansion du nom</b> ajoute une précision à un nom. On peut la supprimer sans rendre la phrase fausse.</p>',''],['📏 La règle','<ul><li><b>Adjectif épithète</b> : accolé au nom (un chat <b>noir</b>).</li><li><b>Complément du nom</b> : introduit par une préposition (le chat <b>de ma voisine</b>).</li><li><b>Proposition relative</b> : introduite par un pronom relatif (le chat <b>qui dort</b>).</li><li><b>Apposition</b> : groupe séparé par des virgules (Paul, <b>mon voisin</b>, arrive).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Expansion</th><th>Exemple</th></tr><tr><td>épithète</td><td>un ciel <b>bleu</b></td></tr><tr><td>complément du nom</td><td>une tasse <b>de thé</b></td></tr><tr><td>relative</td><td>le chien <b>qui aboie</b></td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Épithète ≠ attribut : l’épithète est accolée au nom, l’attribut passe par un verbe d’état.</li></ul>','wa'],['🧠 Astuce','<p>Supprime l’expansion : si la phrase reste correcte, c’était une expansion.</p>',''],['✅ Je retiens','<p>Quatre expansions : épithète, complément du nom, relative, apposition.</p>','re']],
qs:[Q('Dans « un chat noir », « noir » est…',['attribut du sujet','épithète','complément du nom'],1,['Il n’y a pas de verbe d’état.','Oui : adjectif accolé au nom.','Il n’est pas introduit par une préposition.']),
Q('Dans « le chat de ma voisine », « de ma voisine » est…',['COD','complément du nom','épithète'],1,['Il ne complète pas un verbe.','Oui : introduit par « de », il complète le nom « chat ».','Ce n’est pas un adjectif.']),
Q('Dans « le chat qui dort », « qui dort » est…',['une proposition relative','une complétive','un complément du nom'],0,['Oui : elle est introduite par le pronom relatif « qui ».','Une complétive complète un verbe.','Un complément du nom n’a pas de verbe conjugué.']),
Q('Dans « Paul, mon voisin, arrive. », « mon voisin » est…',['épithète','apposition','COD'],1,['Ce n’est pas un adjectif.','Oui : groupe séparé par des virgules qui précise « Paul ».','Il ne complète pas le verbe.']),
VF('Une expansion du nom est obligatoire pour que la phrase soit correcte.',false,['Non : on peut la supprimer.','Oui, c’est Faux : c’est un ajout facultatif.']),
F('Dans « un ciel bleu », « bleu » est un adjectif ___ .',['épithète'],'Il est accolé au nom, sans verbe d’état.','Mot de 8 lettres.'),
M('Associe chaque expansion à son type.',[['noir (un chat noir)','Adjectif épithète'],['de ma voisine (le chat de ma voisine)','Complément du nom'],['qui dort (le chat qui dort)','Proposition relative']],'Cherche la préposition, le pronom relatif, l’adjectif.'),
T('Touche le complément du nom.',['Le','chat','noir','de','ma','voisine','dort.'],[3,4,5],'« De ma voisine » est introduit par une préposition et complète « chat ».')]},
{id:'G-05',lv:2,dom:'Grammaire',t:'La proposition subordonnée relative',kw:'relative pronom relatif qui que où dont antécédent subordonnée',
f:[['🔎 Je découvre','<p>« Le livre que j’ai lu est passionnant. »</p><p class="mut">« Que j’ai lu » précise « livre », son antécédent.</p>',''],['💡 À savoir','<p>La <b>proposition relative</b> complète un nom, appelé <b>antécédent</b>. Elle est introduite par un <b>pronom relatif</b>.</p>',''],['📏 La règle','<ul><li><b>qui</b> : sujet du verbe (la fille <b>qui</b> chante).</li><li><b>que</b> : COD (le livre <b>que</b> je lis).</li><li><b>où</b> : lieu ou temps (la ville <b>où</b> je vis).</li><li><b>dont</b> : complément introduit par « de » (le film <b>dont</b> je parle).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Pronom</th></tr><tr><td>La fille qui chante.</td><td>sujet</td></tr><tr><td>Le livre que je lis.</td><td>COD</td></tr><tr><td>Le film dont je parle.</td><td>« parler de »</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Le film que je parle » → ✅ « dont je parle » (on parle <b>de</b> quelque chose).</li></ul>','wa'],['🧠 Astuce','<p>Repère la fonction : sujet → qui ; COD → que ; lieu → où ; de → dont.</p>',''],['✅ Je retiens','<p>Qui = sujet. Que = COD. Où = lieu ou temps. Dont = « de ».</p>','re']],
qs:[Q('Dans « la fille qui chante », « qui » est…',['un pronom relatif sujet','un COD','une conjonction'],0,['Oui : « qui » est sujet de « chante ».','Il n’est pas COD : il est sujet.','Une conjonction n’a pas d’antécédent.']),
Q('Dans « le livre que je lis », quel est l’antécédent de « que » ?',['je','livre','lis'],1,['« Je » est le sujet.','Oui : « que » remplace « livre ».','« Lis » est le verbe.']),
Q('Complète : « Le film ___ je parle est drôle. »',['que','qui','dont'],2,['On dit « parler de » : il faut « dont ».','« Qui » serait sujet, ce n’est pas le cas.','Oui : « parler de » donne « dont ».']),
Q('Dans « la ville où je vis », « où » exprime…',['le lieu','la manière','la cause'],0,['Oui : « où » désigne le lieu.','« Où » ne dit pas comment.','« Où » ne dit pas pourquoi.']),
Q('Complète : « Le livre ___ tu m’as prêté est passionnant. »',['qui','que','dont'],1,['« Tu » est déjà sujet : ce n’est pas « qui ».','Oui : « que » est COD de « as prêté ».','On ne dit pas « prêter de ».']),
VF('Le pronom relatif « qui » est toujours COD.',false,['Non : « qui » est sujet.','Oui, c’est Faux : « qui » est sujet du verbe.']),
M('Associe chaque pronom relatif à sa fonction.',[['qui','Sujet'],['que','COD'],['où','Lieu ou temps'],['dont','Complément introduit par de']],'Regarde le rôle du pronom dans la relative.'),
T('Touche le pronom relatif.',['Le','livre','que','j’ai','lu','est','passionnant.'],[2],'« Que » relie la relative à son antécédent « livre ».')]},
{id:'G-07',lv:2,dom:'Grammaire',t:'La subordonnée complétive',kw:'complétive que conjonction subordination subjonctif verbe principale je pense que',
f:[['🔎 Je découvre','<p>« Je pense que tu as raison. »</p><p class="mut">« Que tu as raison » répond à « je pense quoi ? ».</p>',''],['💡 À savoir','<p>La <b>proposition complétive</b> complète le verbe de la principale, souvent comme un COD.</p>',''],['📏 La règle','<ul><li>Elle est introduite par la conjonction <b>que</b>.</li><li>Après des verbes de pensée ou de parole (penser, dire, savoir) : indicatif.</li><li>Après des verbes de volonté ou « il faut que » : <b>subjonctif</b>.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Mode</th></tr><tr><td>Je pense que tu viens.</td><td>indicatif</td></tr><tr><td>Je veux que tu viennes.</td><td>subjonctif</td></tr><tr><td>Il dit qu’il est tard.</td><td>indicatif</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>« que » conjonction ≠ « que » pronom relatif : le pronom relatif a un nom antécédent.</li></ul>','wa'],['🧠 Astuce','<p>Remplace la complétive par « cela » : « Je pense cela » → complétive COD.</p>',''],['✅ Je retiens','<p>Complétive = introduite par « que », elle complète le verbe. Subjonctif après vouloir que, il faut que.</p>','re']],
qs:[Q('Dans « Je pense que tu as raison. », « que tu as raison » est…',['une relative','une complétive','une circonstancielle'],1,['Il n’y a pas d’antécédent nominal.','Oui : elle complète le verbe « pense ».','Elle ne donne pas de circonstance.']),
Q('Dans « Je pense que tu as raison. », « que » est…',['une conjonction de subordination','un pronom relatif','un adverbe'],0,['Oui : il n’a pas d’antécédent.','Il n’y a pas de nom à reprendre.','Un adverbe ne relie pas deux propositions.']),
Q('Dans « Le livre que je lis est beau. », « que » est…',['une conjonction de subordination','un pronom relatif','un adverbe'],1,['Il reprend « livre ».','Oui : il a pour antécédent « livre ».','Il ne précise pas le verbe.']),
Q('Complète : « Je veux que tu ___. » (venir)',['viens','viennes','viendras'],1,['Après « vouloir que », on emploie le subjonctif.','Oui : subjonctif présent.','Le futur ne convient pas après « vouloir que ».']),
Q('Complète : « Il faut que nous ___. » (partir)',['partons','partions','partirons'],1,['Après « il faut que », on emploie le subjonctif.','Oui : subjonctif présent, nous partions.','Le futur ne convient pas.']),
VF('On peut remplacer une complétive COD par « cela ».',true,['Oui, c’est Vrai : « Je pense cela ».','Non : le test fonctionne.']),
F('Dans « Il dit qu’il est tard. », « que » est une ___ de subordination.',['conjonction'],'« Que » relie la complétive à « dit ».','Mot de 10 lettres.'),
T('Touche la proposition complétive.',['Je','pense','que','tu','as','raison.'],[2,3,4,5],'La complétive commence à « que » et complète « pense ».')]},
{id:'G-08',lv:1,dom:'Grammaire',t:'Compléments circonstanciels de temps, lieu, manière',kw:'complément circonstanciel temps lieu manière quand où comment cc',
f:[['🔎 Je découvre','<p>« Hier, dans la cour, Sam a couru rapidement. »</p><p class="mut">Trois compléments disent quand, où et comment.</p>',''],['💡 À savoir','<p>Le <b>complément circonstanciel</b> (CC) précise les circonstances de l’action : quand, où, comment…</p>',''],['📏 La règle','<ul><li>CC de <b>temps</b> : quand ?</li><li>CC de <b>lieu</b> : où ?</li><li>CC de <b>manière</b> : comment ?</li><li>Il peut être <b>déplacé</b> ou <b>supprimé</b>.</li><li>Nature variée : nom (hier), groupe prépositionnel (dans la cour), adverbe (rapidement), subordonnée.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Complément</th><th>Type</th></tr><tr><td><b>Hier</b>, Sam dort.</td><td>temps</td></tr><tr><td>Sam joue <b>dans la cour</b>.</td><td>lieu</td></tr><tr><td>Sam court <b>rapidement</b>.</td><td>manière</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>CC ≠ COI : « Il parle <b>à Zoé</b> » (COI, non déplaçable) ≠ « Il parle <b>dans la cour</b> » (CC).</li></ul>','wa'],['🧠 Astuce','<p>Essaie de déplacer ou de supprimer le groupe : si c’est possible, c’est un CC.</p>',''],['✅ Je retiens','<p>CC = circonstance, déplaçable et supprimable : temps, lieu, manière.</p>','re']],
qs:[Q('Dans « Hier, Sam a couru. », « Hier » est un CC de…',['temps','lieu','manière'],0,['Oui : il répond à « quand ? ».','Il ne répond pas à « où ? ».','Il ne répond pas à « comment ? ».']),
Q('Dans « Sam joue dans la cour. », « dans la cour » est un CC de…',['temps','lieu','manière'],1,['Il ne dit pas quand.','Oui : il répond à « où ? ».','Il ne dit pas comment.']),
Q('Dans « Elle chante avec joie. », « avec joie » est un CC de…',['lieu','temps','manière'],2,['Il ne dit pas où.','Il ne dit pas quand.','Oui : il répond à « comment ? ».']),
VF('Un complément circonstanciel peut souvent être supprimé ou déplacé.',true,['Oui, c’est Vrai.','Non : c’est une de ses caractéristiques.']),
F('Dans « Il part demain. », « demain » est un CC de ___ .',['temps'],'« Demain » répond à « quand ? ».','Il répond à « quand ? ».'),
M('Associe chaque complément à son type.',[['Hier','Temps'],['dans la cour','Lieu'],['rapidement','Manière']],'Pose les questions quand, où, comment.'),
T('Touche le CC de lieu.',['Sam','court','dans','la','cour','le','matin.'],[2,3,4],'« Dans la cour » répond à « où ? ».'),
O('Remets les mots dans l’ordre.',['Le','matin,','Sam','court','dans','la','cour.'],'CC de temps, sujet, verbe, CC de lieu.')]},
{id:'G-09',lv:3,dom:'Grammaire',t:'Subordonnées de cause, conséquence, but',kw:'subordonnée circonstancielle cause conséquence but parce que pour que si bien que afin que subjonctif',
f:[['🔎 Je découvre','<p>« Je reste chez moi parce qu’il pleut. »</p><p class="mut">La subordonnée explique <b>pourquoi</b> je reste.</p>',''],['💡 À savoir','<p>Une <b>subordonnée circonstancielle</b> précise la circonstance de l’action : la cause, la conséquence ou le but.</p>',''],['📏 La règle','<ul><li><b>Cause</b> (pourquoi ?) : parce que, puisque, comme + indicatif.</li><li><b>Conséquence</b> (quel résultat ?) : si bien que, de sorte que, si… que, tellement… que + indicatif.</li><li><b>But</b> (dans quel but ?) : pour que, afin que + <b>subjonctif</b>.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Type</th></tr><tr><td>Il tombe parce qu’il a glissé.</td><td>cause</td></tr><tr><td>Il a glissé si bien qu’il est tombé.</td><td>conséquence</td></tr><tr><td>Il parle fort pour que tu entendes.</td><td>but</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Cause ≠ conséquence : inverse-les pour voir laquelle vient d’abord. « Car » est une conjonction de coordination, pas de subordination.</li></ul>','wa'],['🧠 Astuce','<p>« Pourquoi ? » = cause. « Dans quel but ? » = but. « Quel résultat ? » = conséquence.</p>',''],['✅ Je retiens','<p>Cause : parce que. Conséquence : si bien que. But : pour que, avec subjonctif.</p>','re']],
qs:[Q('« Je reste parce qu’il pleut. » : « parce qu’il pleut » exprime…',['la cause','la conséquence','le but'],0,['Oui : il répond à « pourquoi ? ».','Ce n’est pas un résultat.','Ce n’est pas un but visé.']),
Q('« Il parle fort pour que tout le monde l’entende. » exprime…',['la cause','le but','la conséquence'],1,['« Pour que » n’exprime pas la cause.','Oui : « pour que » exprime le but, avec subjonctif.','Ce n’est pas un résultat.']),
Q('« Il a tellement couru qu’il est épuisé. » exprime…',['le but','la cause','la conséquence'],2,['Il n’y a pas de but visé.','L’épuisement est un résultat, pas une cause.','Oui : « tellement… que » exprime la conséquence.']),
Q('Complète : « Il explique afin que nous ___. » (comprendre)',['comprenons','comprenions','comprendrons'],1,['Après « afin que », on emploie le subjonctif.','Oui : subjonctif, nous comprenions.','Le futur ne convient pas après « afin que ».']),
Q('Quelle locution exprime la cause ?',['si bien que','parce que','pour que'],1,['« Si bien que » exprime la conséquence.','Oui : « parce que » exprime la cause.','« Pour que » exprime le but.']),
VF('« Pour que » est suivi du subjonctif.',true,['Oui, c’est Vrai.','Non : « pour que » appelle le subjonctif.']),
M('Associe chaque locution à sa circonstance.',[['parce que','Cause'],['si bien que','Conséquence'],['afin que','But']],'Pose : pourquoi ? quel résultat ? dans quel but ?'),
T('Touche la locution qui exprime le but.',['Il','parle','fort','pour','que','tu','entendes.'],[3,4],'« Pour que » introduit le but.')]},
{id:'G-10',lv:3,dom:'Grammaire',t:'Subordonnées d’opposition, concession, condition',kw:'opposition concession condition bien que quoique alors que si même si hypothèse conditionnel',
f:[['🔎 Je découvre','<p>« Bien qu’il soit fatigué, il continue. »</p><p class="mut">La fatigue aurait dû l’arrêter, mais non.</p>',''],['💡 À savoir','<p>D’autres subordonnées circonstancielles expriment l’opposition, la concession et la condition.</p>',''],['📏 La règle','<ul><li><b>Opposition</b> : alors que, tandis que (indicatif).</li><li><b>Concession</b> : bien que, quoique (subjonctif) ; même si (indicatif).</li><li><b>Condition</b> : si + présent → futur ; si + imparfait → conditionnel ; à condition que + subjonctif.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Type</th></tr><tr><td>Il travaille alors que son frère dort.</td><td>opposition</td></tr><tr><td>Bien qu’il pleuve, nous sortons.</td><td>concession</td></tr><tr><td>S’il pleut, je reste.</td><td>condition</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Si j’aurais su » → ✅ « Si j’avais su, je serais venu » : pas de conditionnel juste après « si ».</li></ul>','wa'],['🧠 Astuce','<p>« Bien que » appelle le subjonctif. Après « si » hypothétique, jamais de conditionnel.</p>',''],['✅ Je retiens','<p>Opposition : alors que. Concession : bien que. Condition : si.</p>','re']],
qs:[Q('« Bien qu’il pleuve, nous sortons. » exprime…',['la condition','la concession','la cause'],1,['Il n’y a pas d’hypothèse.','Oui : malgré l’obstacle (la pluie), on sort.','La pluie n’est pas la raison de sortir.']),
Q('« S’il pleut, je reste. » exprime…',['la condition','la concession','l’opposition'],0,['Oui : « si » introduit une hypothèse.','Il n’y a pas d’obstacle contourné.','Il n’y a pas de contraste entre deux faits.']),
Q('« Il travaille alors que son frère dort. » exprime…',['le but','l’opposition','la conséquence'],1,['Il n’y a pas de but.','Oui : deux faits contrastés.','Il n’y a pas de résultat.']),
Q('Complète : « Bien qu’il ___ fatigué, il continue. » (être)',['est','soit','sera'],1,['Après « bien que », on emploie le subjonctif.','Oui : subjonctif présent.','Le futur ne convient pas.']),
Q('Quelle phrase est correcte ?',['Si j’aurais su, je serais venu.','Si j’avais su, je serais venu.','Si je saurais, je serais venu.'],1,['Pas de conditionnel juste après « si ».','Oui : si + plus-que-parfait, puis conditionnel.','Pas de conditionnel après « si ».']),
VF('Après « si » (hypothèse), on met le conditionnel.',false,['Non : on met l’imparfait ou le plus-que-parfait.','Oui, c’est Faux : le conditionnel vient dans la principale.']),
M('Associe chaque locution à sa circonstance.',[['alors que','Opposition'],['bien que','Concession'],['à condition que','Condition']],'Cherche le contraste, l’obstacle, l’hypothèse.'),
T('Touche le verbe au subjonctif.',['Bien','qu’il','pleuve,','nous','sortons.'],[2],'« Pleuve » est au subjonctif, après « bien que ».')]},
{id:'G-11',lv:3,dom:'Grammaire',t:'Proposition participiale et gérondif',kw:'participiale gérondif participe présent en marchant sujet propre circonstance',
f:[['🔎 Je découvre','<p>« Le soleil étant couché, nous rentrons. » / « Il chante en marchant. »</p><p class="mut">Deux façons d’exprimer une circonstance avec un participe.</p>',''],['💡 À savoir','<p>Une circonstance peut s’exprimer avec un participe : la <b>proposition participiale</b> ou le <b>gérondif</b>.</p>',''],['📏 La règle','<ul><li><b>Proposition participiale</b> : participe avec son <b>propre sujet</b>, différent de celui de la principale. Pas de conjonction.</li><li><b>Gérondif</b> : <b>en + participe présent</b> (-ant), même sujet que le verbe principal. Il est invariable.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Type</th></tr><tr><td>Le soleil étant couché, nous rentrons.</td><td>participiale</td></tr><tr><td>Il chante en marchant.</td><td>gérondif</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Le gérondif garde le même sujet : ❌ « En mangeant, le téléphone sonne ».</li><li>Le gérondif est invariable : « elles rient en souriant ».</li></ul>','wa'],['🧠 Astuce','<p>Gérondif = « en » + -ant. Participiale = sujet propre.</p>',''],['✅ Je retiens','<p>Gérondif : en + -ant, même sujet, invariable. Participiale : sujet propre.</p>','re']],
qs:[Q('« Il chante en marchant. » : « en marchant » est…',['un gérondif','une participiale','une relative'],0,['Oui : en + participe présent.','Il n’y a pas de sujet propre.','Il n’y a pas de pronom relatif.']),
Q('« Le soleil étant couché, nous rentrons. » : « Le soleil étant couché » est…',['un gérondif','une proposition participiale','une relative'],1,['Il n’y a pas « en ».','Oui : participe avec son propre sujet.','Il n’y a pas de pronom relatif.']),
Q('Le gérondif commence par…',['que','en','si'],1,['« Que » introduit une subordonnée.','Oui : en + participe présent.','« Si » introduit une condition.']),
Q('Dans « Il lit en mangeant », qui mange ?',['Il','Quelqu’un d’autre','On ne sait pas'],0,['Oui : le gérondif a le même sujet que le verbe principal.','Le gérondif garde le même sujet.','Le sujet est clair : « il ».']),
VF('Le gérondif s’accorde avec le sujet.',false,['Non : il est invariable.','Oui, c’est Faux : « elles rient en souriant ».']),
F('Complète : « Elle sourit en ___. » (répondre)',['répondant'],'Gérondif : en + radical de « nous répondons » + -ant.','Forme en -ant.'),
M('Associe chaque groupe à sa nature.',[['en marchant','Gérondif'],['Le soleil étant couché','Proposition participiale'],['qui marche','Proposition relative']],'Cherche « en », le sujet propre, le pronom relatif.'),
T('Touche le gérondif.',['Il','chante','en','marchant','vers','l’école.'],[2,3],'« En marchant » : en + participe présent.')]},
{id:'G-13',lv:1,dom:'Grammaire',t:'Types et formes de phrase, modalisation',kw:'type phrase déclarative interrogative injonctive exclamative négation forme modalisation peut-être',
f:[['🔎 Je découvre','<p>« Tu viens. » / « Tu viens ? » / « Viens ! » / « Tu ne viens pas. »</p><p class="mut">Même verbe, mais chaque phrase fait autre chose.</p>',''],['💡 À savoir','<p>Une phrase a un <b>type</b> (ce qu’elle fait) et une <b>forme</b> (affirmative ou négative).</p>',''],['📏 La règle','<ul><li><b>Déclarative</b> : informe (point).</li><li><b>Interrogative</b> : pose une question (?).</li><li><b>Injonctive</b> : donne un ordre ou un conseil (impératif).</li><li><b>Exclamative</b> : exprime un sentiment (!).</li><li><b>Négation</b> : ne… pas, ne… jamais, ne… plus, ne… rien encadrent le verbe.</li><li><b>Modalisation</b> : exprimer son doute ou sa certitude (peut-être, sûrement, il semble que).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Type</th></tr><tr><td>Il pleut.</td><td>déclarative</td></tr><tr><td>Pleut-il ?</td><td>interrogative</td></tr><tr><td>Sors !</td><td>injonctive</td></tr><tr><td>Quel beau temps !</td><td>exclamative</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Je sais pas » → ✅ « Je <b>ne</b> sais <b>pas</b> » : à l’écrit, « ne » est obligatoire.</li></ul>','wa'],['🧠 Astuce','<p>Le type dépend de l’intention : informer, demander, ordonner ou s’exclamer.</p>',''],['✅ Je retiens','<p>Quatre types : déclaratif, interrogatif, injonctif, exclamatif. La négation utilise deux mots.</p>','re']],
qs:[Q('« Viens ici ! » est une phrase…',['déclarative','interrogative','injonctive'],2,['Elle ne se contente pas d’informer : elle donne un ordre.','Elle ne pose pas de question.','Oui : elle donne un ordre.']),
Q('« Tu viens ? » est une phrase…',['interrogative','injonctive','exclamative'],0,['Oui : elle pose une question.','Elle ne donne pas d’ordre.','Elle n’exprime pas un sentiment.']),
Q('« Quel beau temps ! » est une phrase…',['déclarative','exclamative','injonctive'],1,['Elle exprime un sentiment, pas seulement une information.','Oui : elle exprime un sentiment.','Elle ne donne pas d’ordre.']),
Q('Quelle phrase est à la forme négative ?',['Il vient souvent.','Il ne vient jamais.','Il vient ?'],1,['Elle est affirmative.','Oui : « ne… jamais » encadre le verbe.','C’est une question affirmative.']),
Q('Dans « Il viendra peut-être. », « peut-être » exprime…',['la certitude','le doute','l’ordre'],1,['« Peut-être » montre que ce n’est pas sûr.','Oui : c’est de la modalisation du doute.','Il n’y a aucun ordre.']),
VF('À l’écrit, la négation utilise « ne » et un second mot (pas, jamais…).',true,['Oui, c’est Vrai.','Non : les deux mots sont nécessaires.']),
F('Complète : « Je sais. » → « Je ne sais ___. »',['pas'],'« Ne… pas » encadre le verbe.','Mot de 3 lettres.'),
M('Associe chaque phrase à son type.',[['Il pleut.','Déclarative'],['Pleut-il ?','Interrogative'],['Sors !','Injonctive'],['Quel beau temps !','Exclamative']],'Cherche l’intention de chaque phrase.'),
T('Touche les deux mots de la négation.',['Il','ne','mange','jamais','de','poisson.'],[1,3],'« Ne… jamais » encadre le verbe.')]},
{id:'G-15',lv:1,dom:'Grammaire',t:'La ponctuation',kw:'ponctuation virgule point deux-points point-virgule guillemets tiret dialogue suspension',
f:[['🔎 Je découvre','<p>« Mange, Paul. » / « Mange Paul. »</p><p class="mut">Une seule virgule change tout le sens.</p>',''],['💡 À savoir','<p>La <b>ponctuation</b> organise le texte, marque les pauses et change parfois le sens.</p>',''],['📏 La règle','<ul><li><b>Point</b> : fin d’une phrase.</li><li><b>Virgule</b> : énumération, apposition, pause, groupe déplacé.</li><li><b>Point-virgule</b> : lie deux propositions proches.</li><li><b>Deux-points</b> : annonce une explication, une liste ou des paroles.</li><li><b>Guillemets et tirets</b> : dialogue (un tiret = un changement de locuteur).</li><li><b>Points de suspension</b> : phrase inachevée.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Signe</th><th>Exemple</th></tr><tr><td>virgule</td><td>Il achète des pommes, des poires et du pain.</td></tr><tr><td>deux-points</td><td>Il dit : « Viens. »</td></tr><tr><td>tiret</td><td>— Viens, dit Léa.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Les enfants, jouent » : pas de virgule entre le sujet et son verbe.</li></ul>','wa'],['🧠 Astuce','<p>Lis à voix haute : une pause naturelle indique souvent une virgule.</p>',''],['✅ Je retiens','<p>Chaque signe a un rôle : ne mets pas de virgule entre le sujet et le verbe.</p>','re']],
qs:[Q('Quelle phrase est correctement ponctuée ?',['Paul viens ici.','Paul, viens ici.','Paul, viens, ici.'],1,['Il manque la virgule qui isole « Paul ».','Oui : la virgule isole le mot auquel on s’adresse.','La 2e virgule est de trop.']),
Q('Quel signe annonce une explication ou une liste ?',['le point-virgule','le deux-points','le point'],1,['Il lie deux propositions proches.','Oui : il annonce une explication, une liste ou des paroles.','Il termine la phrase.']),
Q('Quelle différence entre « Mange, Paul. » et « Mange Paul. » ?',['Aucune','La 1re s’adresse à Paul, la 2e parle de manger Paul','La 2e est interrogative'],1,['La virgule change le sens.','Oui : dans la 1re, Paul est interpellé ; dans la 2e, il est le COD.','La 2e n’est pas interrogative.']),
VF('On place une virgule entre le sujet et son verbe.',false,['Non : c’est une faute.','Oui, c’est Faux : pas de virgule entre le sujet et le verbe.']),
Q('Dans un dialogue écrit, un tiret au début d’une ligne signale…',['une énumération','un changement de locuteur','une explication'],1,['Ce n’est pas son rôle ici.','Oui : il marque un nouveau locuteur.','Ce rôle est celui du deux-points.']),
F('Complète avec le bon signe : « Il achète des pommes___ des poires et du pain. »',[','],'La virgule sépare les éléments d’une énumération.','Un signe très petit.'),
M('Associe chaque signe à son rôle.',[['.','Fin d’une phrase déclarative'],['?','Question'],[':','Annonce une explication ou des paroles'],['…','Phrase inachevée']],'Pense à la fonction de chaque signe.'),
O('Remets les mots dans l’ordre.',['Elle','achète','des','pommes,','des','poires','et','du','pain.'],'La virgule sépare les éléments de l’énumération.')]},
{id:'C-03',lv:2,dom:'Conjugaison',t:'Passé composé et plus-que-parfait',kw:'passé composé plus-que-parfait temps composés auxiliaire être avoir participe passé antériorité',
