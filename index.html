f:[['🔎 Je découvre','<p>« J’ai mangé. » / « J’avais mangé quand tu es arrivé. »</p><p class="mut">Dans la 2e phrase, l’action de manger est antérieure.</p>',''],['💡 À savoir','<p>Un <b>temps composé</b> se forme avec un <b>auxiliaire</b> (être ou avoir) et un <b>participe passé</b>.</p>',''],['📏 La règle','<ul><li><b>Passé composé</b> : auxiliaire au <b>présent</b> + participe passé (j’ai chanté, elle est partie).</li><li><b>Plus-que-parfait</b> : auxiliaire à l’<b>imparfait</b> + participe passé (j’avais chanté, elle était partie). Il exprime une action antérieure à une autre action passée.</li><li>Auxiliaire <b>être</b> : aller, venir, partir, arriver, tomber, naître, mourir, rester, et les verbes pronominaux. Sinon : <b>avoir</b>.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Passé composé</th><th>Plus-que-parfait</th></tr><tr><td>Il a fini.</td><td>Il avait fini.</td></tr><tr><td>Elles sont parties.</td><td>Elles étaient parties.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « J’ai tombé » → ✅ « Je suis tombé ».</li><li>Pense à accorder le participe passé (voir la fiche sur l’accord).</li></ul>','wa'],['🧠 Astuce','<p>Pour choisir l’auxiliaire, demande-toi : est-ce un verbe de mouvement ou pronominal ? Oui : être.</p>',''],['✅ Je retiens','<p>Passé composé = auxiliaire au présent + participe. Plus-que-parfait = auxiliaire à l’imparfait + participe.</p>','re']],
qs:[Q('Complète : « Elle ___ tombée. »',['a','est','avait'],1,['« Tomber » se conjugue avec être.','Oui : « tomber » prend l’auxiliaire être.','« Avait » est à l’imparfait et « tomber » prend être.']),
Q('Complète : « Nous ___ fini nos devoirs. »',['avons','sommes','aurons'],0,['Oui : « finir » prend avoir.','« Finir » ne prend pas être.','« Aurons » est au futur.']),
Q('« J’avais fini quand tu es arrivé. » : « J’avais fini » est au…',['passé composé','plus-que-parfait','futur antérieur'],1,['L’auxiliaire n’est pas au présent.','Oui : auxiliaire à l’imparfait + participe passé.','L’auxiliaire n’est pas au futur.']),
Q('Le plus-que-parfait se forme avec l’auxiliaire à…',['l’imparfait','le présent','le futur'],0,['Oui : avais/étais + participe passé.','C’est le passé composé.','C’est le futur antérieur.']),
Q('Quelle phrase est correcte ?',['J’ai tombé.','Je suis tombé.','Je suis mangé.'],1,['« Tomber » se conjugue avec être.','Oui : « tomber » prend être.','« Manger » se conjugue avec avoir.']),
VF('Le plus-que-parfait exprime une action antérieure à une autre action passée.',true,['Oui, c’est Vrai.','Non : c’est bien son rôle.']),
F('Complète au passé composé : « Hier, nous ___ (aller) au cinéma. »',['sommes allés','sommes allées'],'« Aller » prend être : on accorde avec le sujet « nous ».','Auxiliaire être + participe.'),
M('Associe chaque forme à son temps.',[['J’ai chanté','Passé composé (avoir)'],['J’avais chanté','Plus-que-parfait (avoir)'],['Elle est partie','Passé composé (être)'],['Elle était partie','Plus-que-parfait (être)']],'Regarde le temps de l’auxiliaire.'),
T('Touche le verbe au plus-que-parfait.',['Quand','tu','es','arrivé,','j’avais','déjà','mangé.'],[4,6],'« J’avais mangé » : auxiliaire à l’imparfait + participe passé.')]},
{id:'C-04',lv:2,dom:'Conjugaison',t:'Futur simple et futur antérieur',kw:'futur simple futur antérieur conjugaison serai aurai irai ferai viendrai terminaisons',
f:[['🔎 Je découvre','<p>« Demain, je chanterai. » / « Quand j’aurai fini, je sortirai. »</p><p class="mut">Deux actions futures : l’une sera finie avant l’autre.</p>',''],['💡 À savoir','<p>Le <b>futur simple</b> exprime une action à venir. Le <b>futur antérieur</b> exprime une action future déjà accomplie avant une autre.</p>',''],['📏 La règle','<ul><li><b>Futur simple</b> : infinitif + -ai, -as, -a, -ons, -ez, -ont (je chanterai). Irréguliers : être → serai, avoir → aurai, aller → irai, faire → ferai, venir → viendrai, voir → verrai.</li><li><b>Futur antérieur</b> : auxiliaire au <b>futur</b> + participe passé (j’aurai fini, elle sera partie).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Temps</th><th>Exemple</th></tr><tr><td>futur simple</td><td>Je sortirai demain.</td></tr><tr><td>futur antérieur</td><td>Quand j’aurai fini, je sortirai.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « tu viendra » → ✅ « tu viendras ».</li><li>-ai (futur : je chanterai) ≠ -ais (conditionnel : je chanterais).</li></ul>','wa'],['🧠 Astuce','<p>Après « quand » ou « dès que », le futur antérieur marque l’action qui finit avant l’autre.</p>',''],['✅ Je retiens','<p>Futur simple : infinitif + terminaison. Futur antérieur : auxiliaire au futur + participe passé.</p>','re']],
qs:[Q('Complète : « Demain, je ___ au cinéma. » (aller)',['vais','irai','irais'],1,['« Vais » est au présent.','Oui : futur simple de « aller ».','« Irais » est au conditionnel.']),
Q('Complète : « Tu ___ demain. » (venir)',['viendra','viendras','viens'],1,['Il manque le -s de « tu ».','Oui : tu viendras.','« Viens » est au présent.']),
Q('« Quand j’aurai fini, je sortirai. » : « j’aurai fini » est au…',['plus-que-parfait','futur simple','futur antérieur'],2,['L’auxiliaire n’est pas à l’imparfait.','Ce n’est pas une forme simple.','Oui : auxiliaire au futur + participe passé.']),
Q('Le futur antérieur se forme avec l’auxiliaire au…',['présent','futur simple','conditionnel'],1,['C’est le passé composé.','Oui : aurai/serai + participe passé.','Ce n’est pas un temps de l’indicatif futur.']),
Q('Quelle phrase est au futur simple ?',['Je chanterai.','Je chanterais.','J’ai chanté.'],0,['Oui : « je chanterai », terminaison -ai.','Terminaison -ais : conditionnel.','Passé composé.']),
VF('« Nous serons » et « nous serions » sont tous deux au futur simple.',false,['Non : « serions » est au conditionnel.','Oui, c’est Faux : « serions » est au conditionnel.']),
F('Complète : « Il ___ (faire) ses devoirs ce soir. »',['fera'],'Futur simple de « faire » : je ferai, il fera.','Forme irrégulière.'),
M('Associe chaque forme à son temps.',[['Je chanterai','Futur simple'],['J’aurai chanté','Futur antérieur'],['Je chantais','Imparfait'],['J’ai chanté','Passé composé']],'Regarde l’auxiliaire et la terminaison.'),
T('Touche le verbe au futur simple.',['Quand','j’aurai','fini,','je','sortirai.'],[4],'« Sortirai » est au futur simple ; « j’aurai fini » est au futur antérieur.')]},
{id:'C-05',lv:2,dom:'Conjugaison',t:'Le conditionnel présent',kw:'conditionnel présent politesse hypothèse si imparfait serais irais voudrais terminaisons',
f:[['🔎 Je découvre','<p>« Je voudrais un thé. » / « S’il pleuvait, je resterais. »</p><p class="mut">Politesse dans la 1re phrase, hypothèse dans la 2e.</p>',''],['💡 À savoir','<p>Le <b>conditionnel présent</b> exprime la politesse, le souhait, l’hypothèse ou une information incertaine.</p>',''],['📏 La règle','<ul><li>Formation : <b>radical du futur</b> + terminaisons de l’<b>imparfait</b> (-ais, -ais, -ait, -ions, -iez, -aient).</li><li>Irréguliers : être → serais, avoir → aurais, aller → irais, faire → ferais, venir → viendrais.</li><li>Hypothèse : <b>si + imparfait</b> → conditionnel.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Valeur</th><th>Exemple</th></tr><tr><td>politesse</td><td>Je voudrais un thé.</td></tr><tr><td>hypothèse</td><td>S’il pleuvait, je resterais.</td></tr><tr><td>incertitude</td><td>Le suspect serait en fuite.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>-ai (futur : je chanterai) ≠ -ais (conditionnel : je chanterais).</li><li>❌ « Si j’aurais » → ✅ « Si j’avais » : pas de conditionnel après « si ».</li></ul>','wa'],['🧠 Astuce','<p>Futur + imparfait = conditionnel : le radical du futur, les terminaisons de l’imparfait.</p>',''],['✅ Je retiens','<p>Conditionnel = radical du futur + terminaisons de l’imparfait.</p>','re']],
qs:[Q('Complète : « Si tu venais, nous ___ contents. » (être)',['sommes','serions','serons'],1,['« Sommes » est au présent.','Oui : si + imparfait, puis conditionnel.','« Serons » est au futur.']),
Q('« Je voudrais un thé. » exprime…',['la politesse','l’ordre','le passé'],0,['Oui : le conditionnel adoucit la demande.','Ce n’est pas un ordre.','Il ne s’agit pas d’une action passée.']),
Q('« Je chanterais » est…',['au futur','au conditionnel présent','à l’imparfait'],1,['Le futur serait « je chanterai ».','Oui : radical du futur + -ais.','L’imparfait serait « je chantais ».']),
Q('Complète : « S’il pleuvait, je ___ à la maison. » (rester)',['resterai','resterais','restais'],1,['« Resterai » est au futur.','Oui : si + imparfait, puis conditionnel.','« Restais » est à l’imparfait.']),
Q('Le conditionnel présent se forme avec…',['le radical du futur + les terminaisons de l’imparfait','le radical du présent + les terminaisons du futur','l’infinitif + -ai'],0,['Oui : chanter + -ais = chanterais.','Ce n’est pas la règle.','C’est la terminaison du futur.']),
VF('« Je chanterai » est au conditionnel.',false,['Non : c’est le futur simple.','Oui, c’est Faux : le conditionnel serait « je chanterais ».']),
F('Complète : « Il ___ (aller) à Paris s’il avait le temps. »',['irait'],'Conditionnel de « aller » : j’irais, il irait.','Radical du futur : ir-.'),
M('Associe chaque forme à son temps.',[['Je chanterai','Futur simple'],['Je chanterais','Conditionnel présent'],['Je chantais','Imparfait']],'Regarde la terminaison : -ai, -ais.'),
T('Touche le verbe au conditionnel.',['Si','tu','venais,','nous','serions','contents.'],[4],'« Serions » est au conditionnel ; « venais » est à l’imparfait.')]},
{id:'C-06',lv:3,dom:'Conjugaison',t:'Le subjonctif présent',kw:'subjonctif présent il faut que bien que pour que sois aie aille fasse mode',
f:[['🔎 Je découvre','<p>« Il faut que tu viennes. »</p><p class="mut">Après « il faut que », on n’écrit pas « tu viens ».</p>',''],['💡 À savoir','<p>Le <b>subjonctif</b> s’emploie dans la subordonnée après une volonté, un souhait, un doute ou une nécessité, et après certaines conjonctions.</p>',''],['📏 La règle','<ul><li>Formation : radical de « ils » au présent + <b>-e, -es, -e, -ions, -iez, -ent</b> (qu’ils chantent → que je chante).</li><li>Irréguliers : être (que je <b>sois</b>), avoir (que j’<b>aie</b>), aller (que j’<b>aille</b>), faire (que je <b>fasse</b>), pouvoir (que je <b>puisse</b>), savoir (que je <b>sache</b>).</li><li>Après : il faut que, vouloir que, bien que, pour que, avant que.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Phrase</th><th>Déclencheur</th></tr><tr><td>Il faut que tu viennes.</td><td>il faut que</td></tr><tr><td>Je veux qu’elle parte.</td><td>vouloir que</td></tr><tr><td>Bien que nous soyons en retard…</td><td>bien que</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Il faut que je vais » → ✅ « que j’aille ». ❌ « que tu es » → ✅ « que tu sois ».</li><li>« Je pense que » + indicatif ; « je doute que » + subjonctif.</li></ul>','wa'],['🧠 Astuce','<p>Mets la phrase après « il faut que » : si l’indicatif sonne faux, c’est le subjonctif.</p>',''],['✅ Je retiens','<p>Subjonctif après il faut que, vouloir que, bien que, pour que. Attention aux irréguliers.</p>','re']],
qs:[Q('Complète : « Il faut que tu ___. » (venir)',['viens','viennes','viendras'],1,['« Viens » est au présent.','Oui : subjonctif présent.','Le futur ne convient pas après « il faut que ».']),
Q('Complète : « Il faut que nous ___ à l’heure. » (être)',['sommes','soyons','serons'],1,['« Sommes » est à l’indicatif.','Oui : subjonctif présent d’« être ».','« Serons » est au futur.']),
Q('Complète : « Bien qu’il ___ tard, nous restons. » (être)',['est','soit','sera'],1,['Après « bien que », on emploie le subjonctif.','Oui : subjonctif présent.','Le futur ne convient pas.']),
Q('Complète : « Il faut que j’___ à Paris. » (aller)',['vais','aille','irai'],1,['« Vais » est à l’indicatif.','Oui : subjonctif présent d’« aller ».','« Irai » est au futur.']),
Q('Quelle phrase est correcte ?',['Je veux que tu fais tes devoirs.','Je veux que tu fasses tes devoirs.','Je veux que tu feras tes devoirs.'],1,['Après « vouloir que », on emploie le subjonctif.','Oui : subjonctif présent de « faire ».','Le futur ne convient pas après « vouloir que ».']),
VF('Après « je pense que », on emploie toujours le subjonctif.',false,['Non : « je pense que » + indicatif.','Oui, c’est Faux : « je pense que tu as raison » (indicatif).']),
F('Complète : « Il faut que tu ___ du courage. » (avoir)',['aies'],'Subjonctif d’« avoir » : que j’aie, que tu aies.','Forme irrégulière.'),
M('Associe chaque verbe à sa forme au subjonctif.',[['être','que je sois'],['avoir','que j’aie'],['aller','que j’aille'],['faire','que je fasse']],'Ces quatre formes sont irrégulières.'),
T('Touche le verbe au subjonctif.',['Il','faut','que','tu','viennes','demain.'],[4],'« Viennes » est au subjonctif après « il faut que ».')]},
{id:'C-07',lv:1,dom:'Conjugaison',t:'L’impératif',kw:'impératif ordre conseil interdiction tu nous vous chante sois aie va',
f:[['🔎 Je découvre','<p>« Viens ! » « Mangeons ! » « Écoutez ! »</p><p class="mut">Trois phrases sans sujet écrit, qui donnent un ordre.</p>',''],['💡 À savoir','<p>L’<b>impératif</b> exprime un ordre, un conseil ou une interdiction. Il n’a que <b>trois personnes</b> (tu, nous, vous) et pas de pronom sujet.</p>',''],['📏 La règle','<ul><li>Il ressemble au présent : tu chantes → <b>chante</b> ; nous chantons → <b>chantons</b> ; vous chantez → <b>chantez</b>.</li><li>Pour les verbes en -er (et ouvrir, offrir…), pas de <b>-s</b> à « tu » : chante, ouvre, va.</li><li>Irréguliers : être → sois, soyons, soyez ; avoir → aie, ayons, ayez ; aller → va, allons, allez.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Verbe</th><th>tu / nous / vous</th></tr><tr><td>chanter</td><td>chante / chantons / chantez</td></tr><tr><td>être</td><td>sois / soyons / soyez</td></tr><tr><td>avoir</td><td>aie / ayons / ayez</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Chantes plus fort ! » → ✅ « Chante plus fort ! ». Mais « Vas-y » garde le s devant « y ».</li></ul>','wa'],['🧠 Astuce','<p>L’impératif, c’est le présent sans le sujet : « tu viens » → « viens ».</p>',''],['✅ Je retiens','<p>Impératif : trois personnes, pas de sujet, pas de -s à « tu » pour les verbes en -er.</p>','re']],
qs:[Q('Complète : « ___ tes devoirs ! » (faire, à « tu »)',['Fais','Fait','Faites'],0,['Oui : « tu fais » → « fais ».','« Fait » ne va pas avec « tu ».','« Faites » va avec « vous ».']),
Q('Complète : « ___ à l’école ! » (aller, à « tu »)',['Vas','Va','Allez'],1,['Pas de -s à l’impératif de « aller » (sauf « vas-y »).','Oui : « va » sans s.','« Allez » va avec « vous ».']),
Q('Complète : « ___ sage ! » (être, à « tu »)',['Es','Sois','Soit'],1,['« Es » est au présent.','Oui : impératif irrégulier d’« être ».','« Soit » est une forme du subjonctif (il soit).']),
Q('Quelle phrase est correcte ?',['Chantes plus fort !','Chante plus fort !','Tu chante plus fort !'],1,['Pas de -s à l’impératif des verbes en -er.','Oui : « chante » sans s.','Pas de pronom sujet à l’impératif.']),
Q('À combien de personnes se conjugue l’impératif ?',['Trois','Six','Deux'],0,['Oui : tu, nous, vous.','Il n’y a pas de 3e personne.','Il y en a trois.']),
VF('À l’impératif, on écrit le pronom sujet (tu, nous, vous).',false,['Non : il n’y a pas de sujet écrit.','Oui, c’est Faux : pas de sujet écrit.']),
F('Complète : « ___ (ouvrir, à « tu ») la fenêtre ! »',['ouvre'],'Comme pour les verbes en -er, pas de -s : ouvre.','Forme en -e.'),
M('Associe chaque forme à l’impératif.',[['tu → chanter','Chante !'],['nous → chanter','Chantons !'],['vous → chanter','Chantez !'],['tu → avoir','Aie !']],'Enlève le pronom sujet.'),
T('Touche le verbe à l’impératif.',['Ferme','la','porte,','s’il','te','plaît.'],[0],'« Ferme » est un impératif : un ordre adressé à « tu ».')]},
{id:'C-08',lv:3,dom:'Conjugaison',t:'Concordance des temps, récit et commentaire',kw:'concordance temps récit commentaire passé simple imparfait plus-que-parfait conditionnel',
f:[['🔎 Je découvre','<p>« Il dit qu’il viendra. » / « Il disait qu’il viendrait. »</p><p class="mut">Quand le premier verbe est au passé, le second change aussi.</p>',''],['💡 À savoir','<p>La <b>concordance des temps</b> accorde le temps de la subordonnée avec celui de la principale. Dans un texte, on distingue les temps du <b>récit</b> et du <b>commentaire</b>.</p>',''],['📏 La règle','<ul><li><b>Récit</b> (histoire au passé) : passé simple, imparfait, plus-que-parfait.</li><li><b>Commentaire</b> (on parle de maintenant) : présent, passé composé, futur.</li><li>Principale au passé : <b>présent → imparfait</b> ; <b>futur → conditionnel</b> ; <b>passé composé → plus-que-parfait</b>.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Principale au présent</th><th>Principale au passé</th></tr><tr><td>Il dit qu’il viendra.</td><td>Il disait qu’il viendrait.</td></tr><tr><td>Il dit qu’il a mangé.</td><td>Il disait qu’il avait mangé.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Il disait qu’il viendra » → ✅ « viendrait ».</li><li>Ne change pas de temps sans raison dans un récit.</li></ul>','wa'],['🧠 Astuce','<p>Si le premier verbe est au passé, décale tout d’un cran vers le passé.</p>',''],['✅ Je retiens','<p>Principale au passé : présent → imparfait, futur → conditionnel, passé composé → plus-que-parfait.</p>','re']],
qs:[Q('Complète : « Il disait qu’il ___ demain. » (venir)',['viendra','viendrait','vient'],1,['Le verbe principal est au passé : le futur devient conditionnel.','Oui : futur → conditionnel.','Le présent ne convient pas après un verbe au passé.']),
Q('Complète : « Il a dit qu’il ___ mangé. »',['a','avait','aura'],1,['Le verbe principal est au passé.','Oui : passé composé → plus-que-parfait.','Le futur ne convient pas.']),
Q('Dans un récit au passé, une action antérieure s’exprime au…',['futur','plus-que-parfait','présent'],1,['Le futur ne convient pas.','Oui : il exprime l’antériorité.','Le présent ne convient pas dans un récit au passé.']),
Q('Quel temps appartient au récit ?',['le passé simple','le présent','le futur'],0,['Oui : le passé simple raconte les actions.','Le présent est plutôt le temps du commentaire.','Le futur est plutôt le temps du commentaire.']),
Q('Quelle phrase respecte la concordance des temps ?',['Il disait qu’il viendra.','Il disait qu’il viendrait.','Il disait qu’il vient.'],1,['Après un verbe au passé, le futur devient conditionnel.','Oui : « viendrait » s’accorde avec « disait ».','Le présent ne convient pas après un verbe au passé.']),
VF('Quand le verbe principal est au passé, le futur devient conditionnel dans la subordonnée.',true,['Oui, c’est Vrai.','Non : c’est la règle de la concordance.']),
F('Complète : « Elle a dit qu’elle ___ (finir) plus tard. »',['finirait'],'Futur → conditionnel après un verbe principal au passé.','Terminaison -ait.'),
M('Associe chaque temps du discours direct à celui du discours indirect passé.',[['présent','imparfait'],['futur simple','conditionnel présent'],['passé composé','plus-que-parfait']],'Décale chaque temps d’un cran vers le passé.'),
T('Touche le verbe au conditionnel.',['Il','disait','qu’il','viendrait','demain.'],[3],'« Viendrait » est au conditionnel : futur dans le passé.')]},
{id:'C-09',lv:2,dom:'Conjugaison',t:'Infinitif, participe et gérondif',kw:'infinitif participe présent passé gérondif adjectif verbal -é -er formes non conjuguées',
f:[['🔎 Je découvre','<p>« Je veux partir. » / « un enfant riant » / « la porte fermée »</p><p class="mut">Trois formes du verbe qui ne se conjuguent pas.</p>',''],['💡 À savoir','<p>L’<b>infinitif</b>, le <b>participe</b> et le <b>gérondif</b> sont des formes du verbe qui ne changent pas avec la personne.</p>',''],['📏 La règle','<ul><li><b>Infinitif</b> : forme de base (chanter, finir, prendre).</li><li><b>Participe présent</b> : en -ant (chantant). Il est invariable quand c’est un verbe.</li><li><b>Participe passé</b> : chanté, fini, pris, dit.</li><li><b>Gérondif</b> : en + participe présent (en chantant).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Forme</th><th>Exemple</th></tr><tr><td>infinitif</td><td>Il veut <b>chanter</b>.</td></tr><tr><td>participe passé</td><td>Il a <b>chanté</b>.</td></tr><tr><td>gérondif</td><td>Il marche <b>en chantant</b>.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Il a manger » → ✅ « Il a mangé ». ❌ « Je veux mangé » → ✅ « Je veux manger ».</li></ul>','wa'],['🧠 Astuce','<p>Test : remplace par « vendre » ou « vendu ». « Vendre » va → infinitif en -er. « Vendu » va → participe en -é.</p>',''],['✅ Je retiens','<p>Infinitif = forme de base. Participe passé = après avoir ou être. Gérondif = en + -ant.</p>','re']],
qs:[Q('Complète : « Il veut ___. » (chanter)',['chanter','chanté','chantez'],0,['Oui : après « veut », on met l’infinitif (on peut dire « vendre »).','« Chanté » est un participe passé.','« Chantez » est une forme conjuguée.']),
Q('Complète : « Elle a ___ la porte. » (fermer)',['fermer','fermé','fermez'],1,['Après « a », on met un participe passé (on peut dire « vendu »).','Oui : participe passé après l’auxiliaire avoir.','« Fermez » est conjugué.']),
Q('Dans « Il chante en marchant », « marchant » fait partie…',['d’un infinitif','d’un gérondif','d’un participe passé'],1,['Ce n’est pas la forme en -er.','Oui : « en marchant » est un gérondif.','Ce n’est pas la forme en -é.']),
Q('Quelle phrase est correcte ?',['Il a manger.','Il a mangé.','Il a mangez.'],1,['Après « a », on met un participe passé.','Oui : on peut dire « il a vendu ».','« Mangez » est conjugué.']),
Q('Pour choisir entre -é et -er, on remplace par…',['vendre ou vendu','un adjectif','un nom'],0,['Oui : « vendre » = infinitif, « vendu » = participe passé.','Ce test ne convient pas ici.','Ce test ne convient pas ici.']),
VF('Le participe présent (verbe) s’accorde avec le sujet.',false,['Non : il est invariable.','Oui, c’est Faux : il ne s’accorde pas.']),
F('Complète : « Nous allons ___ maintenant. » (manger)',['manger'],'Après « allons », on met l’infinitif.','Test : « vendre ».'),
M('Associe chaque forme à sa nature.',[['chanter','Infinitif'],['chantant','Participe présent'],['chanté','Participe passé'],['en chantant','Gérondif']],'Regarde la terminaison et la présence de « en ».'),
T('Touche les deux infinitifs.',['Il','veut','partir','sans','dire','un','mot.'],[2,4],'« Partir » et « dire » sont à l’infinitif.')]},
{id:'O-01',lv:2,dom:'Orthographe',t:'L’accord sujet-verbe : cas difficiles',kw:'accord sujet verbe éloigné inversé qui antécédent coordonnés pluriel',
f:[['🔎 Je découvre','<p>« Les enfants de ma voisine jouent. » / « Dans la cour jouent des enfants. »</p><p class="mut">Le verbe s’accorde toujours avec son sujet, même éloigné ou inversé.</p>',''],['💡 À savoir','<p>Le verbe s’accorde en <b>personne</b> et en <b>nombre</b> avec son <b>sujet</b>, même s’il est loin ou placé après.</p>',''],['📏 La règle','<ul><li>Pour trouver le sujet : « <b>Qui est-ce qui</b> … ? » ou « <b>c’est… qui</b> ».</li><li><b>Sujet éloigné</b> : on ignore le groupe placé entre les deux (les élèves <b>de la classe</b> travaillent).</li><li><b>Sujet inversé</b> : il est après le verbe (dans la cour jouent des enfants).</li><li><b>Sujet « qui »</b> : le verbe s’accorde avec l’antécédent (c’est moi qui <b>ai</b>).</li><li><b>Sujets coordonnés</b> (Paul et Léa) : pluriel.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Cas</th><th>Exemple</th></tr><tr><td>éloigné</td><td>Les élèves de la classe travaillent.</td></tr><tr><td>inversé</td><td>Dans la cour jouent des enfants.</td></tr><tr><td>« qui »</td><td>C’est moi qui ai gagné.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Les élèves de la classe travaille » : on accorde avec « élèves », pas avec « classe ».</li></ul>','wa'],['🧠 Astuce','<p>Encadre « c’est… qui » ou remplace le sujet par « ils / elle » pour entendre l’accord.</p>',''],['✅ Je retiens','<p>Trouve le sujet réel avant d’accorder : éloigné, inversé, « qui ».</p>','re']],
qs:[Q('Complète : « Les élèves de la classe ___. » (travailler)',['travaille','travaillent','travailles'],1,['« Classe » n’est pas le sujet : le sujet est « les élèves ».','Oui : sujet « les élèves » (pluriel).','Il n’y a pas de « tu ».']),
Q('Complète : « Dans la cour ___ des enfants. » (jouer)',['joue','jouent','jouez'],1,['Le sujet est « des enfants », placé après le verbe.','Oui : sujet inversé « des enfants » (pluriel).','Il n’y a pas de « vous ».']),
Q('Complète : « C’est moi qui ___ gagné. » (avoir)',['a','ai','as'],1,['« Qui » reprend « moi » (1re personne).','Oui : « qui » reprend « moi » : j’ai.','« As » irait avec « toi ».']),
Q('Complète : « Paul et Léa ___ amis. » (être)',['est','sont','êtes'],1,['Il y a deux sujets coordonnés.','Oui : deux sujets, donc pluriel.','« Êtes » va avec « vous ».']),
Q('Quelle phrase est correcte ?',['La liste des courses sont longue.','La liste des courses est longue.','La liste des courses êtes longue.'],1,['Le sujet est « la liste » (singulier).','Oui : sujet « la liste ».','Pas de « vous ».']),
VF('Le verbe s’accorde avec le nom le plus proche.',false,['Non : il s’accorde avec son sujet.','Oui, c’est Faux : avec le sujet, même éloigné.']),
F('Complète : « Les chats de la voisine ___ sur le muret. » (dormir)',['dorment'],'Sujet « les chats » (pluriel) : ils dorment.','Terminaison -ent.'),
M('Associe chaque cas à son exemple.',[['sujet éloigné','Les élèves de la classe travaillent.'],['sujet inversé','Dans la cour jouent des enfants.'],['sujet « qui »','C’est moi qui ai gagné.']],'Cherche le sujet réel du verbe.'),
T('Touche le sujet du verbe « travaillent ».',['Les','élèves','de','la','classe','travaillent.'],[0,1],'Le sujet est « les élèves » ; « de la classe » complète le nom.')]},
{id:'O-03',lv:1,dom:'Orthographe',t:'Les accords dans le groupe nominal',kw:'accord groupe nominal féminin pluriel adjectif nom déterminant genre nombre journaux',
f:[['🔎 Je découvre','<p>« Les petites filles gentilles jouent. »</p><p class="mut">Tous les mots autour de « filles » s’accordent avec lui.</p>',''],['💡 À savoir','<p>Dans un <b>groupe nominal</b>, le déterminant et l’adjectif s’accordent en <b>genre</b> et en <b>nombre</b> avec le nom.</p>',''],['📏 La règle','<ul><li><b>Féminin</b> : on ajoute -e (petit → petite). Cas : -eux → -euse, -if → -ive, -er → -ère, -on → -onne, -el → -elle.</li><li><b>Pluriel</b> : on ajoute -s. Cas : -al → -aux (journal → journaux), -eau → -eaux ; -s, -x, -z ne changent pas (un pays → des pays).</li><li>Les adjectifs de couleur issus d’un nom (orange, marron) sont invariables.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Masculin</th><th>Féminin</th></tr><tr><td>heureux</td><td>heureuse</td></tr><tr><td>vif</td><td>vive</td></tr><tr><td>léger</td><td>légère</td></tr><tr><td>un journal</td><td>des journaux</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « des journals » → ✅ « des journaux ». ❌ « une fille gentil » → ✅ « gentille ».</li></ul>','wa'],['🧠 Astuce','<p>Encadre le nom, puis cherche tous les mots qui s’accordent avec lui.</p>',''],['✅ Je retiens','<p>Déterminant et adjectifs s’accordent en genre et en nombre avec le nom.</p>','re']],
qs:[Q('Complète : « Une fille ___. » (gentil)',['gentil','gentille','gentils'],1,['Le nom est féminin.','Oui : féminin de « gentil ».','Le nom est singulier.']),
Q('Quel est le pluriel de « un journal » ?',['des journals','des journaux','des journal'],1,['Les noms en -al font -aux.','Oui : journal → journaux.','Il manque la marque du pluriel.']),
Q('Quel est le féminin de « heureux » ?',['heureuse','heureuxe','heureue'],0,['Oui : -eux → -euse.','Cette forme n’existe pas.','Cette forme n’existe pas.']),
Q('Complète : « Des robes ___. » (orange)',['oranges','orange','orangés'],1,['« Orange » est un nom de fruit devenu adjectif : il est invariable.','Oui : adjectif de couleur issu d’un nom, invariable.','Cette forme n’est pas attendue ici.']),
Q('Quelle phrase est correcte ?',['Les petites fille gentilles.','Les petites filles gentilles.','Les petit filles gentils.'],1,['« Fille » doit être au pluriel.','Oui : tous les mots s’accordent avec « filles ».','Les mots autour du nom doivent être féminins pluriels.']),
VF('« Un pays » s’écrit « des pays » au pluriel.',true,['Oui, c’est Vrai : les noms en -s ne changent pas.','Non : un nom en -s reste identique.']),
F('Complète : « Une route ___. » (long)',['longue'],'Féminin de « long » : longue.','Un -u avant le -e.'),
M('Associe chaque adjectif à son féminin.',[['léger','légère'],['vif','vive'],['naturel','naturelle'],['bon','bonne']],'Chaque terminaison a sa règle.'),
T('Touche tous les mots qui s’accordent avec « filles ».',['Les','petites','filles','gentilles','jouent.'],[0,1,3],'Le déterminant et les adjectifs s’accordent ; le verbe s’accorde avec le sujet.')]},
{id:'O-04',lv:1,dom:'Orthographe',t:'Les homophones grammaticaux',kw:'homophones a à et est on ont son sont ce se ces ses leur leurs quel qu’elle',
f:[['🔎 Je découvre','<p>« Il a un chat. » / « Il va à Paris. »</p><p class="mut">« A » et « à » se prononcent pareil, mais ne sont pas le même mot.</p>',''],['💡 À savoir','<p>Des <b>homophones</b> se prononcent de la même façon mais s’écrivent différemment parce qu’ils n’ont pas la même nature.</p>',''],['📏 La règle','<ul><li><b>a</b> (verbe avoir → « avait ») / <b>à</b> (préposition).</li><li><b>et</b> (conjonction → « et puis ») / <b>est</b> (verbe être → « était »).</li><li><b>on</b> (→ « il ») / <b>ont</b> (avoir → « avaient »).</li><li><b>son</b> (→ « mon ») / <b>sont</b> (être → « étaient »).</li><li><b>ce</b> (→ « ce/cet » + nom) / <b>se</b> (devant un verbe → « me/te »).</li><li><b>ces</b> (→ « ces ») / <b>ses</b> (→ « mes »).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Test</th><th>Exemple</th></tr><tr><td>avait</td><td>Il <b>a</b> faim.</td></tr><tr><td>était</td><td>Il <b>est</b> content.</td></tr><tr><td>étaient</td><td>Ils <b>sont</b> contents.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Il à faim » → ✅ « Il a faim ». ❌ « Elle ce lave » → ✅ « Elle se lave ».</li></ul>','wa'],['🧠 Astuce','<p>Utilise le test de remplacement : « avait » pour a, « était » pour est, « étaient » pour sont, « mes » pour ses.</p>',''],['✅ Je retiens','<p>Un homophone se choisit grâce à un test de remplacement.</p>','re']],
qs:[Q('Complète : « Il ___ mangé une pomme. »',['a','à','as'],0,['Oui : on peut dire « avait mangé ».','« À » est une préposition.','« As » va avec « tu ».']),
Q('Complète : « Elle va ___ Paris. »',['a','à','as'],1,['On ne peut pas dire « avait Paris ».','Oui : préposition (le test « avait » échoue).','« As » va avec « tu ».']),
Q('Complète : « Ils ___ fini leurs devoirs. »',['on','ont','sont'],1,['« On » serait suivi d’un verbe : « on a fini ».','Oui : on peut dire « avaient fini ».','« Sont fini » ne va pas ici.']),
Q('Complète : « Elle ___ lave les mains. »',['ce','se','ses'],1,['« Ce » accompagne un nom.','Oui : « se » devant un verbe (elle me lave).','« Ses » accompagne un nom.']),
Q('Complète : « Ils ___ contents. »',['son','sont','ont'],1,['« Son » accompagne un nom.','Oui : on peut dire « étaient contents ».','« Ont » va avec « avaient ».']),
Q('Pour vérifier « est », on remplace par…',['était','avait','étaient'],0,['Oui : « il était content ».','C’est le test de « a ».','C’est le test de « sont ».']),
VF('« Il à faim » est correct.',false,['Non : on dit « il avait faim ».','Oui, c’est Faux : « il a faim ».']),
F('Complète : « Il ___ faim. » (a ou à)',['a'],'On peut dire « il avait faim » : c’est le verbe avoir.','Verbe avoir.'),
M('Associe chaque mot à sa nature.',[['a','Verbe avoir (avait)'],['à','Préposition'],['et','Conjonction (et puis)'],['est','Verbe être (était)']],'Pense au test de remplacement.'),
T('Touche la préposition.',['Il','a','mangé','et','il','va','à','Paris.'],[6],'« À » est une préposition : on ne peut pas dire « avait ».')]},
{id:'O-05',lv:2,dom:'Orthographe',t:'Les terminaisons verbales',kw:'terminaisons verbales -ai -ais -ait -ez -er futur imparfait conditionnel',
f:[['🔎 Je découvre','<p>« Je chanterai » / « Je chantais » / « Vous chantez »</p><p class="mut">Des fins de mots qui sonnent presque pareil, mais pas au même temps.</p>',''],['💡 À savoir','<p>Certaines terminaisons se prononcent de la même façon : il faut choisir selon le <b>temps</b> et la <b>personne</b>.</p>',''],['📏 La règle','<ul><li><b>-ai</b> : futur (je chanter<b>ai</b>) et passé simple (je chant<b>ai</b>).</li><li><b>-ais / -ait</b> : imparfait (je chant<b>ais</b>) et conditionnel (je chanter<b>ais</b>).</li><li><b>-ez</b> : « vous » (vous chant<b>ez</b>) ; <b>-er</b> : infinitif ; <b>-é</b> : participe passé.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Terminaison</th><th>Exemple</th></tr><tr><td>-ai</td><td>Demain, je chanterai.</td></tr><tr><td>-ais</td><td>Autrefois, je chantais.</td></tr><tr><td>-ais</td><td>Si je pouvais, je chanterais.</td></tr><tr><td>-ez</td><td>Vous chantez.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « Demain, je chanterais » → ✅ « je chanterai » (futur). ❌ « vous chanter » → ✅ « chantez ».</li></ul>','wa'],['🧠 Astuce','<p>Remplace « je » par « nous » : « -ions » → imparfait ou conditionnel (-ais) ; « -ons » → futur (-ai).</p>',''],['✅ Je retiens','<p>-ai = futur. -ais = imparfait ou conditionnel. -ez = vous.</p>','re']],
qs:[Q('Complète : « Demain, je chant___. »',['chanterai','chanterais','chantais'],0,['Oui : « demain » indique le futur, donc -ai.','Ce serait un conditionnel.','Ce serait un imparfait.']),
Q('Complète : « Autrefois, je chant___ tous les jours. »',['chanterai','chantais','chanterais'],1,['« Autrefois » indique le passé : pas de futur.','Oui : imparfait, donc -ais.','Ce serait un conditionnel.']),
Q('Complète : « S’il pleuvait, je ___ à la maison. » (rester)',['resterai','resterais','restais'],1,['Ce serait un futur.','Oui : conditionnel après « si + imparfait ».','Ce serait un imparfait.']),
Q('Complète : « Vous ___ trop vite. » (parler)',['parler','parlez','parlé'],1,['Ce serait un infinitif.','Oui : avec « vous », -ez.','Ce serait un participe passé.']),
Q('Quel test permet de distinguer -ai et -ais ?',['remplacer « je » par « nous »','compter les lettres','ajouter un adjectif'],0,['Oui : « -ons » → futur, « -ions » → imparfait ou conditionnel.','Ce test ne fonctionne pas.','Ce test ne fonctionne pas.']),
VF('« Je chanterai » et « je chanterais » ont le même sens.',false,['Non : l’un est un futur, l’autre un conditionnel.','Oui, c’est Faux : futur ≠ conditionnel.']),
F('Complète à l’imparfait : « Hier, elle ___ (chanter) faux. »',['chantait'],'Imparfait, 3e personne du singulier : -ait.','Terminaison -ait.'),
M('Associe chaque phrase à la bonne terminaison.',[['Demain, je chant…','chanterai'],['Autrefois, je chant…','chantais'],['S’il pleuvait, je rest…','resterais'],['Vous chant…','chantez']],'Repère le temps grâce à l’indice.'),
T('Touche le verbe au futur.',['Demain,','je','chanterai','mais','hier','je','chantais.'],[2],'« Chanterai » est au futur ; « chantais » est à l’imparfait.')]},
{id:'O-06',lv:2,dom:'Orthographe',t:'L’orthographe lexicale',kw:'orthographe lexicale lettres muettes doubles consonnes famille de mots chant sang dent effort appartement',
f:[['🔎 Je découvre','<p>« un chant » → « chanter » ; « un sang » → « sanguin »</p><p class="mut">Un mot de la même famille fait entendre la lettre finale muette.</p>',''],['💡 À savoir','<p>L’<b>orthographe lexicale</b> est l’écriture des mots eux-mêmes. On s’aide de la famille de mots.</p>',''],['📏 La règle','<ul><li><b>Lettre finale muette</b> : cherche un mot de la même famille (un chant → chanter ; du plomb → plombier ; la dent → dentiste).</li><li><b>Doubles consonnes</b> : les débuts en ac-, af-, ef-, of-, ap- en prennent souvent (accueillir, affaire, effort, offrir, appartement).</li><li>Il existe des exceptions : on les apprend.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Mot</th><th>Indice</th></tr><tr><td>chant</td><td>chanter</td></tr><tr><td>sang</td><td>sanguin</td></tr><tr><td>effort</td><td>ef- + double f</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « un apartement » → ✅ « un appartement ». ❌ « un effort » s’écrit avec deux f.</li></ul>','wa'],['🧠 Astuce','<p>Cherche un mot de la même famille pour entendre la lettre finale.</p>',''],['✅ Je retiens','<p>Famille de mots pour les lettres muettes. Doubles consonnes après ac-, af-, ef-, of-, ap-… avec exceptions.</p>','re']],
qs:[Q('Comment savoir qu’il y a un t à « chant » ?',['avec « chanter »','avec « chantier »','avec le pluriel'],0,['Oui : « chanter » fait entendre le t.','« Chantier » n’est pas de la même famille.','Le pluriel ne donne pas cet indice ici.']),
Q('Quelle orthographe est correcte ?',['apartement','appartement','apartemment'],1,['Il manque un p.','Oui : deux p, deux m… puis -ent.','Cette forme est incorrecte.']),
Q('Quelle orthographe est correcte ?',['acceuillir','accueillir','acueillir'],1,['L’ordre des lettres est incorrect.','Oui : ac + cueillir = accueillir.','Il manque un c.']),
Q('Quel mot fait entendre le d final de « froid » ?',['froideur','froisser','froment'],0,['Oui : « froideur » fait entendre le d.','Ce n’est pas de la même famille.','Ce n’est pas de la même famille.']),
Q('Quelle orthographe est correcte ?',['éfort','effort','éffort'],1,['Il manque un f.','Oui : ef- + fort = effort.','Il ne faut pas d’accent ici.']),
VF('Il n’existe jamais d’exception aux règles de doubles consonnes.',false,['Non : il y a des exceptions.','Oui, c’est Faux : par exemple « afin » n’a qu’un f.']),
F('Le mot « sanguin » m’aide à écrire « san___ ».',['g'],'« Sanguin » fait entendre le g de « sang ».','Une seule lettre.'),
M('Associe chaque mot à un mot de sa famille.',[['chant','chanter'],['plomb','plombier'],['dent','dentiste'],['sang','sanguin']],'Le mot de la famille révèle la lettre muette.'),
T('Touche le mot mal orthographié.',['Il','habite','dans','un','apartement','moderne.'],[4],'On écrit « appartement » avec deux p.')]},
{id:'O-07',lv:1,dom:'Orthographe',t:'Accents, majuscules, tirets et élisions',kw:'accents majuscules tirets élision apostrophe tréma cédille où sûr ou',
f:[['🔎 Je découvre','<p>« L’école » / « Léa habite à Paris. » / « A-t-il fini ? »</p><p class="mut">De petits signes qui changent l’écriture d’un mot.</p>',''],['💡 À savoir','<p>Les <b>accents</b>, les <b>majuscules</b>, les <b>tirets</b> et l’<b>apostrophe</b> (élision) font partie de l’orthographe.</p>',''],['📏 La règle','<ul><li><b>Accents</b> : aigu (é), grave (è, à, ù), circonflexe (â, ê, î, ô, û) ; tréma (ë, ï) ; cédille (ç : garçon).</li><li><b>Accent distinctif</b> : ou / <b>où</b>, la / <b>là</b>, sur / <b>sûr</b>.</li><li><b>Majuscule</b> : début de phrase, noms propres (Léa, Paris). Pas de majuscule aux mois, aux jours ni aux langues (mars, lundi, le français).</li><li><b>Élision</b> : on remplace a, e, i par ’ devant une voyelle ou un h muet (l’école, j’aime). Pas d’élision devant un h aspiré (le haricot).</li><li><b>Tiret</b> : mots composés (porte-monnaie) et inversion (a-t-il, viens-tu).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Cas</th><th>Exemple</th></tr><tr><td>élision</td><td>l’école, j’aime</td></tr><tr><td>tiret</td><td>A-t-il fini ?</td></tr><tr><td>accent distinctif</td><td>Où vas-tu ?</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « le 10 Mars » → ✅ « le 10 mars ». ❌ « a t il » → ✅ « a-t-il ».</li></ul>','wa'],['🧠 Astuce','<p>Devant une voyelle, pense à l’apostrophe. Pour l’accent, teste avec « ou bien » (ou) ou « à quel endroit » (où).</p>',''],['✅ Je retiens','<p>Accents, majuscules, tirets et apostrophes suivent des règles précises.</p>','re']],
qs:[Q('Complète : « ___ vas-tu ? »',['ou','où','oû'],1,['« Ou » signifie « ou bien ».','Oui : « où » demande un lieu.','Cet accent n’existe pas ici.']),
Q('Quelle phrase est correcte ?',['Il part en Mars.','Il part en mars.','Il part en MARS.'],1,['Les mois s’écrivent sans majuscule.','Oui : pas de majuscule pour un mois.','Il n’y a pas de raison de tout mettre en capitales.']),
Q('Quelle écriture est correcte ?',['le école','l’école','la école'],1,['Il faut l’élision devant une voyelle.','Oui : l’ remplace le devant une voyelle.','Il faut l’élision devant une voyelle.']),
Q('Devant lequel de ces mots n’y a-t-il pas d’élision (h aspiré) ?',['le haricot','l’hôtel','l’homme'],0,['Oui : le « h » de « haricot » est aspiré.','Le « h » de « hôtel » est muet.','Le « h » de « homme » est muet.']),
Q('Quelle phrase est correcte ?',['A t il fini ?','A-t-il fini ?','A-til fini ?'],1,['Il manque les tirets.','Oui : deux tirets autour du « t ».','Il manque un tiret.']),
VF('On écrit « le Français » avec une majuscule pour parler de la langue.',false,['Non : la langue s’écrit sans majuscule.','Oui, c’est Faux : « le français » (langue) s’écrit en minuscule.']),
F('Complète : « Il est ___ de lui. » (sur ou sûr)',['sûr'],'« Sûr » (certain) prend un accent circonflexe.','Un accent sur le u.'),
M('Associe chaque signe à son nom.',[['é','Accent aigu'],['è','Accent grave'],['ê','Accent circonflexe'],['ï','Tréma']],'Observe la forme de l’accent.'),
T('Touche le mot qui devrait avoir une majuscule.',['Léa','habite','à','Paris','en','france.'],[5],'« France » est un nom propre : majuscule.')]},
{id:'V-01',lv:2,dom:'Vocabulaire',t:'La formation des mots',kw:'formation mots préfixe suffixe radical famille composition dérivation contraire',
f:[['🔎 Je découvre','<p>« heureux → malheureux → malheureusement »</p><p class="mut">Un même mot de base donne toute une famille.</p>',''],['💡 À savoir','<p>On forme des mots en ajoutant un <b>préfixe</b> (devant) ou un <b>suffixe</b> (derrière) à un <b>radical</b>.</p>',''],['📏 La règle','<ul><li><b>Radical</b> : le cœur du mot (heur dans malheureux).</li><li><b>Préfixe</b> : avant le radical (in-, im-, il-, ir- = contraire ; re- = répétition ; pré- = avant ; dé- = contraire).</li><li><b>Suffixe</b> : après (-eur = celui qui ; -able = possible ; -ment = adverbe).</li><li><b>Composition</b> : deux mots réunis (porte-monnaie, chou-fleur).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Mot</th><th>Décomposition</th></tr><tr><td>impossible</td><td>im- + possible</td></tr><tr><td>chanteur</td><td>chant + -eur</td></tr><tr><td>refaire</td><td>re- + faire</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>❌ « inpossible » → ✅ « impossible » : in- devient im- devant b, m, p.</li></ul>','wa'],['🧠 Astuce','<p>Décompose : mal | heur | eux | ement.</p>',''],['✅ Je retiens','<p>Préfixe avant, suffixe après, radical au centre.</p>','re']],
qs:[Q('Dans « impossible », le préfixe est…',['im-','poss-','-ible'],0,['Oui : il exprime le contraire.','C’est le radical.','C’est le suffixe.']),
Q('Dans « chanteur », le suffixe est…',['chant-','-eur','-teur'],1,['C’est le radical.','Oui : chant + -eur (celui qui chante).','Le radical est « chant », pas « chan ».']),
Q('Que signifie le préfixe re- dans « refaire » ?',['la répétition','le contraire','l’avant'],0,['Oui : faire de nouveau.','Le contraire s’exprime avec in-, dé-.','« Avant » s’exprime avec pré-.']),
Q('Quel mot est de la même famille que « terre » ?',['tarte','terrain','terminer'],1,['Ce n’est pas le même radical.','Oui : terr- est commun.','Ce n’est pas le même radical.']),
Q('Quel préfixe exprime le contraire dans « illisible » ?',['il-','re-','pré-'],0,['Oui : il-, variante de in-.','« Re- » exprime la répétition.','« Pré- » exprime l’avant.']),
VF('Un préfixe se place après le radical.',false,['Non : il se place avant.','Oui, c’est Faux : le suffixe vient après.']),
F('Complète : « possible » → « ___possible » (contraire).',['im'],'Devant p, in- devient im-.','Deux lettres.'),
M('Associe chaque élément à son sens.',[['in-, im-, il-','Contraire'],['re-','Répétition'],['pré-','Avant'],['-able','Possibilité']],'Pense à un exemple pour chacun.'),
T('Touche le radical de « malheureusement ».',['mal','heur','eux','ement'],[1],'Le radical est « heur » : mal- (préfixe), -eux et -ement (suffixes).')]},
{id:'V-02',lv:3,dom:'Vocabulaire',t:'L’étymologie : racines latines et grecques',kw:'étymologie racine latin grec aqua terra télé micro bio chrono photo graphie origine des mots',
f:[['🔎 Je découvre','<p>« aquarium, aquatique, aquarelle » / « télévision, téléphone, télégraphe »</p><p class="mut">Chaque groupe partage une même racine.</p>',''],['💡 À savoir','<p>L’<b>étymologie</b> est l’origine d’un mot. Beaucoup de mots français viennent du <b>latin</b> et du <b>grec</b> : connaître la racine aide à comprendre le sens.</p>',''],['📏 La règle','<ul><li>Racines latines : <b>aqua</b> (eau), <b>terra</b> (terre), <b>vox</b> (voix), <b>manus</b> (main).</li><li>Racines grecques : <b>télé</b> (loin), <b>micro</b> (petit), <b>bio</b> (vie), <b>chrono</b> (temps), <b>photo</b> (lumière), <b>graphein</b> (écrire), <b>logos</b> (parole, science), <b>phone</b> (voix, son).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Mot</th><th>Décomposition</th></tr><tr><td>télévision</td><td>télé (loin) + vision</td></tr><tr><td>biologie</td><td>bio (vie) + logie (science)</td></tr><tr><td>chronomètre</td><td>chrono (temps) + mètre (mesure)</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Tous les mots ne viennent pas du latin ou du grec : « sucre » et « algèbre » viennent de l’arabe, « balcon » de l’italien, « week-end » de l’anglais.</li></ul>','wa'],['🧠 Astuce','<p>Décompose les mots savants : télé | phone.</p>',''],['✅ Je retiens','<p>Latin et grec donnent beaucoup de racines : aqua = eau, télé = loin, bio = vie, chrono = temps.</p>','re']],
qs:[Q('La racine latine « aqua » signifie…',['eau','terre','feu'],0,['Oui : aquarium, aquatique…','« Terre » se dit terra.','Ce n’est pas son sens.']),
Q('La racine grecque « télé » signifie…',['loin','petit','lumière'],0,['Oui : télévision, téléphone.','« Petit » se dit micro.','« Lumière » se dit photo.']),
Q('La racine grecque « micro » signifie…',['grand','petit','lumière'],1,['« Grand » se dit macro.','Oui : microscope, microbe.','« Lumière » se dit photo.']),
Q('Que signifie « biologie » (bio + logie) ?',['la science de la vie','l’histoire du temps','l’étude de l’eau'],0,['Oui : bio = vie, logos = science.','Ce serait « chronologie ».','Ce serait une étude de « aqua ».']),
Q('Dans « chronomètre », « chrono » signifie…',['temps','lumière','terre'],0,['Oui : chronomètre mesure le temps.','« Lumière » se dit photo.','« Terre » se dit terra.']),
VF('Tous les mots français viennent du latin.',false,['Non : beaucoup viennent d’autres langues.','Oui, c’est Faux : « sucre » vient de l’arabe, « week-end » de l’anglais.']),
F('Complète : « photo » signifie ___.',['lumière','la lumière'],'Photographie : écrire avec la lumière.','Le mot commence par l.'),
M('Associe chaque racine à son sens.',[['aqua','eau'],['terra','terre'],['graphein','écrire'],['phone','voix, son']],'Pense à un mot de chaque famille (aquarium, terrain, graphie, téléphone).'),
T('Touche l’élément grec qui signifie « loin ».',['télé','vision'],[0],'« Télé » signifie « loin » : télévision = voir de loin.')]},
{id:'V-03',lv:2,dom:'Vocabulaire',t:'Synonymes, antonymes et registres de langue',kw:'synonymes antonymes contraires registre familier courant soutenu nuances',
f:[['🔎 Je découvre','<p>« content, heureux, ravi » / « bouquin, livre, ouvrage »</p><p class="mut">Un même objet peut se dire de plusieurs façons.</p>',''],['💡 À savoir','<p>Les mots entretiennent des relations de sens (<b>synonymes</b>, <b>antonymes</b>) et se répartissent en <b>registres de langue</b>.</p>',''],['📏 La règle','<ul><li><b>Synonymes</b> : mots de sens proche et de même nature (joli / beau). Il reste souvent une nuance.</li><li><b>Antonymes</b> : mots de sens contraire (grand / petit, possible / impossible).</li><li><b>Registres</b> : familier (bouquin), courant (livre), soutenu (ouvrage). On adapte le registre à la situation.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Relation</th><th>Exemple</th></tr><tr><td>synonymes</td><td>joli / beau</td></tr><tr><td>antonymes</td><td>grand / petit</td></tr><tr><td>registres</td><td>bouquin (familier) / livre / ouvrage (soutenu)</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Deux synonymes ne sont pas toujours interchangeables : « maigre » et « mince » n’ont pas la même nuance.</li></ul>','wa'],['🧠 Astuce','<p>Remplace le mot dans la phrase : si le sens ou le ton change, ce n’est pas un parfait synonyme.</p>',''],['✅ Je retiens','<p>Synonymes = sens proche. Antonymes = sens contraire. Registre = niveau de langue à adapter.</p>','re']],
qs:[Q('Quel est un synonyme de « joli » ?',['laid','beau','long'],1,['« Laid » est l’antonyme de « joli ».','Oui : « beau » a un sens proche.','Ce n’est pas un synonyme.']),
Q('Quel est l’antonyme de « grand » ?',['petit','immense','haut'],0,['Oui : sens contraire.','« Immense » est plus fort que « grand ».','« Haut » n’est pas son contraire.']),
Q('Quel mot est du registre familier ?',['bouquin','livre','ouvrage'],0,['Oui : « bouquin » est familier.','« Livre » est du registre courant.','« Ouvrage » est plutôt soutenu.']),
Q('Quel mot est du registre soutenu ?',['bouquin','livre','ouvrage'],2,['« Bouquin » est familier.','« Livre » est courant.','Oui : « ouvrage » est soutenu.']),
Q('Dans un courrier adressé à un directeur, quel registre choisir ?',['familier','courant ou soutenu','argot'],1,['Le familier est réservé à des proches.','Oui : on adapte le registre à la situation.','L’argot ne convient pas.']),
VF('Deux synonymes sont toujours interchangeables dans toutes les phrases.',false,['Non : il y a des nuances.','Oui, c’est Faux : « maigre » et « mince » ne disent pas la même chose.']),
F('Complète : « L’antonyme de « possible » est ___. »',['impossible'],'Le préfixe im- exprime le contraire.','Commence par im-.'),
M('Associe chaque mot à son registre.',[['bouquin','Familier'],['livre','Courant'],['ouvrage','Soutenu']],'Choisis le niveau de langue de chaque mot.'),
T('Touche le mot familier.',['Ce','gosse','est','très','gentil.'],[1],'« Gosse » est familier ; le mot courant est « enfant ».')]},
{id:'V-04',lv:2,dom:'Vocabulaire',t:'Sens propre, sens figuré, polysémie, connotation',kw:'sens propre figuré polysémie connotation dénotation expression imagée',
f:[['🔎 Je découvre','<p>« Il mange une pomme. » / « Il dévore un livre. »</p><p class="mut">Le même verbe change de sens selon le contexte.</p>',''],['💡 À savoir','<p>Un mot peut avoir plusieurs sens. Le <b>contexte</b> permet de choisir le bon.</p>',''],['📏 La règle','<ul><li><b>Sens propre</b> : sens premier, concret (il mange une pomme).</li><li><b>Sens figuré</b> : sens imagé (il dévore un livre ; un cœur de pierre).</li><li><b>Polysémie</b> : un mot a plusieurs sens (une souris : animal ou ordinateur).</li><li><b>Dénotation</b> : sens objectif. <b>Connotation</b> : valeur subjective associée au mot (mince est plutôt positif, maigre plutôt négatif).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Notion</th><th>Exemple</th></tr><tr><td>sens propre</td><td>Il mange une pomme.</td></tr><tr><td>sens figuré</td><td>Il dévore un livre.</td></tr><tr><td>polysémie</td><td>une souris (animal / ordinateur)</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Une expression figurée ne se comprend pas mot à mot : « il pleut des cordes » signifie « il pleut beaucoup ».</li></ul>','wa'],['🧠 Astuce','<p>Essaie de comprendre le mot au sens concret : si la phrase n’a plus de sens, c’est du figuré.</p>',''],['✅ Je retiens','<p>Propre = concret. Figuré = imagé. Dénotation = objectif. Connotation = subjectif.</p>','re']],
qs:[Q('Dans « Il dévore un livre », « dévore » est employé…',['au sens propre','au sens figuré','au sens littéral'],1,['Il ne mange pas le livre.','Oui : il lit avec avidité.','Ce n’est pas le cas ici.']),
Q('Dans « Il mange une pomme », « mange » est employé…',['au sens propre','au sens figuré','au sens imagé'],0,['Oui : sens premier et concret.','Il n’y a pas d’image ici.','Il n’y a pas d’image ici.']),
Q('« Une souris » (animal ou ordinateur) est un exemple de…',['synonymie','polysémie','comparaison'],1,['Il n’y a pas deux mots de sens proche.','Oui : un mot, plusieurs sens.','Il n’y a pas d’outil de comparaison.']),
Q('Quel mot a la connotation la plus négative ?',['mince','maigre','élancé'],1,['« Mince » est plutôt positif.','Oui : « maigre » est plutôt négatif.','« Élancé » est plutôt positif.']),
Q('« Il pleut des cordes » signifie…',['il pleut beaucoup','des cordes tombent du ciel','il fait froid'],0,['Oui : expression imagée.','Ce n’est pas le sens littéral.','Il n’est pas question de froid.']),
VF('La connotation est le sens objectif du mot.',false,['Non : c’est la dénotation.','Oui, c’est Faux : la connotation est subjective.']),
F('Le sens objectif d’un mot s’appelle la ___.',['dénotation'],'La dénotation est le sens de base, partagé par tous.','Commence par d.'),
M('Associe chaque notion à sa définition.',[['sens propre','Sens premier, concret'],['sens figuré','Sens imagé'],['polysémie','Plusieurs sens pour un mot'],['connotation','Valeur subjective associée au mot']],'Pense à un exemple pour chaque notion.'),
T('Touche l’expression au sens figuré.',['Il','a','un','cœur','de','pierre.'],[3,4,5],'« Un cœur de pierre » : image pour dire qu’il est sans pitié.')]},
{id:'V-05',lv:2,dom:'Vocabulaire',t:'Champs lexicaux et champs sémantiques',kw:'champ lexical champ sémantique thème famille de mots atmosphère sens',
f:[['🔎 Je découvre','<p>« ciel, nuages, pluie, orage, tonnerre »</p><p class="mut">Tous ces mots parlent du même thème : la météo.</p>',''],['💡 À savoir','<p>Un <b>champ lexical</b> est l’ensemble des mots d’un texte qui se rapportent à un même thème. Un <b>champ sémantique</b> est l’ensemble des sens d’un mot.</p>',''],['📏 La règle','<ul><li><b>Champ lexical</b> : mots de natures variées (noms, verbes, adjectifs) sur un thème (la mer : vague, plage, naviguer, salé).</li><li>Il crée une <b>atmosphère</b> dans un texte.</li><li><b>Champ sémantique</b> : tous les sens d’un mot (feu : flamme, incendie, signal, ardeur).</li><li><b>Famille de mots</b> : mots de même radical (terre, terrain, atterrir).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Thème</th><th>Champ lexical</th></tr><tr><td>la peur</td><td>frisson, terreur, trembler, effrayant, pâle</td></tr><tr><td>la météo</td><td>pluie, nuage, tonnerre, orage</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Ne confonds pas champ lexical (même thème) et famille de mots (même radical).</li></ul>','wa'],['🧠 Astuce','<p>Nomme d’abord le thème en un mot, puis relève les mots qui s’y rapportent.</p>',''],['✅ Je retiens','<p>Champ lexical = même thème. Champ sémantique = tous les sens d’un mot. Famille = même radical.</p>','re']],
qs:[Q('Quel mot n’appartient pas au champ lexical de la mer ?',['vague','montagne','navire'],1,['Il appartient au champ lexical de la mer.','Oui : il est hors thème.','Il appartient au champ lexical de la mer.']),
Q('Quel est le thème du champ lexical « terreur, trembler, pâle, effrayant » ?',['la peur','la joie','la faim'],0,['Oui : tous ces mots évoquent la peur.','Aucun mot n’évoque la joie.','Aucun mot n’évoque la faim.']),
Q('Un champ lexical regroupe des mots…',['du même thème','de même radical','de même terminaison'],0,['Oui : ils se rapportent à un thème.','Ce serait une famille de mots.','Ce n’est pas le critère.']),
Q('« terre, terrain, atterrir » forment…',['un champ lexical','une famille de mots','un champ sémantique'],1,['Ils n’ont pas seulement un thème commun.','Oui : ils ont le même radical.','Ce ne sont pas les sens d’un même mot.']),
Q('Le champ sémantique d’un mot est…',['l’ensemble des sens de ce mot','l’ensemble des mots d’un thème','la famille de ce mot'],0,['Oui : tous les sens possibles du mot.','Ce serait un champ lexical.','Ce serait une famille de mots.']),
VF('Les mots d’un champ lexical peuvent avoir des natures différentes.',true,['Oui, c’est Vrai : noms, verbes, adjectifs.','Non : ils peuvent être de natures variées.']),
F('Complète : « pluie, nuage, tonnerre » appartiennent au champ lexical de la ___.',['météo','meteo'],'Le thème commun est le temps qu’il fait.','Mot de 5 lettres.'),
M('Associe chaque notion à sa définition.',[['champ lexical','Mots liés à un même thème'],['champ sémantique','Ensemble des sens d’un mot'],['famille de mots','Mots de même radical']],'Distingue thème, sens et radical.'),
T('Touche le mot qui n’appartient pas au champ lexical de la mer.',['vague','plage','montagne','navire','sable'],[2],'« Montagne » est hors du thème de la mer.')]},
{id:'L-01',lv:1,dom:'Lecture',t:'Comprendre un texte : repérer, déduire, reformuler',kw:'comprendre texte explicite implicite inférence reformuler indices lecture repérer',
f:[['🔎 Je découvre','<p>« Sur le quai, le train partait déjà. Lina courut, le sac cognant contre sa hanche. Elle arriva essoufflée devant les portes qui se fermaient. »</p><p>Lina est-elle en avance ou en retard ? Le texte le dit-il ?</p><p class="mut">Il ne le dit pas, mais les indices (elle court, essoufflée, le train part) le montrent.</p>',''],['💡 À savoir','<p>Comprendre un texte, c’est repérer ce qui est <b>écrit</b>, <b>déduire</b> ce qui ne l’est pas, et savoir le <b>redire</b> avec ses mots.</p>',''],['📏 La règle','<ul><li><b>Explicite</b> : écrit dans le texte. On le <b>repère</b>.</li><li><b>Implicite</b> : non écrit, on le <b>déduit</b> (inférence) à partir d’indices.</li><li><b>Reformuler</b> : redire avec ses propres mots, sans recopier.</li><li>Méthode : lis en entier, repère qui, où, quand, relis la question, justifie avec le texte.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Information</th><th>Type</th></tr><tr><td>Lina court.</td><td>explicite</td></tr><tr><td>Lina est pressée.</td><td>implicite (déduit)</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Ne dis pas ce que le texte ne permet pas de déduire. Ne recopie pas toute la phrase.</li></ul>','wa'],['🧠 Astuce','<p>Demande-toi : « Je le lis dans le texte, ou je le déduis grâce à des indices ? »</p>',''],['✅ Je retiens','<p>Explicite = écrit. Implicite = déduit grâce aux indices. Reformuler = redire avec ses mots.</p>','re']],
qs:[Q('« Sur le quai, le train partait déjà. Lina courut, le sac cognant contre sa hanche. Elle arriva essoufflée devant les portes qui se fermaient. » Où se passe la scène ?',['Sur un quai','Dans un bus','À l’école'],0,['Oui : c’est écrit (« sur le quai »).','Rien ne l’indique.','Rien ne l’indique.']),
Q('« Sur le quai, le train partait déjà. Lina courut, le sac cognant contre sa hanche. Elle arriva essoufflée devant les portes qui se fermaient. » Que fait Lina ?',['Elle attend','Elle court','Elle dort'],1,['Le texte dit le contraire.','Oui : « Lina courut ».','Le texte ne le dit pas.']),
Q('« Sur le quai, le train partait déjà. Lina courut, le sac cognant contre sa hanche. Elle arriva essoufflée devant les portes qui se fermaient. » L’information « Lina est pressée » est…',['explicite','implicite','fausse'],1,['Le mot « pressée » n’est pas écrit.','Oui : on la déduit des indices.','Les indices montrent qu’elle est vraie.']),
Q('« Sur le quai, le train partait déjà. Lina courut, le sac cognant contre sa hanche. Elle arriva essoufflée devant les portes qui se fermaient. » Quel indice montre qu’elle est pressée ?',['Elle courut et arriva essoufflée','Il faisait beau','Elle avait un sac'],0,['Oui : courir et être essoufflée montrent l’urgence.','Le texte ne le dit pas.','Ce n’est pas un indice de hâte.']),
Q('Comment reformuler « Le train partait déjà » ?',['Le train était en train de partir','Le train venait d’arriver','Le train était en retard'],0,['Oui : le sens est conservé.','Cela change le sens.','Cela change le sens.']),
VF('Une inférence repose sur des indices du texte.',true,['Oui, c’est Vrai.','Non : on ne doit pas inventer.']),
F('Une information non écrite mais déduite est ___.',['implicite'],'L’implicite se déduit grâce aux indices.','Commence par i.'),
M('Associe chaque notion à sa définition.',[['explicite','Écrit dans le texte'],['implicite','À déduire grâce aux indices'],['reformuler','Redire avec ses propres mots']],'Pense à la différence entre dire et déduire.'),
T('Touche le verbe qui montre que Lina est pressée.',['Lina','courut,','le','sac','cognant','contre','sa','hanche.'],[1],'« Courut » montre la hâte.')]},
{id:'L-02',lv:2,dom:'Lecture',t:'Narrateur, point de vue et schéma narratif',kw:'narrateur focalisation interne externe zéro schéma narratif élément perturbateur péripéties point de vue récit',
f:[['🔎 Je découvre','<p>« Je poussai la porte. » / « Il poussa la porte. »</p><p class="mut">Dans la 1re, le narrateur est un personnage. Dans la 2e, il reste extérieur.</p>',''],['💡 À savoir','<p>Un <b>narrateur</b> raconte l’histoire. Son <b>point de vue</b> (focalisation) détermine ce qu’on sait des personnages.</p>',''],['📏 La règle','<ul><li><b>Narrateur interne</b> : un personnage qui dit « je ». <b>Narrateur externe</b> : extérieur, qui dit « il / elle ».</li><li><b>Focalisation interne</b> : on voit par un personnage (pensées, sensations).</li><li><b>Focalisation externe</b> : on voit de l’extérieur (gestes, paroles, pas de pensées).</li><li><b>Focalisation zéro</b> : le narrateur sait tout.</li><li><b>Schéma narratif</b> : situation initiale → élément perturbateur → péripéties → résolution → situation finale.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Extrait</th><th>Focalisation</th></tr><tr><td>Léa entra, le cœur serré ; elle craignait la réponse.</td><td>interne</td></tr><tr><td>Un homme entra, s’assit, ne dit rien.</td><td>externe</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Le narrateur n’est pas l’auteur : un « je » peut être un personnage imaginaire.</li></ul>','wa'],['🧠 Astuce','<p>Cherche les pensées : si on entre dans la tête d’un seul personnage, c’est la focalisation interne.</p>',''],['✅ Je retiens','<p>Narrateur interne (je) ou externe (il). Focalisation interne, externe ou zéro.</p>','re']],
qs:[Q('« Je poussai la porte et mon cœur battait. » Qui raconte ?',['Un personnage (« je »)','Quelqu’un d’extérieur','L’auteur du livre'],0,['Oui : le « je » est un personnage.','Ce serait « il » ou « elle ».','Le narrateur n’est pas l’auteur.']),
Q('« Il poussa la porte. Elle grinça. » Le narrateur est…',['un personnage (« je »)','extérieur à l’histoire','l’auteur'],1,['Il n’y a pas de « je ».','Oui : il dit « il ».','Le narrateur n’est pas l’auteur.']),
Q('« Léa entra, le cœur serré ; elle craignait la réponse. » La focalisation est…',['externe','interne','zéro'],1,['On connaît ses pensées : ce n’est pas externe.','Oui : on entre dans la tête de Léa.','Le narrateur ne sait pas tout, seulement Léa.']),
Q('« Un homme entra, s’assit, ne dit rien. » La focalisation est…',['interne','externe','zéro'],1,['Aucune pensée n’est rapportée.','Oui : on voit de l’extérieur.','Le narrateur ne donne pas tout.']),
Q('Quel élément déclenche l’action ?',['situation finale','élément perturbateur','résolution'],1,['C’est la fin de l’histoire.','Oui : il change la situation de départ.','C’est la fin du problème.']),
VF('Le narrateur est toujours l’auteur du livre.',false,['Non : le narrateur est une voix du récit.','Oui, c’est Faux : le narrateur peut être un personnage fictif.']),
F('Dans un récit à la 1re personne, le narrateur dit « ___ ».',['je'],'Le narrateur est un personnage.','Pronom de 2 lettres.'),
M('Associe chaque notion à sa définition.',[['focalisation interne','Pensées d’un personnage'],['focalisation externe','Gestes et paroles seulement'],['focalisation zéro','Le narrateur sait tout']],'Regarde ce que le narrateur montre.'),
O('Remets les étapes du schéma narratif dans l’ordre.',['Situation initiale','Élément perturbateur','Péripéties','Résolution','Situation finale'],'Cet ordre structure la plupart des récits.')]},
{id:'L-03',lv:1,dom:'Lecture',t:'Description, portrait et cadre spatio-temporel',kw:'description portrait cadre spatio-temporel lieu temps imparfait sens physique moral',
f:[['🔎 Je découvre','<p>« Le vieux marchand, petit et voûté, portait un manteau râpé. La boutique sentait le cuir et la poussière. »</p><p class="mut">On voit, on sent : la description fait vivre le lieu et le personnage.</p>',''],['💡 À savoir','<p>Une <b>description</b> dit comment est un lieu, un objet ou un personnage. Le <b>cadre spatio-temporel</b> dit <b>où</b> et <b>quand</b> se passe l’histoire.</p>',''],['📏 La règle','<ul><li><b>Cadre spatio-temporel</b> : lieu + moment (un soir d’hiver, dans une petite ville du Nord).</li><li><b>Portrait</b> : physique (taille, visage, vêtements) et moral (caractère).</li><li>On décrit surtout à l’<b>imparfait</b>, avec des marqueurs de lieu (à gauche, au fond) et les cinq sens.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Élément</th><th>Exemple</th></tr><tr><td>lieu</td><td>dans une petite ville du Nord</td></tr><tr><td>temps</td><td>un soir d’hiver</td></tr><tr><td>physique</td><td>petit et voûté</td></tr><tr><td>moral</td><td>têtu et généreux</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Une description ne se limite pas à la vue : pense à l’odorat, à l’ouïe, au toucher.</li></ul>','wa'],['🧠 Astuce','<p>Relève d’abord : qui ou quoi ? où ? quand ? Puis les adjectifs.</p>',''],['✅ Je retiens','<p>Cadre = où + quand. Portrait = physique + moral. Description à l’imparfait, avec les cinq sens.</p>','re']],
qs:[Q('Le cadre spatio-temporel indique…',['le lieu et le moment','le caractère','la morale'],0,['Oui : où et quand.','C’est le portrait moral.','Ce n’est pas son rôle.']),
Q('« Un soir d’hiver, dans une petite ville du Nord » donne…',['le cadre spatio-temporel','un portrait','le dénouement'],0,['Oui : le moment et le lieu.','Il ne décrit pas un personnage.','Il n’annonce pas la fin.']),
Q('Un portrait moral décrit…',['l’apparence','le caractère','le lieu'],1,['C’est le portrait physique.','Oui : les qualités et défauts.','C’est un décor.']),
Q('Quel temps utilise-t-on surtout pour décrire le décor dans un récit au passé ?',['le passé simple','l’imparfait','le futur'],1,['Il raconte les actions principales.','Oui : il décrit le décor.','Il ne convient pas à un récit au passé.']),
Q('« La boutique sentait le cuir et la poussière. » Quel sens est sollicité ?',['la vue','l’odorat','l’ouïe'],1,['Aucun élément visuel précis.','Oui : « sentait ».','Aucun son n’est évoqué.']),
VF('Une description ne fait appel qu’à la vue.',false,['Non : tous les sens peuvent être utilisés.','Oui, c’est Faux : odorat, ouïe, toucher…']),
F('Dans « au fond de la pièce », « au fond » est un marqueur de ___.',['lieu','espace'],'Il indique où se trouve quelque chose.','Commence par l.'),
M('Associe chaque élément à sa nature.',[['à gauche','Indicateur de lieu'],['un soir d’hiver','Indicateur de temps'],['grand et voûté','Portrait physique'],['têtu et généreux','Portrait moral']],'Distingue lieu, temps, physique, moral.'),
T('Touche les mots qui décrivent le physique du marchand.',['Le','vieux','marchand,','petit','et','voûté,','portait','un','manteau','râpé.'],[3,4,5],'« Petit et voûté » décrit son corps.')]},
{id:'L-04',lv:2,dom:'Lecture',t:'Le récit réaliste et le récit fantastique',kw:'récit réaliste fantastique merveilleux surnaturel hésitation peur effet de réel',
f:[['🔎 Je découvre','<p>« Paul gara sa voiture devant la boulangerie. » / « La clé tourna toute seule ; une ombre traversa le mur. »</p><p class="mut">Le premier passage est crédible ; le second inquiète.</p>',''],['💡 À savoir','<p>Un récit <b>réaliste</b> ressemble au réel. Un récit <b>fantastique</b> introduit un événement inexplicable dans un monde réel.</p>',''],['📏 La règle','<ul><li><b>Réaliste</b> : cadre précis, détails crédibles (effet de réel), explications rationnelles.</li><li><b>Fantastique</b> : monde réel + événement surnaturel + <b>hésitation</b> et <b>peur</b> (rêve ? folie ? réalité ?).</li><li><b>Merveilleux</b> : le surnaturel est accepté comme normal (contes).</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Genre</th><th>Indice</th></tr><tr><td>réaliste</td><td>lieux, prix, horaires précis</td></tr><tr><td>fantastique</td><td>« il me sembla », ombre sans corps</td></tr><tr><td>merveilleux</td><td>fées, dragons acceptés</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Réaliste ne veut pas dire « vrai » : l’histoire reste inventée.</li><li>Fantastique ≠ merveilleux.</li></ul>','wa'],['🧠 Astuce','<p>Le surnaturel est-il accepté naturellement ? Oui : merveilleux. Il inquiète et on doute : fantastique.</p>',''],['✅ Je retiens','<p>Réaliste = crédible. Fantastique = inexplicable + doute. Merveilleux = surnaturel normal.</p>','re']],
qs:[Q('« La clé tourna toute seule ; une ombre sans corps traversa le mur. » Ce passage est plutôt…',['réaliste','fantastique','documentaire'],1,['Rien n’est crédible ici.','Oui : événement inexplicable dans un décor réel.','Ce n’est pas un texte informatif.']),
Q('« Paul gara sa voiture devant la boulangerie et acheta deux baguettes. » est plutôt…',['réaliste','fantastique','merveilleux'],0,['Oui : tout est crédible.','Rien de surnaturel.','Rien de surnaturel.']),
Q('Dans un récit fantastique, on ressent souvent…',['la certitude et la joie','l’hésitation et la peur','l’ennui'],1,['Le doute domine.','Oui : on hésite entre explication rationnelle et surnaturel.','Ce n’est pas l’effet recherché.']),
Q('Quand le surnaturel est accepté comme normal (conte de fées), on parle de…',['merveilleux','fantastique','réalisme'],0,['Oui : la magie est acceptée.','Dans le fantastique, le surnaturel inquiète.','Ce n’est pas du réalisme.']),
Q('Qu’est-ce qui donne un « effet de réel » ?',['des détails précis et crédibles','des monstres','des formules magiques'],0,['Oui : lieux, dates, objets précis.','Ce serait du surnaturel.','Ce serait du surnaturel.']),
VF('Un récit réaliste raconte toujours des faits vrais.',false,['Non : il peut être inventé.','Oui, c’est Faux : réaliste = crédible, pas forcément vrai.']),
F('Quand le surnaturel est accepté comme normal, le récit est dit ___.',['merveilleux'],'Les contes sont merveilleux.','Mot de 10 lettres.'),
M('Associe chaque genre à sa définition.',[['réaliste','Cadre et faits crédibles'],['fantastique','Événement inexplicable qui inquiète'],['merveilleux','Surnaturel accepté comme normal']],'Pense à un exemple de chaque.'),
T('Touche le groupe qui montre l’événement étrange.',['La','clé','tourna','toute','seule','dans','la','nuit.'],[3,4],'« Toute seule » : la clé ne peut pas tourner sans main.')]},
{id:'L-06',lv:2,dom:'Lecture',t:'La poésie amoureuse : vers, strophes, rimes',kw:'poésie vers strophe quatrain tercet rime croisées plates embrassées alexandrin octosyllabe lyrisme amour',
f:[['🔎 Je découvre','<p>« Quand le soir descend sur la mer, / Je pense à toi, mon seul trésor ; / Ton nom se perd dans le vent clair, / Et mon cœur, lui, te cherche encore. »</p><p class="mut">Un quatrain de 4 vers qui parle du manque de l’être aimé.</p>',''],['💡 À savoir','<p>Un <b>poème</b> est écrit en <b>vers</b>, regroupés en <b>strophes</b>. La poésie amoureuse exprime des sentiments : c’est le <b>lyrisme</b>.</p>',''],['📏 La règle','<ul><li><b>Strophes</b> : distique (2 vers), tercet (3), quatrain (4).</li><li><b>Rimes</b> : plates (AABB), croisées (ABAB), embrassées (ABBA).</li><li><b>Mesure</b> : octosyllabe (8 syllabes), alexandrin (12). Le « e » muet se compte devant une consonne, pas devant une voyelle ni en fin de vers.</li><li><b>Thèmes</b> : amour, absence, beauté, souvenir.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Élément</th><th>Dans le poème</th></tr><tr><td>strophe</td><td>un quatrain</td></tr><tr><td>rimes</td><td>mer / clair (A), trésor / encore (B) : croisées</td></tr><tr><td>mesure</td><td>octosyllabes</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Pour les rimes, écoute les sons, pas les lettres. Le « e » muet final ne compte pas dans les syllabes.</li></ul>','wa'],['🧠 Astuce','<p>Compte les syllabes sur les doigts et repère le son final de chaque vers.</p>',''],['✅ Je retiens','<p>Vers, strophes, rimes et mesure structurent un poème. La poésie amoureuse exprime des sentiments.</p>','re']],
qs:[Q('« Quand le soir descend sur la mer, / Je pense à toi, mon seul trésor ; / Ton nom se perd dans le vent clair, / Et mon cœur, lui, te cherche encore. » Cette strophe est…',['un tercet','un quatrain','un distique'],1,['Un tercet compte 3 vers.','Oui : 4 vers.','Un distique compte 2 vers.']),
Q('« Quand le soir descend sur la mer, / Je pense à toi, mon seul trésor ; / Ton nom se perd dans le vent clair, / Et mon cœur, lui, te cherche encore. » Les rimes sont…',['plates','croisées','embrassées'],1,['Plates : AABB.','Oui : mer / clair, trésor / encore : ABAB.','Embrassées : ABBA.']),
Q('« Quand le soir descend sur la mer, / Je pense à toi, mon seul trésor ; / Ton nom se perd dans le vent clair, / Et mon cœur, lui, te cherche encore. » Les vers sont des…',['octosyllabes','alexandrins','décasyllabes'],0,['Oui : 8 syllabes par vers.','Un alexandrin compte 12 syllabes.','Un décasyllabe compte 10 syllabes.']),
Q('Dans ce poème, « mer » rime avec…',['trésor','clair','vent'],1,['« Trésor » rime avec « encore ».','Oui : même son final.','Ce n’est pas le même son.']),
Q('Un alexandrin compte…',['8 syllabes','10 syllabes','12 syllabes'],2,['C’est un octosyllabe.','C’est un décasyllabe.','Oui : 12 syllabes.']),
Q('Quel sentiment domine dans ce poème ?',['la colère','le manque de l’être aimé','la joie'],1,['Aucun mot n’exprime la colère.','Oui : « te cherche encore », « ton nom se perd ».','Le ton est mélancolique.']),
VF('Le « e » muet en fin de vers ne se compte pas.',true,['Oui, c’est Vrai.','Non : c’est la règle du décompte.']),
F('Un poème de quatre vers s’appelle un ___.',['quatrain'],'Quatre vers : un quatrain.','Commence par q.'),
M('Associe chaque terme à sa définition.',[['distique','2 vers'],['tercet','3 vers'],['quatrain','4 vers'],['lyrisme','Expression des sentiments personnels']],'Compte les vers et pense aux émotions.')]},
{id:'L-07',lv:2,dom:'Lecture',t:'Le texte argumentatif : thèse, arguments, exemples',kw:'argumentatif thèse argument exemple connecteurs logiques opinion réfutation concession',
f:[['🔎 Je découvre','<p>« Les téléphones devraient être interdits en classe. En effet, ils distraient les élèves. Par exemple, une notification suffit à faire perdre le fil du cours. »</p><p class="mut">Une opinion, une raison, un exemple : c’est le modèle de l’argumentation.</p>',''],['💡 À savoir','<p><b>Argumenter</b>, c’est défendre une opinion (la <b>thèse</b>) avec des <b>arguments</b> et des <b>exemples</b>.</p>',''],['📏 La règle','<ul><li><b>Thèse</b> : l’opinion défendue.</li><li><b>Argument</b> : une raison qui soutient la thèse.</li><li><b>Exemple</b> : un cas précis qui illustre l’argument.</li><li><b>Connecteurs logiques</b> : d’abord, en effet, car, donc, par exemple, mais, en conclusion.</li><li>On peut aussi <b>réfuter</b> la thèse adverse.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Élément</th><th>Dans l’extrait</th></tr><tr><td>thèse</td><td>Les téléphones devraient être interdits.</td></tr><tr><td>argument</td><td>Ils distraient les élèves.</td></tr><tr><td>exemple</td><td>Une notification fait perdre le fil.</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Un exemple n’est pas un argument : il illustre une raison, il ne la remplace pas.</li></ul>','wa'],['🧠 Astuce','<p>Thèse → « je pense que ». Argument → « parce que ». Exemple → « par exemple ».</p>',''],['✅ Je retiens','<p>Thèse + arguments + exemples, reliés par des connecteurs logiques.</p>','re']],
qs:[Q('« Les téléphones devraient être interdits en classe. En effet, ils distraient les élèves. Par exemple, une notification suffit à faire perdre le fil du cours. » Quelle est la thèse ?',['Les téléphones devraient être interdits en classe.','Ils distraient les élèves.','Une notification fait perdre le fil.'],0,['Oui : c’est l’opinion défendue.','C’est l’argument.','C’est l’exemple.']),
Q('« Les téléphones devraient être interdits en classe. En effet, ils distraient les élèves. Par exemple, une notification suffit à faire perdre le fil du cours. » « Ils distraient les élèves » est…',['la thèse','un argument','un exemple'],1,['La thèse est la première phrase.','Oui : une raison qui soutient la thèse.','L’exemple est la dernière phrase.']),
Q('« Les téléphones devraient être interdits en classe. En effet, ils distraient les élèves. Par exemple, une notification suffit à faire perdre le fil du cours. » « Une notification suffit à faire perdre le fil du cours » est…',['la thèse','un argument','un exemple'],2,['Ce n’est pas l’opinion.','Ce n’est pas une raison générale.','Oui : un cas précis.']),
Q('Quel connecteur introduit un exemple ?',['par exemple','en conclusion','mais'],0,['Oui.','Il introduit la conclusion.','Il introduit une opposition.']),
Q('« Mais » introduit…',['un exemple','une opposition','une conséquence'],1,['Non.','Oui : il oppose deux idées.','Non.']),
VF('Un exemple suffit à remplacer un argument.',false,['Non : il illustre, il ne prouve pas seul.','Oui, c’est Faux : il faut une raison générale.']),
F('La thèse est l’___ défendue par l’auteur.',['opinion'],'La thèse est la position de l’auteur.','Commence par o.'),
M('Associe chaque terme à sa définition.',[['thèse','Opinion défendue'],['argument','Raison qui soutient la thèse'],['exemple','Cas précis qui illustre un argument'],['connecteur','Mot qui relie les idées']],'Cherche le rôle de chaque élément.'),
T('Touche le connecteur logique.',['En','effet,','ils','distraient','les','élèves.'],[0,1],'« En effet » introduit un argument.')]},
{id:'L-08',lv:2,dom:'Lecture',t:'L’article de presse : fait, opinion, sources',kw:'article presse titre chapeau fait opinion source information journal journaliste vérifier',
f:[['🔎 Je découvre','<p>« La piste cyclable mesure 3 kilomètres. » / « C’est la meilleure décision de l’année. »</p><p class="mut">Le 1er énoncé se vérifie ; le 2e est un jugement.</p>',''],['💡 À savoir','<p>Un <b>article de presse</b> informe. Il faut distinguer les <b>faits</b> (vérifiables) des <b>opinions</b> (jugements) et vérifier les <b>sources</b>.</p>',''],['📏 La règle','<ul><li><b>Structure</b> : titre, chapeau (résume l’essentiel), corps de l’article.</li><li><b>Cinq questions</b> : qui, quoi, où, quand, pourquoi.</li><li><b>Fait</b> : vérifiable (chiffre, date, événement). <b>Opinion</b> : jugement (meilleur, scandaleux, je pense).</li><li><b>Source</b> : origine de l’information. On croise plusieurs sources.</li></ul>',''],['🧩 Exemples','<div class="tw"><table><tr><th>Énoncé</th><th>Nature</th></tr><tr><td>La piste mesure 3 km.</td><td>fait</td></tr><tr><td>C’est une décision magnifique.</td><td>opinion</td></tr></table></div>','ok'],['⚠️ Attention !','<ul><li>Un titre accrocheur peut exagérer. Une citation n’est pas un fait : c’est ce que quelqu’un a dit.</li></ul>','wa'],['🧠 Astuce','<p>Peut-on vérifier ? Oui : fait. Non, c’est un jugement : opinion.</p>',''],['✅ Je retiens','<p>Fait = vérifiable. Opinion = jugement. Toujours regarder la source.</p>','re']],
qs:[Q('« La piste cyclable mesure 3 kilomètres. » est…',['un fait','une opinion','une rumeur'],0,['Oui : on peut le vérifier.','Ce n’est pas un jugement.','Rien n’indique qu’il soit incertain.']),
Q('« C’est la meilleure décision de l’année. » est…',['un fait','une opinion','une source'],1,['On ne peut pas le vérifier.','Oui : « meilleure » exprime un jugement.','Ce n’est pas une origine d’information.']),
Q('Le chapeau d’un article…',['résume l’essentiel','donne l’avis du journaliste','conclut l’article'],0,['Oui : il est placé sous le titre.','Ce n’est pas son rôle.','Il ouvre l’article, il ne le conclut pas.']),
